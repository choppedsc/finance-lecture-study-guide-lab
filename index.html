    },
  }],
  text(v, o) {
    let t = `<p>After ${v.k} payments of ${M(o.pay)}, you still owe <b>${M(o.Bk)}</b>: the PV of the ${o.rem} payments left. You’ve paid ${M(v.k * o.pay)}, but only <b>${M(o.prin)}</b> went to principal; <b>${M(o.intr)}</b> was interest. Early payments are mostly interest, which is why the balance falls slowly at first.</p><p class="aside">Interest builds for a month before the next payment, so just before payment ${v.k + 1} the balance is ${M(o.Bk)} × (1 + ${PT(o.r)}) = ${M(o.before)}.</p>`;
    if (v.E > 0) t += `<p>Paying an extra ${M(v.E)} now drops the balance to ${M(o.Bx)}. Spread over the same ${o.rem} payments, the payment falls to <b>${M(o.newPay)}</b>.</p>`;
    return t;
  },
  excel(v, o) {
    const rt = exRate(v.apr, v.m);
    const pm = `PMT(${rt}, ${v.n}, -${v.P})`;
    const rows = [['Payment', '=' + pm, M(o.pay)], [`Balance after ${v.k}`, `=PV(${rt}, ${o.rem}, -${pm})`, M(o.Bk)]];
    if (v.E > 0) rows.push(['New payment', `=PMT(${rt}, ${o.rem}, -(PV(${rt}, ${o.rem}, -${pm})-${v.E}))`, M(o.newPay)]);
    return rows;
  },
  ti(v, o) {
    const s = [
      { kind: 'tvm', title: '1. Payment', N: v.n, I: v.apr, PV: v.P, PMT: 0, FV: 0, PY: v.m, solve: 'PMT', expect: -o.pay },
      { kind: 'tvm', title: `2. Balance after ${v.k}`, N: o.rem, I: v.apr, PV: 0, PMT: -o.pay, FV: 0, PY: v.m, solve: 'PV', expect: o.Bk, note: `Keep the solved PMT; just change N to ${o.rem}.` },
    ];
    if (v.E > 0) s.push({ kind: 'tvm', title: '3. New payment', N: o.rem, I: v.apr, PV: o.Bx, PMT: 0, FV: 0, PY: v.m, solve: 'PMT', expect: -o.newPay, note: `PV is the balance minus ${M(v.E)}.` });
    return s;
  },
  watch: [
    '<b>Use the payments left</b> (n − k), not the payments made.',
    '<b>Principal repaid</b> = original loan − balance. <b>Interest paid</b> = total payments − principal repaid.',
    '<b>Extra principal</b> doesn’t change the payment unless the loan is re-amortized; otherwise it shortens the loan.',
  ],
  verify: {
    'Monthly rate': (o) => o.r, 'Original monthly payment': (o) => o.pay, 'Payments remaining': (o) => o.rem,
    'Balance after payment k': (o) => o.Bk, 'Principal repaid through k': (o) => o.prin, 'Interest paid through k': (o) => o.intr,
    'Balance before next payment': (o) => o.before, 'Balance after extra payment': (o) => o.Bx, 'Re-amortized monthly payment': (o) => o.newPay,
  },
});

/* ================================================================ 05 Savings FV */
topic({
  id: '05',
  name: 'Savings FV',
  idea: 'Deposits grow into a future balance. Your money in stays the same; <b>growth snowballs</b> because each period you earn interest on past interest.',
  modes: [{ k: 'fv', label: 'Final balance' }, { k: 'raise', label: 'Deposit changes' }, { k: 'goal', label: 'Deposit for a goal' }],
  inputs: [
    { k: 'P0', label: 'Starting balance', kind: 'money', def: 0, min: 0, max: 1e10 },
    { k: 'C', label: 'Regular deposit', kind: 'money', def: 2000, min: 0, max: 1e9, slider: [0, 10000, 25], modes: ['fv', 'raise'] },
    { k: 'apr', label: 'Annual return (APR)', kind: 'pct', def: 8, min: 0, max: 100, slider: [0, 15, 0.05] },
    { k: 'm', label: 'Periods per year', kind: 'sel', def: 1, options: FREQ },
    { k: 'n', label: 'Number of deposits', kind: 'int', def: 30, min: 1, max: 1200, slider: [1, 480, 1] },
    { k: 'due', label: 'Deposits made', kind: 'sel', def: 0, options: [[0, 'End of each period'], [1, 'Start of each period']], modes: ['fv'] },
    { k: 'C2', label: 'Second deposit amount', kind: 'money', def: 500, min: 0, max: 1e9, modes: ['raise'] },
    { k: 'n2', label: 'Number of second deposits', kind: 'int', def: 36, min: 0, max: 1200, modes: ['raise'] },
    { k: 'T', label: 'Goal balance', kind: 'money', def: 70000, min: 0, max: 1e10, slider: [0, 200000, 500], modes: ['goal'] },
  ],
  examples: [
    { id: 'FV-01', title: 'Annual retirement deposits', mode: 'fv', v: { P0: 0, C: 2000, apr: 8, m: 1, n: 30, due: 0 } },
    { id: 'FV-02', title: 'Monthly emergency fund', mode: 'fv', v: { P0: 1500, C: 300, apr: 4.8, m: 12, n: 60, due: 0 } },
    { id: 'FV-03', title: 'Quarterly investing', mode: 'fv', v: { P0: 10000, C: 1800, apr: 6.4, m: 4, n: 32, due: 0 } },
    { id: 'FV-04', title: 'Beginning-of-month saving', mode: 'fv', v: { P0: 2000, C: 450, apr: 6, m: 12, n: 120, due: 1 } },
    { id: 'FV-05', title: 'Beginning-of-year saving', mode: 'fv', v: { P0: 0, C: 6000, apr: 7.5, m: 1, n: 18, due: 1 } },
    { id: 'FV-06', title: 'Semiannual tuition fund', mode: 'fv', v: { P0: 7000, C: 2200, apr: 5, m: 2, n: 16, due: 0 } },
    { id: 'FV-07', title: 'Home down payment', mode: 'goal', v: { P0: 5000, apr: 6, m: 12, n: 60, T: 70000 } },
    { id: 'FV-08', title: 'Graduate-school savings', mode: 'goal', v: { P0: 12000, apr: 4.8, m: 12, n: 36, T: 45000 } },
    { id: 'FV-09', title: 'Raise after two years', mode: 'raise', v: { P0: 1500, apr: 6, m: 12, C: 250, n: 24, C2: 500, n2: 36 } },
    { id: 'FV-10', title: 'Growing savings budget', mode: 'raise', v: { P0: 8000, apr: 7.2, m: 12, C: 600, n: 36, C2: 900, n2: 60 } },
  ],
  calc(v, mode) {
    const r = pc(v.apr) / v.m;
    const o = { r };
    if (mode === 'goal') {
      o.fvP0 = v.P0 * Math.pow(1 + r, v.n);
      o.short = v.T - o.fvP0;
      o.dep = o.short > 0 ? o.short / F.s(r, v.n) : 0;
      o.sf = F.s(r, v.n);
      o.N = v.n;
      o.path = Array.from({ length: v.n + 1 }, (_, t) => ({ x: t, bal: v.P0 * Math.pow(1 + r, t) + o.dep * F.s(r, t), inn: v.P0 + o.dep * t }));
      return o;
    }
    const due = mode === 'fv' ? v.due : 0;
    const n2 = mode === 'raise' ? v.n2 : 0;
    const balAt = (t) => {
      if (t <= v.n) return v.P0 * Math.pow(1 + r, t) + v.C * F.s(r, t) * (1 + r * due);
      const b1 = v.P0 * Math.pow(1 + r, v.n) + v.C * F.s(r, v.n);
      return b1 * Math.pow(1 + r, t - v.n) + v.C2 * F.s(r, t - v.n);
    };
    const inAt = (t) => (t <= v.n ? v.P0 + v.C * t : v.P0 + v.C * v.n + v.C2 * (t - v.n));
    o.N = v.n + n2;
    o.b1 = balAt(v.n);
    o.fv = balAt(o.N);
    o.contrib = inAt(o.N);
    o.earn = o.fv - o.contrib;
    o.path = Array.from({ length: o.N + 1 }, (_, t) => ({ x: t, bal: balAt(t), inn: inAt(t) }));
    return o;
  },
  out(v, o, mode) {
    if (mode === 'goal') return [cell('Rate per period', o.r, 'pct4'), cell('Starting balance grows to', o.fvP0), cell('Shortfall the deposits cover', o.short), cell('Required deposit', o.dep)];
    const c = [cell('Rate per period', o.r, 'pct4')];
    if (mode === 'raise') c.push(cell(`Balance after ${v.n} deposits`, o.b1));
    c.push(cell('Final balance', o.fv), cell('Money you put in', o.contrib), cell('Growth (earnings)', o.earn));
    return c;
  },
  charts: [{
    title: 'Balance at the end of each period',
    legend: [['b', 'Money you put in'], ['s1', 'Growth']],
    draw(plot, fig, v, o) {
      drawBars(plot, fig, {
        label: 'Savings balance split into contributions and growth',
        stack: [{ key: 'inn', cls: 'b' }, { key: 'gr', cls: 's1' }],
        data: o.path.slice(1).map((p) => ({ x: p.x, inn: p.inn, gr: Math.max(0, p.bal - p.inn), tip: `<b>End of period ${p.x}</b><br>Balance <span class="num">${M(p.bal)}</span><br>Put in <span class="num">${M(p.inn)}</span><br>Growth <span class="num">${M(p.bal - p.inn)}</span>` })),
        xLabel: (d) => String(d.x),
      });
    },
  }],
  text(v, o, mode) {
    if (mode === 'goal') {
      if (o.short <= 0) return `<p>Your ${M(v.P0)} grows to ${M(o.fvP0)} on its own, which already reaches the ${M(v.T)} goal. No deposits needed.</p>`;
      return `<p>Your ${M(v.P0)} grows to ${M(o.fvP0)} by itself, so the deposits only have to cover the other <b>${M(o.short)}</b>. Each deposit grows by the FV annuity factor s(${PT(o.r)}, ${v.n}) = ${fmt.num(o.sf, 4)}, so the deposit is ${M(o.short)} ÷ ${fmt.num(o.sf, 4)} = <b>${M(o.dep)}</b>.</p>`;
    }
    let t = `<p>You put in <b>${M(o.contrib)}</b>. Compounding at ${PT(o.r)} per ${perName(v.m)} turns it into <b>${M(o.fv)}</b>, so ${M(o.earn)} is growth${o.earn > o.contrib ? ', more than you contributed' : ''}. The bars get taller faster at the end because you earn interest on past interest.</p>`;
    if (mode === 'raise') t += `<p class="aside">Two stages: the first ${v.n} deposits plus the start balance reach ${M(o.b1)}. That balance keeps growing while ${v.n2} deposits of ${M(v.C2)} are added.</p>`;
    if (mode === 'fv' && v.due) t += '<p class="aside">Deposits at the start of each period each earn one extra period of interest, so the balance is (1 + r) times the end-of-period version.</p>';
    return t;
  },
  excel(v, o, mode) {
    const rt = exRate(v.apr, v.m);
    if (mode === 'goal') return [['Required deposit', `=-PMT(${rt}, ${v.n}, ${ng(v.P0)}, ${v.T})`, M(o.dep)]];
    if (mode === 'raise') return [['Balance at the change', `=FV(${rt}, ${v.n}, -${v.C}, ${ng(v.P0)})`, M(o.b1)], ['Final balance', `=FV(${rt}, ${v.n2}, -${v.C2}, -FV(${rt}, ${v.n}, -${v.C}, ${ng(v.P0)}))`, M(o.fv)]];
    return [['Final balance', `=FV(${rt}, ${v.n}, -${v.C}, ${ng(v.P0)}, ${v.due})`, M(o.fv)], ['Growth', `=FV(${rt}, ${v.n}, -${v.C}, ${ng(v.P0)}, ${v.due})-${fmt.raw(o.contrib)}`, M(o.earn)]];
  },
  ti(v, o, mode) {
    if (mode === 'goal') return [{ kind: 'tvm', title: 'Required deposit', N: v.n, I: v.apr, PV: -v.P0, PMT: 0, FV: v.T, PY: v.m, solve: 'PMT', expect: -o.dep, note: 'Money you put in is negative; the goal is positive.' }];
    if (mode === 'raise') return [
      { kind: 'tvm', title: '1. Balance at the change', N: v.n, I: v.apr, PV: -v.P0, PMT: -v.C, FV: 0, PY: v.m, solve: 'FV', expect: o.b1 },
      { kind: 'tvm', title: '2. Final balance', N: v.n2, I: v.apr, PV: -o.b1, PMT: -v.C2, FV: 0, PY: v.m, solve: 'FV', expect: o.fv, note: 'PV is step 1’s balance, entered negative.' },
    ];
    return [{ kind: 'tvm', title: 'Final balance', N: v.n, I: v.apr, PV: -v.P0, PMT: -v.C, FV: 0, PY: v.m, bgn: !!v.due, solve: 'FV', expect: o.fv, note: 'Deposits are negative because you pay them in.' }];
  },
  watch: [
    '<b>An end-of-period deposit</b> made in the last period earns no interest at all.',
    '<b>Starting balance and deposits</b> are both cash you put in: negative on the TI and in Excel.',
    '<b>Start-of-period deposits</b> use BEGIN on the TI and type 1 in Excel.',
  ],
  verify: {
    'Periodic return': (o) => o.r, 'Monthly return': (o) => o.r,
    'Final account balance': (o) => o.fv, 'Total cash contributed': (o) => o.contrib, 'Investment earnings': (o) => o.earn,
    'Total investment earnings': (o) => o.earn, 'Balance at change date': (o) => o.b1,
    'FV of existing savings': (o) => o.fvP0, 'Future-value shortfall': (o) => o.short, 'Required monthly deposit': (o) => o.dep,
  },
});

/* ================================================================ 06 Retirement funding */
topic({
  id: '06',
  name: 'Retirement Funding',
  idea: 'Two annuities meet on retirement day. First find the <b>target</b>: the PV of all the withdrawals. Then find the monthly saving that <b>grows to that target</b>.',
  inputs: [
    { k: 'W', label: 'Monthly withdrawal in retirement', kind: 'money', def: 1000, min: 0, max: 1e9, slider: [0, 10000, 50] },
    { k: 'nw', label: 'Number of withdrawals', kind: 'int', def: 360, min: 1, max: 1200, slider: [12, 480, 12] },
    { k: 'rr', label: 'Return during retirement (APR)', kind: 'pct', def: 6, min: 0, max: 100, slider: [0, 12, 0.05] },
    { k: 'ns', label: 'Months of saving', kind: 'int', def: 240, min: 1, max: 1200, slider: [12, 480, 12] },
    { k: 'rs', label: 'Return while saving (APR)', kind: 'pct', def: 6, min: 0, max: 100, slider: [0, 12, 0.05] },
    { k: 'P0', label: 'Already saved', kind: 'money', def: 0, min: 0, max: 1e10 },
    { k: 'due', label: 'First withdrawal', kind: 'sel', def: 0, options: [[0, 'One month after retiring'], [1, 'On retirement day']] },
    { k: 'L', label: 'Left over at the end (legacy)', kind: 'money', def: 0, min: 0, max: 1e10 },
  ],
  examples: [
    { id: 'RT-01', title: 'Lecture-style retirement', v: { W: 1000, nw: 360, rr: 6, ns: 240, rs: 6, P0: 0, due: 0, L: 0 } },
    { id: 'RT-02', title: 'Existing retirement balance', v: { W: 3200, nw: 300, rr: 4.8, ns: 300, rs: 7.2, P0: 18000, due: 0, L: 0 } },
    { id: 'RT-03', title: 'Different return after retirement', v: { W: 4500, nw: 360, rr: 4.2, ns: 240, rs: 7.8, P0: 50000, due: 0, L: 0 } },
    { id: 'RT-04', title: 'Immediate first withdrawal', v: { W: 2400, nw: 240, rr: 4.5, ns: 180, rs: 6, P0: 20000, due: 1, L: 0 } },
    { id: 'RT-05', title: 'Legacy at retirement end', v: { W: 3800, nw: 300, rr: 5, ns: 300, rs: 7, P0: 35000, due: 0, L: 100000 } },
    { id: 'RT-06', title: 'Later career saver', v: { W: 2600, nw: 240, rr: 4, ns: 144, rs: 6.5, P0: 60000, due: 0, L: 0 } },
    { id: 'RT-07', title: 'Beginning-of-retirement income', v: { W: 4200, nw: 360, rr: 4.5, ns: 360, rs: 7.5, P0: 12000, due: 1, L: 0 } },
    { id: 'RT-08', title: 'Family legacy plan', v: { W: 5000, nw: 300, rr: 5.5, ns: 240, rs: 8, P0: 80000, due: 0, L: 200000 } },
    { id: 'RT-09', title: 'Conservative saving return', v: { W: 1800, nw: 240, rr: 3, ns: 180, rs: 3.6, P0: 10000, due: 0, L: 0 } },
    { id: 'RT-10', title: 'Twenty-five-year plan', v: { W: 3600, nw: 360, rr: 4.8, ns: 300, rs: 6.6, P0: 45000, due: 0, L: 150000 } },
  ],
  calc(v) {
    const rw = pc(v.rr) / 12, rsv = pc(v.rs) / 12;
    const target = v.W * F.a(rw, v.nw) * (1 + rw * v.due) + v.L * Math.pow(1 + rw, -v.nw);
    const fvP0 = v.P0 * Math.pow(1 + rsv, v.ns);
    const needAmt = target - fvP0;
    const dep = needAmt > 0 ? needAmt / F.s(rsv, v.ns) : 0;
    const path = [];
    for (let t = 0; t <= v.ns; t++) path.push(v.P0 * Math.pow(1 + rsv, t) + dep * F.s(rsv, t));
    let b = target;
    for (let j = 1; j <= v.nw; j++) { b = v.due ? (b - v.W) * (1 + rw) : b * (1 + rw) - v.W; path.push(b); }
    return { rw, rsv, target, fvP0, needAmt, dep, path, put: v.P0 + dep * v.ns };
  },
  out(v, o) {
    return [
      cell('Saving rate per month', o.rsv, 'pct4'),
      cell('Retirement rate per month', o.rw, 'pct4'),
      cell('Target on retirement day', o.target),
      cell('Existing savings grow to', o.fvP0),
      cell('Target left for deposits', o.needAmt),
      cell('Required monthly saving', o.dep),
    ];
  },
  charts: [{
    title: 'Account balance over your life',
    draw(plot, fig, v, o) {
      const xs = o.path.map((_, i) => i / 12);
      drawLine(plot, fig, {
        label: 'Balance rising while saving and falling in retirement', xs, zero: true,
        series: [{ name: 'Balance', ys: o.path, cls: 's1', area: true }],
        bands: [{ x0: 0, x1: v.ns / 12, label: 'Saving', cls: 's1', alpha: 5 }, { x0: v.ns / 12, x1: (v.ns + v.nw) / 12, label: 'Retired', cls: 's2', alpha: 6 }],
        xFmt: (x) => `Yr ${+x.toFixed(1)}`,
        points: [{ x: v.ns / 12, y: o.target, cls: 's1', label: `Target ${M(o.target, 0)}`, pos: 'above' }],
        tip: (i) => `<b>Month ${i}</b> (${i <= v.ns ? 'saving' : 'retired'})<br>Balance <span class="num">${M(o.path[i])}</span>`,
      });
    },
  }],
  text(v, o) {
    let t = `<p>To pay ${M(v.W)} a month for ${v.nw} months${v.L ? ` and still leave ${M(v.L)}` : ''}, you need <b>${M(o.target)}</b> on retirement day. That’s the PV of the withdrawals at ${PT(pc(v.rr))}${v.due ? ', with the first one on day one (BEGIN)' : ''}.</p>`;
    t += v.P0 ? `<p>Your ${M(v.P0)} already saved grows to ${M(o.fvP0)}, so deposits must supply ${M(o.needAmt)}. ` : '<p>';
    t += o.needAmt > 0 ? `Saving <b>${M(o.dep)}</b> a month for ${v.ns} months at ${PT(pc(v.rs))} gets you there. You put in ${M(o.put)}; growth supplies the rest.</p>` : 'Your existing savings already cover the target.</p>';
    return t;
  },
  excel(v, o) {
    const tg = `PV(${xp(pc(v.rr))}/12, ${v.nw}, -${v.W}, ${ng(v.L)}, ${v.due})`;
    return [['Target', '=' + tg, M(o.target)], ['Monthly saving', `=-PMT(${xp(pc(v.rs))}/12, ${v.ns}, ${ng(v.P0)}, ${tg})`, M(o.dep)]];
  },
  ti(v, o) {
    return [
      { kind: 'tvm', title: '1. Target on retirement day', N: v.nw, I: v.rr, PV: 0, PMT: -v.W, FV: -v.L, PY: 12, bgn: !!v.due, solve: 'PV', expect: o.target },
      { kind: 'tvm', title: '2. Monthly saving', N: v.ns, I: v.rs, PV: -v.P0, PMT: 0, FV: o.target, PY: 12, solve: 'PMT', expect: -o.dep, note: 'Switch back to END and use the saving rate.' },
    ];
  },
  watch: [
    '<b>Two different rates.</b> Use the retirement return for the withdrawals and the saving return for the deposits.',
    '<b>First withdrawal on retirement day</b> means BEGIN for step 1 only. Step 2 deposits are usually END.',
    '<b>Existing savings</b> grow on their own; only the gap needs new deposits.',
  ],
  verify: {
    'Monthly saving return': (o) => o.rsv, 'Monthly retirement return': (o) => o.rw, 'Retirement-date target': (o) => o.target,
    'FV of existing savings': (o) => o.fvP0, 'Target funded by new deposits': (o) => o.needAmt, 'Required monthly saving': (o) => o.dep,
  },
});

/* ================================================================ 07 Growing annuities */
unit('Growth and perpetuities');
topic({
  id: '07',
  name: 'Growing Annuities',
  idea: 'Payments that grow at g are discounted at r. The PV is <b>C1 ÷ (r − g) × [1 − ((1 + g) ÷ (1 + r))<sup>n</sup>]</b>, valued one period before the first payment.',
  inputs: [
    { k: 'C1', label: 'First payment (C1)', kind: 'money', def: 200000, min: 0, max: 1e10, slider: [0, 300000, 500] },
    { k: 'r', label: 'Discount rate per period', kind: 'pct', def: 11, min: 0, max: 100, slider: [0, 20, 0.05] },
    { k: 'g', label: 'Growth per period', kind: 'pct', def: 5, min: -50, max: 100, slider: [-5, 15, 0.05] },
    { k: 'n', label: 'Number of payments', kind: 'int', def: 20, min: 1, max: 600, slider: [1, 60, 1] },
    { k: 'first', label: 'First payment at period', kind: 'int', def: 1, min: 1, max: 600 },
    { k: 'offer', label: 'Offer today to compare (0 = none)', kind: 'money', def: 0, min: 0, max: 1e10, opt: true },
  ],
  examples: [
    { id: 'GA-01', title: 'Lottery payout', v: { C1: 200000, r: 11, g: 5, n: 20, first: 1, offer: 0 } },
    { id: 'GA-02', title: 'Growing consulting contract', v: { C1: 18000, r: 8, g: 3, n: 12, first: 1, offer: 0 } },
    { id: 'GA-03', title: 'Declining royalty stream', v: { C1: 30000, r: 9, g: -2, n: 10, first: 1, offer: 0 } },
    { id: 'GA-04', title: 'Deferred grant', v: { C1: 12000, r: 7.5, g: 2.5, n: 15, first: 4, offer: 0 } },
    { id: 'GA-05', title: 'Equal growth and discount', v: { C1: 5000, r: 4, g: 4, n: 10, first: 1, offer: 0 } },
    { id: 'GA-06', title: 'Quarterly royalties', v: { C1: 2000, r: 1.8, g: 0.8, n: 24, first: 1, offer: 0 } },
    { id: 'GA-07', title: 'Growing pension', v: { C1: 42000, r: 6.5, g: 2.5, n: 25, first: 1, offer: 350000 } },
    { id: 'GA-08', title: 'Delayed licensing', v: { C1: 15000, r: 8.5, g: 3.5, n: 8, first: 3, offer: 0 } },
    { id: 'GA-09', title: 'Future value of deposits', v: { C1: 3000, r: 7, g: 4, n: 20, first: 1, offer: 0 } },
    { id: 'GA-10', title: 'Growing annual lease', v: { C1: 25000, r: 9, g: 2, n: 18, first: 1, offer: 210000 } },
  ],
  calc(v) {
    const r = pc(v.r), g = pc(v.g);
    const V = F.growPV(v.C1, r, g, v.n);
    const pv0 = V / Math.pow(1 + r, v.first - 1);
    const last = v.C1 * Math.pow(1 + g, v.n - 1);
    const fvLast = V * Math.pow(1 + r, v.n);
    const flows = Array.from({ length: v.n }, (_, i) => { const t = v.first + i, c = v.C1 * Math.pow(1 + g, i); return { t, v: c, pv: c / Math.pow(1 + r, t) }; });
    return { r, g, V, pv0, last, fvLast, adv: pv0 - v.offer, flows };
  },
  out(v, o) {
    const c = [
      cell(`Value at period ${v.first - 1}`, o.V, 'money', 'one period before C1'),
      cell('PV today', o.pv0),
      cell('Last payment', o.last, 'money', `C1 × (1 + g)^${v.n - 1}`),
      cell('Value at the last payment date', o.fvLast),
    ];
    if (v.offer > 0) c.push(cell('PV minus the offer', o.adv, 'moneyS'), verdict('Better choice', 'good', o.adv >= 0 ? 'Take the payments' : 'Take the offer'));
    return c;
  },
  charts: [{
    title: 'Growing payments and what each is worth today',
    legend: FLOW_LEGEND,
    draw(plot, fig, v, o) {
      drawBars(plot, fig, {
        label: 'Growing payments with present values',
        data: o.flows.map((f) => ({ x: f.t, v: f.v, pv: f.pv, tip: `<b>Period ${f.t}</b><br>Payment <span class="num">${M(f.v)}</span><br>Worth today <span class="num">${M(f.pv)}</span>` })),
        xLabel: (d) => String(d.x),
      });
    },
  }],
  text(v, o) {
    const a = o.flows[0], z = o.flows[o.flows.length - 1];
    const race = Math.abs(o.r - o.g) < 1e-12 ? 'Growth exactly cancels discounting, so every payment is worth the same today'
      : o.g < o.r ? 'Discounting outruns growth, so the PVs shrink' : 'Growth outruns discounting, so later payments are worth more today';
    let t = `<p>Payments grow ${PT(o.g)} a period, from ${M(v.C1)} to ${M(o.last)}, while each is discounted at ${PT(o.r)}. ${race}: the first is worth ${M(a.pv)} today, the last ${M(z.pv)}. Together they’re worth <b>${M(o.pv0)}</b>.</p>`;
    if (Math.abs(o.r - o.g) < 1e-12) t += `<p class="aside">With r = g the formula divides by zero, so use n × C1 ÷ (1 + r) = ${v.n} × ${M(v.C1)} ÷ ${fmt.num(1 + o.r, 4)}.</p>`;
    if (v.first > 1) t += `<p class="aside">The formula values the stream at period ${v.first - 1} (${M(o.V)}). Discount ${v.first - 1} more periods to reach today.</p>`;
    if (v.offer > 0) t += `<p>Compared with the ${M(v.offer)} offer today, the payments are worth ${M(Math.abs(o.adv))} ${o.adv >= 0 ? 'more' : 'less'}.</p>`;
    return t;
  },
  excel(v, o) {
    const eq = Math.abs(o.r - o.g) < 1e-12;
    const base = eq ? `${v.n}*${v.C1}/(1+${xp(o.r)})` : `${v.C1}/(${xp(o.r)}-${xp(o.g)})*(1-((1+${xp(o.g)})/(1+${xp(o.r)}))^${v.n})`;
    const rows = [[`Value at period ${v.first - 1}`, '=' + base, M(o.V)]];
    if (v.first > 1) rows.push(['PV today', `=${base}/(1+${xp(o.r)})^${v.first - 1}`, M(o.pv0)]);
    return rows;
  },
  ti(v, o) {
    const eq = Math.abs(o.r - o.g) < 1e-12;
    const e1 = eq ? `${v.n}*${tn(v.C1)}/${td(1 + o.r)}` : `${tn(v.C1)}/(${td(o.r)}-${tdp(o.g)})*(1-(${td(1 + o.g)}/${td(1 + o.r)})^${v.n})`;
    const lines = [[e1, o.V]];
    if (v.first > 1) lines.push([`Ans/${td(1 + o.r)}^${v.first - 1}`, o.pv0]);
    return [{ kind: 'home', title: 'Growing annuity PV', lines }];
  },
  watch: [
    '<b>C1 is the first future payment.</b> If you’re given this year’s payment, grow it once: C1 = C0 × (1 + g).',
    '<b>r and g must be per payment period.</b> Quarterly payments need quarterly rates.',
    '<b>r = g</b> breaks the formula; use n × C1 ÷ (1 + r). A finite stream doesn’t need r > g; only a perpetuity does.',
  ],
  verify: {
    'Value one period before first payment': (o) => o.V, 'Present value today': (o) => o.pv0, 'Last payment': (o) => o.last,
    'Value at last payment date': (o) => o.fvLast, 'PV advantage over immediate offer': (o) => o.adv, 'Choose: 1=stream, 2=offer': (o) => (o.adv > 0 ? 1 : 2),
  },
});

/* ================================================================ 08 Perpetuities */
topic({
  id: '08',
  name: 'Perpetuities',
  idea: 'Payments forever still have a finite value, because far-off payments are worth almost nothing today: <b>C1 ÷ (r − g)</b>, as long as r is bigger than g.',
  modes: [{ k: 'val', label: 'Value' }, { k: 'pay', label: 'Payout from an endowment' }, { k: 'rate', label: 'Implied rate' }],
  inputs: [
    { k: 'C1', label: 'First payment (C1)', kind: 'money', def: 2, min: 0, max: 1e10, modes: ['val', 'rate'] },
    { k: 'E', label: 'Endowment today', kind: 'money', def: 750000, min: 0, max: 1e11, modes: ['pay'] },
    { k: 'V', label: 'Value of the perpetuity', kind: 'money', def: 500000, min: 0, max: 1e11, modes: ['rate'] },
    { k: 'r', label: 'Discount rate per period', kind: 'pct', def: 10, min: 0, max: 100, slider: [0, 20, 0.05], modes: ['val', 'pay'] },
    { k: 'g', label: 'Growth per period', kind: 'pct', def: 0, min: -50, max: 100, slider: [-2, 10, 0.05] },
    { k: 'first', label: 'First payment at period', kind: 'int', def: 1, min: 1, max: 1000, modes: ['val', 'rate'] },
    { k: 'yr', label: 'Show the payout in year', kind: 'int', def: 10, min: 1, max: 1000, modes: ['pay'] },
  ],
  examples: [
    { id: 'PP-01', title: 'Level perpetual payment', mode: 'val', v: { C1: 2, r: 10, g: 0, first: 1 } },
    { id: 'PP-02', title: 'Growing perpetual payment', mode: 'val', v: { C1: 2, r: 10, g: 4, first: 1 } },
    { id: 'PP-03', title: 'Scholarship endowment', mode: 'val', v: { C1: 30000, r: 6, g: 2, first: 1 } },
    { id: 'PP-04', title: 'Deferred museum support', mode: 'val', v: { C1: 50000, r: 7.5, g: 2.5, first: 6 } },
    { id: 'PP-05', title: 'Permanent annual maintenance', mode: 'val', v: { C1: 18000, r: 8, g: 0, first: 4 } },
    { id: 'PP-06', title: 'Quarterly perpetual royalty', mode: 'val', v: { C1: 1200, r: 2, g: 0.5, first: 1 } },
    { id: 'PP-07', title: 'Sustainable scholarship', mode: 'pay', v: { E: 750000, r: 6.5, g: 2.5, yr: 10 } },
    { id: 'PP-08', title: 'Permanent program funding', mode: 'pay', v: { E: 1400000, r: 7, g: 3, yr: 10 } },
    { id: 'PP-09', title: 'Implied endowment return', mode: 'rate', v: { V: 500000, C1: 25000, g: 2, first: 3 } },
    { id: 'PP-10', title: 'Implied royalty discount rate', mode: 'rate', v: { V: 900000, C1: 45000, g: 2.5, first: 3 } },
  ],
  calc(v, mode) {
    const g = pc(v.g);
    if (mode === 'pay') {
      const r = pc(v.r);
      need(r > g, 'The return must be bigger than the growth rate, or the endowment runs out.');
      const C1 = v.E * (r - g);
      return { r, g, spread: r - g, C1, Cy: C1 * Math.pow(1 + g, v.yr - 1) };
    }
    if (mode === 'rate') {
      need(v.V > 0, 'Enter the perpetuity’s value.');
      const r = v.C1 / v.V + g;
      const delayed = v.V / Math.pow(1 + r, v.first - 1);
      return { r, g, delayed, loss: v.V - delayed, Vb: v.V };
    }
    const r = pc(v.r);
    need(r > g, 'Needs r > g. If growth keeps up with discounting, far payments never shrink and the value is infinite.');
    const Vb = v.C1 / (r - g);
    const pv0 = Vb / Math.pow(1 + r, v.first - 1);
    const K = Math.min(400, Math.max(30, Math.ceil(Math.log(0.01) / Math.log((1 + g) / (1 + r)))));
    const cum = [];
    let s = 0;
    for (let k = 1; k <= K; k++) { s += (v.C1 * Math.pow(1 + g, k - 1)) / Math.pow(1 + r, v.first - 1 + k); cum.push(s); }
    return { r, g, spread: r - g, Vb, pv0, second: v.C1 * (1 + g), cum };
  },
  out(v, o, mode) {
    if (mode === 'pay') return [cell('Spread r − g', o.spread, 'pct4'), cell('First-year payout', o.C1, 'money', 'endowment × (r − g)'), cell(`Payout in year ${v.yr}`, o.Cy)];
    if (mode === 'rate') return [cell('Implied rate', o.r, 'pct4', 'C1 ÷ value + g'), cell(`Value if payments start at period ${v.first}`, o.delayed), cell('Value lost to the delay', o.loss)];
    return [cell('Spread r − g', o.spread, 'pct4'), cell(`Value at period ${v.first - 1}`, o.Vb, 'money', 'C1 ÷ (r − g)'), cell('Value today', o.pv0), cell('Second payment', o.second)];
  },
  charts: [{
    title: (v, o, mode) => (mode === 'val' ? 'Value today of the first k payments' : mode === 'pay' ? 'Yearly payout from the endowment' : 'Value of a perpetuity, by start date'),
    draw(plot, fig, v, o, mode) {
      if (mode === 'val') {
        const xs = o.cum.map((_, i) => i + 1);
        drawLine(plot, fig, {
          label: 'Cumulative present value approaching the perpetuity value', xs, zero: true,
          series: [{ name: 'Cumulative PV', ys: o.cum, cls: 's1' }],
          hrefs: [{ y: o.pv0, label: `All payments forever: ${M(o.pv0)}` }],
          xFmt: (x) => String(Math.round(x)),
          tip: (i) => `<b>First ${i + 1} payments</b><br>Worth <span class="num">${M(o.cum[i])}</span> today<br>${PCT(o.cum[i] / o.pv0, 1)} of the total`,
        });
      } else if (mode === 'pay') {
        const N = Math.max(v.yr, 20);
        drawBars(plot, fig, {
          label: 'Payout each year', cls: 's1',
          data: Array.from({ length: N }, (_, i) => ({ x: i + 1, v: o.C1 * Math.pow(1 + o.g, i), cls: i + 1 === v.yr ? 's2' : 's1', tip: `<b>Year ${i + 1}</b><br>Payout <span class="num">${M(o.C1 * Math.pow(1 + o.g, i))}</span>` })),
          xLabel: (d) => String(d.x),
        });
      } else {
        const N = Math.max(10, v.first + 5);
        drawBars(plot, fig, {
          label: 'Value today if the first payment comes at each period', cls: 's1',
          data: Array.from({ length: N }, (_, i) => ({ x: i + 1, v: o.Vb / Math.pow(1 + o.r, i), cls: i + 1 === v.first ? 's2' : 's1', tip: `<b>First payment at period ${i + 1}</b><br>Value today <span class="num">${M(o.Vb / Math.pow(1 + o.r, i))}</span>` })),
          xLabel: (d) => String(d.x),
        });
      }
    },
  }],
  text(v, o, mode) {
    if (mode === 'pay') return `<p>To last forever and grow ${PT(o.g)} a year, the endowment can pay out only the spread between its return and that growth: ${M(v.E)} × (${PT(o.r)} − ${PT(o.g)}) = <b>${M(o.C1)}</b> in year 1. Growing ${PT(o.g)} a year, the year-${v.yr} payout is ${M(o.Cy)}.</p>`;
    if (mode === 'rate') return `<p>Turn the formula around: V = C1 ÷ (r − g) means r = C1 ÷ V + g = ${M(v.C1)} ÷ ${M(v.V)} + ${PT(o.g)} = <b>${PCT(o.r, 2)}</b>. If the first payment waits until period ${v.first}, the value drops to ${M(o.delayed)}, a ${M(o.loss)} loss.</p>`;
    const k10 = o.cum[Math.min(9, o.cum.length - 1)];
    let t = `<p>Forever sounds infinite, but distant payments are worth almost nothing today. At ${PT(o.r)} with ${PT(o.g)} growth, the first 10 payments are already worth ${M(k10)}, ${PCT(k10 / o.pv0, 1)} of the total. The value levels off at C1 ÷ (r − g) = ${M(v.C1)} ÷ ${PT(o.spread)} = <b>${M(o.Vb)}</b>.</p>`;
    if (v.first > 1) t += `<p class="aside">That value sits at period ${v.first - 1}, one before the first payment. Discount ${v.first - 1} periods to get <b>${M(o.pv0)}</b> today.</p>`;
    return t;
  },
  excel(v, o, mode) {
    if (mode === 'pay') return [['First payout', `=${v.E}*(${xp(o.r)}-${xp(o.g)})`, M(o.C1)], [`Year ${v.yr}`, `=${v.E}*(${xp(o.r)}-${xp(o.g)})*(1+${xp(o.g)})^${v.yr - 1}`, M(o.Cy)]];
    if (mode === 'rate') return [['Implied rate', `=${v.C1}/${v.V}+${xp(o.g)}`, PT(o.r)], ['Delayed value', `=${v.V}/(1+${v.C1}/${v.V}+${xp(o.g)})^${v.first - 1}`, M(o.delayed)]];
    return [['Value today', `=${v.C1}/${o.g ? `(${xp(o.r)}-${xp(o.g)})` : xp(o.r)}${v.first > 1 ? `/(1+${xp(o.r)})^${v.first - 1}` : ''}`, M(o.pv0)]];
  },
  ti(v, o, mode) {
    if (mode === 'pay') return [{ kind: 'home', title: 'Payouts', lines: [[`${tn(v.E)}*(${td(o.r)}-${tdp(o.g)})`, o.C1], [`Ans*${td(1 + o.g)}^${v.yr - 1}`, o.Cy]] }];
    if (mode === 'rate') return [{ kind: 'home', title: 'Implied rate and delayed value', lines: [[`${tn(v.C1)}/${tn(v.V)}+${tdp(o.g)}`, o.r], [`${tn(v.V)}/(1+Ans)^${v.first - 1}`, o.delayed]] }];
    const lines = [[o.g ? `${tn(v.C1)}/(${td(o.r)}-${tdp(o.g)})` : `${tn(v.C1)}/${td(o.r)}`, o.Vb]];
    if (v.first > 1) lines.push([`Ans/${td(1 + o.r)}^${v.first - 1}`, o.pv0]);
    return [{ kind: 'home', title: 'Perpetuity value', lines }];
  },
  watch: [
    '<b>Needs r > g.</b> If growth matches or beats the discount rate, the value is infinite.',
    '<b>C1 ÷ (r − g) is the value one period before the first payment.</b> A first payment in year 6 means discount 5 years.',
    '<b>Use per-period rates.</b> A quarterly perpetuity needs quarterly r and g.',
  ],
  verify: {
    'Discount-growth spread': (o) => o.spread, 'Value before first payment': (o) => o.Vb, 'Value today': (o) => o.pv0, 'Second payment': (o) => o.second,
    'Return-growth spread': (o) => o.spread, 'First-year distribution': (o) => o.C1, 'Distribution in year 10': (o) => o.Cy,
    'Implied annual discount rate': (o) => o.r, 'Value with delayed first payment': (o) => o.delayed, 'Loss in value from delay': (o) => o.loss,
  },
});

/* ================================================================ 09 APR and EAR */
unit('Rates and fees');
const MS_LIST = [1, 2, 4, 12, 52, 365, 0];
const mName = (m) => (m === 0 ? 'continuous' : { 1: 'annual', 2: 'semiannual', 4: 'quarterly', 12: 'monthly', 52: 'weekly', 365: 'daily' }[m] || `${m}×/yr`);
const earOf = (apr, m) => (m === 0 ? Math.exp(apr) - 1 : Math.pow(1 + apr / m, m) - 1);
const aprFor = (ear, m) => (m === 0 ? Math.log(1 + ear) : m * (Math.pow(1 + ear, 1 / m) - 1));
const COMP = [[1, '1 (annual)'], [2, '2 (semiannual)'], [4, '4 (quarterly)'], [12, '12 (monthly)'], [52, '52 (weekly)'], [365, '365 (daily)'], [0, 'Continuous']];
topic({
  id: '09',
  name: 'APR and EAR',
  idea: 'An APR is a quoted rate: periodic rate × periods per year, with <b>no compounding</b>. The EAR is what you actually earn or pay in a year <b>with compounding</b>: (1 + APR/m)<sup>m</sup> − 1.',
  modes: [{ k: 'apr', label: 'APR to EAR' }, { k: 'ear', label: 'EAR to APR' }, { k: 'cmp', label: 'Compare two offers' }, { k: 'mix', label: 'Payments ≠ compounding' }],
  inputs: [
    { k: 'apr', label: 'Quoted APR', kind: 'pct', def: 12, min: 0, max: 500, slider: [0, 30, 0.05], modes: ['apr', 'mix'] },
    { k: 'ear', label: 'Effective annual rate (EAR)', kind: 'pct', def: 10, min: 0, max: 500, slider: [0, 30, 0.05], modes: ['ear'] },
    { k: 'm', label: 'Compounding periods per year', kind: 'sel', def: 12, options: COMP, modes: ['apr', 'ear'] },
    { k: 'PV', label: 'Amount invested today', kind: 'money', def: 5000, min: 0, max: 1e10, modes: ['apr', 'ear'] },
    { k: 'yrs', label: 'Years', kind: 'num', def: 3, min: 0, max: 100, slider: [0, 30, 0.5], modes: ['apr', 'ear'] },
    { k: 'aprA', label: 'Offer A APR', kind: 'pct', def: 6, min: 0, max: 500, modes: ['cmp'] },
    { k: 'mA', label: 'Offer A compounding', kind: 'sel', def: 12, options: COMP, modes: ['cmp'] },
    { k: 'aprB', label: 'Offer B APR', kind: 'pct', def: 6.1, min: 0, max: 500, modes: ['cmp'] },
    { k: 'mB', label: 'Offer B compounding', kind: 'sel', def: 2, options: COMP, modes: ['cmp'] },
    { k: 'side', label: 'These are', kind: 'sel', def: 0, options: [[0, 'Deposits (you earn)'], [1, 'Loans (you pay)']], modes: ['cmp'] },
    { k: 'P', label: 'Loan amount', kind: 'money', def: 24000, min: 0, max: 1e10, modes: ['mix'] },
    { k: 'cy', label: 'Compounding periods per year', kind: 'sel', def: 4, options: FREQ, modes: ['mix'] },
    { k: 'py', label: 'Payments per year', kind: 'sel', def: 12, options: FREQ, modes: ['mix'] },
    { k: 'n', label: 'Number of payments', kind: 'int', def: 36, min: 1, max: 1200, modes: ['mix'] },
  ],
  examples: [
    { id: 'AE-01', title: 'Monthly compounding', mode: 'apr', v: { apr: 12, m: 12, PV: 5000, yrs: 3 } },
    { id: 'AE-02', title: 'Quarterly compounding', mode: 'apr', v: { apr: 8, m: 4, PV: 12000, yrs: 5 } },
    { id: 'AE-03', title: 'Daily compounding', mode: 'apr', v: { apr: 9.5, m: 365, PV: 8000, yrs: 2 } },
    { id: 'AE-04', title: 'EAR to monthly APR', mode: 'ear', v: { ear: 10, m: 12, PV: 7000, yrs: 4 } },
    { id: 'AE-05', title: 'EAR to quarterly APR', mode: 'ear', v: { ear: 8.5, m: 4, PV: 16000, yrs: 3 } },
    { id: 'AE-06', title: 'Competing deposit offers', mode: 'cmp', v: { aprA: 6, mA: 12, aprB: 6.1, mB: 2, side: 0 }, opt: ['side'] },
    { id: 'AE-07', title: 'Competing borrowing offers', mode: 'cmp', v: { aprA: 18, mA: 12, aprB: 17.5, mB: 365, side: 1 }, opt: ['side'] },
    { id: 'AE-08', title: 'Continuous compounding', mode: 'apr', v: { apr: 5, m: 0, PV: 9000, yrs: 4 }, opt: ['m'] },
    { id: 'AE-09', title: 'Reverse continuous conversion', mode: 'ear', v: { ear: 7.5, m: 12 } },
    { id: 'AE-10', title: 'Different payment and compounding', mode: 'mix', v: { P: 24000, apr: 8, cy: 4, py: 12, n: 36 } },
  ],
  calc(v, mode) {
    if (mode === 'cmp') {
      const a = earOf(pc(v.aprA), v.mA), b = earOf(pc(v.aprB), v.mB);
      const pickA = v.side ? a < b : a > b;
      return { a, b, diff: (a - b) * 100, pick: Math.abs(a - b) < 1e-12 ? 0 : pickA ? 1 : 2 };
    }
    if (mode === 'mix') {
      const rq = pc(v.apr) / v.cy, rp = Math.pow(1 + rq, v.cy / v.py) - 1, ear = Math.pow(1 + rq, v.cy) - 1;
      return { rq, rp, ear, pay: -F.pmt(rp, v.n, v.P, 0), aprC: pc(v.apr) };
    }
    if (mode === 'ear') {
      const ear = pc(v.ear), apr = aprFor(ear, v.m), r = v.m ? apr / v.m : NaN;
      const fv = v.PV * Math.pow(1 + ear, v.yrs);
      return { ear, apr, r, rp: r, cont: Math.log(1 + ear), fv, aprC: apr };
    }
    const apr = pc(v.apr), ear = earOf(apr, v.m), r = v.m ? apr / v.m : NaN;
    const fv = v.PV * Math.pow(1 + ear, v.yrs);
    return { apr, ear, r, fv, int: fv - v.PV, aprC: apr };
  },
  out(v, o, mode) {

    if (mode === 'mix') return [cell(`Rate per ${perName(v.cy)}`, o.rq, 'pct4'), cell(`Rate per ${perName(v.py)}`, o.rp, 'pct4', `(1 + ${PT(o.rq)})^(${v.cy}/${v.py}) − 1`), cell('EAR', o.ear, 'pct4'), cell('Payment', o.pay)];
    if (mode === 'ear') {
      const c = [];
      if (v.m) c.push(cell(`Rate per ${perName(v.m)}`, o.r, 'pct4', `(1 + EAR)^(1/${v.m}) − 1`));
      c.push(cell(`APR compounded ${mName(v.m)}`, o.apr, 'pct4'), cell('Continuous rate, same EAR', o.cont, 'pct4', 'ln(1 + EAR)'), cell(`Value after ${v.yrs} years`, o.fv));
      return c;
    }
    const c = [];
    if (v.m) c.push(cell(`Rate per ${perName(v.m)}`, o.r, 'pct4', `${PT(o.apr)} ÷ ${v.m}`));
    c.push(cell('EAR', o.ear, 'pct4', v.m ? `(1 + r)^${v.m} − 1` : 'e^APR − 1'), cell(`Value after ${v.yrs} years`, o.fv), cell('Interest earned', o.int));
    return c;
  },
  charts: [{
    title: (v, o, mode) => (mode === 'ear' ? `How far below the ${PT(o.ear)} EAR the APR can be (EAR − APR)` : mode === 'cmp' ? 'EAR of each offer' : `What compounding adds to a ${PT(o.aprC)} APR (EAR − APR)`),
    draw(plot, fig, v, o, mode) {
      if (mode === 'cmp') {
        drawHBars(plot, fig, {
          label: 'EAR of offer A and offer B', fmt: fmt.axisPct,
          rows: [
            { label: `Offer A: ${PT(pc(v.aprA))} ${mName(v.mA)}`, value: fmt.pt(o.a), segs: [{ v: o.a, cls: 's1' }] },
            { label: `Offer B: ${PT(pc(v.aprB))} ${mName(v.mB)}`, value: fmt.pt(o.b), segs: [{ v: o.b, cls: 's2' }] },
          ],
        });
        return;
      }
      const sel = mode === 'mix' ? v.cy : v.m;
      // bars show the gap between EAR and APR, which starts at zero for annual compounding,
      // so the extra from compounding more often is easy to see
      const data = MS_LIST.map((m) => {
        const y = mode === 'ear' ? aprFor(o.ear, m) : earOf(o.aprC, m);
        const gap = mode === 'ear' ? o.ear - y : y - o.aprC;
        return { x: m === 0 ? '∞' : String(m), v: gap, cls: m === sel ? 's2' : 's1', tip: `<b>${mName(m)}</b><br>${mode === 'ear' ? 'APR needed' : 'EAR'} <span class="num">${fmt.pt(y)}</span><br>${mode === 'ear' ? 'Below the EAR by' : 'Compounding adds'} <span class="num">${fmt.pt(gap)}</span>` };
      });
      drawBars(plot, fig, { label: 'Gap between EAR and APR by compounding frequency', data, yFmt: fmt.axisPct, xLabel: (d) => ({ 1: 'Annual', 2: 'Semi', 4: 'Quarterly', 12: 'Monthly', 52: 'Weekly', 365: 'Daily', '∞': 'Continuous' }[d.x] || d.x) });
    },
  }],
  text(v, o, mode) {
    if (mode === 'cmp') return `<p>APRs with different compounding can’t be compared directly. Convert each to an EAR: A is ${fmt.pt(o.a)} and B is ${fmt.pt(o.b)}. For ${v.side ? 'a loan you want the lower EAR' : 'a deposit you want the higher EAR'}, so <b>${o.pick ? 'offer ' + (o.pick === 1 ? 'A' : 'B') : 'neither'}</b> wins${o.pick ? `, by ${fmt.num(Math.abs(o.diff), 4)} percentage points` : ''}.</p>`;
    if (mode === 'mix') return `<p>Interest compounds ${mName(v.cy)} at ${PT(o.rq)} per ${perName(v.cy)}, but you pay ${mName(v.py)}. The rate per payment has to grow to the same amount: (1 + ${PT(o.rq)})<sup>${v.cy}/${v.py}</sup> − 1 = ${fmt.pt(o.rp)} per ${perName(v.py)}. At that rate, ${v.n} payments of <b>${M(o.pay)}</b> repay ${M(v.P)}. On the TI, set P/Y = ${v.py} and C/Y = ${v.cy} and it does this for you.</p>`;
    if (mode === 'ear') return `<p>Going backward, never divide the EAR by ${v.m || 'm'}. ${v.m ? `Take the root instead: (1 + ${PT(o.ear)})<sup>1/${v.m}</sup> − 1 = ${fmt.pt(o.r)} per ${perName(v.m)}, so the quoted APR is ${fmt.pt(o.r)} × ${v.m} = <b>${fmt.pt(o.apr)}</b>.` : `With continuous compounding the APR is ln(1 + EAR) = <b>${fmt.pt(o.apr)}</b>.`} The bars show that the more often a rate compounds, the lower the APR needed for the same EAR.</p>`;
    const m = v.m;
    return `<p>${PT(o.apr)} compounded ${mName(m)} ${m ? `is ${PT(o.r)} per ${perName(m)}. Compounding that ${m} times gives (1 + ${PT(o.r)})<sup>${m}</sup> − 1` : 'grows as e<sup>APR</sup> − 1'} = <b>${fmt.pt(o.ear)}</b> a year, the EAR. ${M(v.PV)} grows to <b>${M(o.fv)}</b> in ${v.yrs} years.</p><p class="aside">More frequent compounding raises the EAR, but by less and less: daily is ${fmt.pt(earOf(o.apr, 365))}, continuous ${fmt.pt(earOf(o.apr, 0))}.</p>`;
  },
  excel(v, o, mode) {
    if (mode === 'cmp') return [['Offer A EAR', v.mA ? `=EFFECT(${xp(pc(v.aprA))}, ${v.mA})` : `=EXP(${xp(pc(v.aprA))})-1`, fmt.pt(o.a)], ['Offer B EAR', v.mB ? `=EFFECT(${xp(pc(v.aprB))}, ${v.mB})` : `=EXP(${xp(pc(v.aprB))})-1`, fmt.pt(o.b)]];
    if (mode === 'mix') return [[`Rate per ${perName(v.py)}`, `=(1+${xp(pc(v.apr))}/${v.cy})^(${v.cy}/${v.py})-1`, fmt.pt(o.rp)], ['Payment', `=PMT((1+${xp(pc(v.apr))}/${v.cy})^(${v.cy}/${v.py})-1, ${v.n}, -${v.P})`, M(o.pay)]];
    if (mode === 'ear') return v.m ? [['APR', `=NOMINAL(${xp(o.ear)}, ${v.m})`, fmt.pt(o.apr)], ['Value', `=${v.PV}*(1+${xp(o.ear)})^${v.yrs}`, M(o.fv)]] : [['Continuous APR', `=LN(1+${xp(o.ear)})`, fmt.pt(o.apr)]];
    return [['EAR', v.m ? `=EFFECT(${xp(o.apr)}, ${v.m})` : `=EXP(${xp(o.apr)})-1`, fmt.pt(o.ear)], ['Value', v.m ? `=FV(${xp(o.apr)}/${v.m}, ${v.m}*${v.yrs}, 0, -${v.PV})` : `=${v.PV}*EXP(${xp(o.apr)}*${v.yrs})`, M(o.fv)]];
  },
  ti(v, o, mode) {
    if (mode === 'cmp') {
      const e = (apr, m) => (m ? [`►Eff(${tn(apr)},${m})`, 100 * earOf(pc(apr), m)] : [`e^(${td(pc(apr))})-1`, earOf(pc(apr), 0)]);
      return [{ kind: 'home', title: 'Both EARs', lines: [e(v.aprA, v.mA), e(v.aprB, v.mB)] }];
    }
    if (mode === 'mix') return [{ kind: 'tvm', title: 'Payment with P/Y ≠ C/Y', N: v.n, I: v.apr, PV: v.P, PMT: 0, FV: 0, PY: v.py, CY: v.cy, solve: 'PMT', expect: -o.pay, note: `After setting P/Y = ${v.py}, change C/Y to ${v.cy}.` }];
    if (mode === 'ear') {
      if (!v.m) return [{ kind: 'home', title: 'Continuous rate', lines: [[`ln(1+${td(o.ear)})`, o.apr]] }];
      return [{ kind: 'home', title: 'APR from the EAR', lines: [[`►Nom(${tn(v.ear)},${v.m})`, 100 * o.apr]] }, { kind: 'home', title: 'Value', lines: [[`${tn(v.PV)}*${td(1 + o.ear)}^${tn(v.yrs)}`, o.fv]] }];
    }
    if (!v.m) return [{ kind: 'home', title: 'EAR and value', lines: [[`e^(${td(o.apr)})-1`, o.ear], [`${tn(v.PV)}*e^(${td(o.apr)}*${tn(v.yrs)})`, o.fv]] }];
    return [
      { kind: 'home', title: 'EAR', lines: [[`►Eff(${tn(v.apr)},${v.m})`, 100 * o.ear]] },
      { kind: 'tvm', title: 'Value', N: v.m * v.yrs, I: v.apr, PV: -v.PV, PMT: 0, FV: 0, PY: v.m, solve: 'FV', expect: o.fv },
    ];
  },
  watch: [
    '<b>Never divide an EAR by 12.</b> Take the 12th root: (1 + EAR)<sup>1/12</sup> − 1.',
    '<b>Compare offers by EAR</b>, not by APR, when they compound at different frequencies.',
    '<b>Continuous compounding:</b> EAR = e<sup>APR</sup> − 1. On the TI, e^( is 2nd ln.',
  ],
  verify: {
    'Rate per compounding period': (o) => o.r, 'Effective annual rate': (o) => o.ear, 'Future value': (o) => o.fv,
    'Equivalent periodic rate': (o) => o.r, 'Equivalent nominal APR': (o) => o.apr,
    'Offer A EAR': (o) => o.a, 'Offer B EAR': (o) => o.b, 'A minus B, percentage points': (o) => o.diff, 'Choose: 1=A, 2=B': (o) => o.pick,
    'Total interest earned': (o) => o.int, 'Continuous nominal annual rate': (o) => o.cont, 'Equivalent monthly rate': (o) => o.rp,
    'Monthly-compounded APR': (o) => o.apr, 'Quarterly rate': (o) => o.rq, 'Monthly payment': (o) => o.pay,
  },
});

/* ================================================================ 10 Payday loans */
topic({
  id: '10',
  name: 'Payday Loans',
  idea: 'A short loan’s fee is a <b>rate for one short interval</b>. Scaling it to a year without compounding gives the APR; compounding it gives the EAR, which is where the shock comes from.',
  modes: [{ k: 'basic', label: 'Fee and rates' }, { k: 'held', label: 'Fee withheld' }, { k: 'roll', label: 'Rolled over' }, { k: 'cap', label: 'Fee under an APR cap' }],
  inputs: [
    { k: 'cash', label: 'Cash you receive', kind: 'money', def: 100, min: 0.01, max: 1e8, slider: [50, 1000, 5], modes: ['basic', 'roll', 'cap'] },
    { k: 'repay', label: 'Repayment', kind: 'money', def: 115, min: 0, max: 1e8, slider: [50, 1200, 1], modes: ['basic', 'roll'] },
    { k: 'face', label: 'Face amount you repay', kind: 'money', def: 500, min: 0.01, max: 1e8, modes: ['held'] },
    { k: 'fee', label: 'Fee withheld today', kind: 'money', def: 65, min: 0, max: 1e8, modes: ['held'] },
    { k: 'aprCap', label: 'APR cap', kind: 'pct', def: 120, min: 0, max: 10000, modes: ['cap'] },
    { k: 'len', label: 'Loan length', kind: 'num', def: 14, min: 0.01, max: 3650, unit: 'days', modes: ['basic', 'held', 'roll', 'cap'] },
    { k: 'yr', label: 'Same units in a year', kind: 'num', def: 365, min: 1, max: 1000, modes: ['basic', 'held', 'roll', 'cap'] },
    { k: 'k', label: 'Periods rolled over', kind: 'int', def: 3, min: 1, max: 100, modes: ['roll'] },
  ],
  examples: [
    { id: 'PD-01', title: 'Original lecture loan', mode: 'basic', v: { cash: 100, repay: 115, len: 14, yr: 365 } },
    { id: 'PD-02', title: 'Three-week cash advance', mode: 'basic', v: { cash: 400, repay: 444, len: 21, yr: 365 } },
    { id: 'PD-03', title: 'One-week advance', mode: 'basic', v: { cash: 250, repay: 278, len: 7, yr: 365 } },
    { id: 'PD-04', title: 'Thirty-day advance', mode: 'basic', v: { cash: 600, repay: 654, len: 30, yr: 365 } },
    { id: 'PD-05', title: 'Exact 52-week convention', mode: 'basic', v: { cash: 100, repay: 115, len: 2, yr: 52 } },
    { id: 'PD-06', title: 'Fee withheld from the advance', mode: 'held', v: { face: 500, fee: 65, len: 14, yr: 365 } },
    { id: 'PD-07', title: 'Three capitalized loan periods', mode: 'roll', v: { cash: 300, repay: 342, len: 14, k: 3, yr: 365 } },
    { id: 'PD-08', title: 'Maximum fee under a quoted APR', mode: 'cap', v: { aprCap: 120, len: 21, yr: 365, cash: 450 } },
  ],
  calc(v, mode) {
    const m = v.yr / v.len;
    if (mode === 'cap') {
      const r = pc(v.aprCap) / m;
      return { m, r, fee: v.cash * r, repay: v.cash * (1 + r), apr: pc(v.aprCap), ear: Math.pow(1 + r, m) - 1, cash: v.cash };
    }
    let cash = v.cash, repay = v.repay;
    if (mode === 'held') { cash = v.face - v.fee; repay = v.face; need(cash > 0, 'The fee has to be smaller than the face amount.'); }
    need(repay >= cash, 'The repayment should be at least the cash received.');
    const r = repay / cash - 1;
    const o = { m, r, cash, repay, fee: repay - cash, apr: r * m, ear: Math.pow(1 + r, m) - 1, yearEnd: cash * Math.pow(1 + r, m), feePct: v.fee / v.face };
    if (mode === 'roll') { o.bal = cash * Math.pow(1 + r, v.k); o.intK = o.bal - cash; }
    return o;
  },
  out(v, o, mode) {
    const per = `${fmt.num(v.len, 0)}-${v.yr === 52 ? 'week' : 'day'} interval`;
    if (mode === 'cap') return [cell('Intervals per year', o.m, 'num4'), cell('Highest rate per loan', o.r, 'pct4', 'APR cap ÷ intervals'), cell('Highest fee', o.fee), cell('Repayment', o.repay), cell('EAR at that fee', o.ear, 'pct2')];
    const c = [];
    if (mode === 'held') c.push(cell('Cash you actually get', o.cash), cell('Fee as % of face', o.feePct, 'pct4'));
    else c.push(cell('Fee', o.fee));
    c.push(cell(`Rate per ${per}`, o.r, 'pct4'), cell('Intervals per year', o.m, 'num4'), cell('APR', o.apr, 'pct2', 'no compounding'), cell('EAR', o.ear, 'pct2', 'with compounding'));
    if (mode === 'roll') c.push(cell(`Owed after ${v.k} rollovers`, o.bal), cell('Interest over that time', o.intK));
    else if (mode === 'basic') c.push(cell('If it rolled over all year', o.yearEnd));
    return c;
  },
  charts: [{
    title: (v, o) => `${M(o.cash)} over one year if the loan keeps rolling over`,
    legend: [['s2', 'Fees compounding (EAR)', 'line'], ['s1', 'Simple fees (APR)', 'line']],
    draw(plot, fig, v, o) {
      const xs = Array.from({ length: 101 }, (_, i) => (v.yr * i) / 100);
      const comp = xs.map((t) => o.cash * Math.pow(1 + o.r, t / v.len));
      const simp = xs.map((t) => o.cash * (1 + (o.r * t) / v.len));
      const unitName = v.yr === 52 ? 'Week' : 'Day';
      drawLine(plot, fig, {
        label: 'Balance with and without compounding', xs, zero: true,
        series: [{ name: 'Simple', ys: simp, cls: 's1' }, { name: 'Compounding', ys: comp, cls: 's2' }],
        xFmt: (x) => `${unitName} ${Math.round(x)}`,
        points: [{ x: v.yr, y: comp[100], cls: 's2', label: M(comp[100]), anchor: 'end', pos: 'above' }, { x: v.yr, y: simp[100], cls: 's1', label: M(simp[100]), anchor: 'end', pos: 'above' }],
        tip: (i) => `<b>${unitName} ${fmt.num(xs[i], 0)}</b><br>Compounding <span class="num">${M(comp[i])}</span><br>Simple <span class="num">${M(simp[i])}</span>`,
      });
    },
  }],
  text(v, o, mode) {
    const unit2 = v.yr === 52 ? 'weeks' : 'days';
    if (mode === 'cap') return `<p>An APR cap of ${PT(o.apr)} spread over ${fmt.num(o.m, 4)} loans a year allows at most ${fmt.pt(o.r)} per loan: a <b>${M(o.fee)}</b> fee on ${M(v.cash)}. Even at that legal maximum, compounding makes the EAR <b>${fmt.pct(o.ear, 2)}</b>.</p>`;
    let t = `<p>${mode === 'held' ? `The lender keeps the ${M(v.fee)} fee up front, so you get only ${M(o.cash)} but repay ${M(o.repay)}. The rate is on the cash you actually get: ` : `You get ${M(o.cash)} and repay ${M(o.repay)} after ${fmt.num(v.len, 0)} ${unit2}: a ${M(o.fee)} fee, or `}<b>${fmt.pct(o.r, 2)} per loan</b>. A year holds ${fmt.num(v.yr, 0)} ÷ ${fmt.num(v.len, 0)} = ${fmt.num(o.m, 2)} of those periods.</p>`;
    t += `<p>Scaling without compounding gives the APR: ${fmt.pct(o.r, 2)} × ${fmt.num(o.m, 2)} = <b>${fmt.pct(o.apr, 2)}</b>. If the loan rolled over all year with the fee compounding each time, ${M(o.cash)} would grow to ${M(o.yearEnd)}: an EAR of <b>${fmt.pct(o.ear, 2)}</b>.</p>`;
    if (mode === 'roll') t += `<p class="aside">After ${v.k} rollovers you owe ${M(o.cash)} × (1 + ${fmt.pct(o.r, 2)})<sup>${v.k}</sup> = ${M(o.bal)}, so ${M(o.intK)} of interest in ${fmt.num(v.len * v.k, 0)} ${unit2}.</p>`;
    return t;
  },
  excel(v, o, mode) {
    if (mode === 'cap') return [['Highest fee', `=${v.cash}*${xp(o.apr)}/(${v.yr}/${v.len})`, M(o.fee)], ['EAR', `=(1+${xp(o.apr)}/(${v.yr}/${v.len}))^(${v.yr}/${v.len})-1`, fmt.pct(o.ear, 2)]];
    const rt = `(${fmt.raw(o.repay)}/${fmt.raw(o.cash)}-1)`;
    const rows = [['Rate per loan', '=' + rt.slice(1, -1), fmt.pt(o.r)], ['APR', `=${rt}*${v.yr}/${v.len}`, fmt.pct(o.apr, 2)], ['EAR', `=(${fmt.raw(o.repay)}/${fmt.raw(o.cash)})^(${v.yr}/${v.len})-1`, fmt.pct(o.ear, 2)]];
    if (mode === 'roll') rows.push([`Owed after ${v.k}`, `=${fmt.raw(o.cash)}*(1+${rt})^${v.k}`, M(o.bal)]);
    return rows;
  },
  ti(v, o, mode) {
    if (mode === 'cap') return [{ kind: 'home', title: 'Highest fee and EAR', lines: [[`${td(o.apr)}/(${tn(v.yr)}/${tn(v.len)})`, o.r], [`${tn(v.cash)}*Ans`, o.fee], [`(1+${td(o.apr)}/(${tn(v.yr)}/${tn(v.len)}))^(${tn(v.yr)}/${tn(v.len)})-1`, o.ear]] }];
    const lines = [[`(${tn(o.repay)}/${tn(o.cash)}-1)*${tn(v.yr)}/${tn(v.len)}`, o.apr], [`(${tn(o.repay)}/${tn(o.cash)})^(${tn(v.yr)}/${tn(v.len)})-1`, o.ear]];
    if (mode === 'roll') lines.push([`${tn(o.cash)}*(${tn(o.repay)}/${tn(o.cash)})^${v.k}`, o.bal]);
    return [{ kind: 'home', title: 'APR and EAR as decimals', lines, note: 'Multiply by 100 for percent.' }];
  },
  watch: [
    '<b>Use the cash you actually receive.</b> A withheld fee shrinks your cash, which raises the true rate.',
    '<b>Pick one year convention</b> (365 days or 26 two-week periods) and keep it for APR and EAR.',
    '<b>APR ignores compounding.</b> The EAR includes it, which is why payday EARs run into the thousands of percent.',
  ],
  more: [
    '<b>PD-09, comparing two loan lengths:</b> find each loan’s EAR and pick the lower one. A cheaper-looking fee over a longer period can still have the lower EAR.',
    '<b>PD-10, working backward:</b> the two-week rate is APR ÷ 26. Cash advanced = repayment ÷ (1 + rate); the fee is the difference.',
  ],
  verify: {
    'Fee for this loan': (o) => o.fee, 'Rate for one loan interval': (o) => o.r, 'Loan intervals per year': (o) => o.m, 'Nominal APR': (o) => o.apr,
    'Effective annual rate': (o) => o.ear, 'Hypothetical year-end balance': (o) => o.yearEnd, 'Cash actually received': (o) => o.cash,
    'Fee as % of face amount': (o) => o.feePct, 'Rate on usable cash': (o) => o.r, 'Intervals per year': (o) => o.m,
    'Interest rate per 14 days': (o) => o.r, 'Balance after 42 days': (o) => o.bal, 'Total interest over 42 days': (o) => o.intK,
    'Maximum interval rate': (o) => o.r, 'Maximum fee': (o) => o.fee, 'Repayment at day 21': (o) => o.repay,
  },
});

/* ================================================================ 11 Origination fees */
topic({
  id: '11',
  name: 'Origination Fees',
  idea: 'The payment is figured on the <b>face amount</b>, but you only get the cash left after the fee. The true rate is the one that makes those payments worth <b>the cash you actually got</b>.',
  modes: [{ k: 'held', label: 'Fee withheld' }, { k: 'need', label: 'Need a set amount of cash' }, { k: 'added', label: 'Fee added to the loan' }, { k: 'max', label: 'Largest fee allowed' }],
  inputs: [
    { k: 'face', label: 'Face amount of the loan', kind: 'money', def: 10000, min: 1, max: 1e10, slider: [1000, 50000, 100], modes: ['held', 'max'] },
    { k: 'cash', label: 'Cash you need in hand', kind: 'money', def: 12000, min: 1, max: 1e10, modes: ['need', 'added'] },
    { k: 'feeAdd', label: 'Fee added to the balance', kind: 'money', def: 900, min: 0, max: 1e10, modes: ['added'] },
    { k: 'apr', label: 'Contract APR', kind: 'pct', def: 19.08, min: 0, max: 100, slider: [0, 30, 0.05] },
    { k: 'n', label: 'Monthly payments', kind: 'int', def: 60, min: 1, max: 600, slider: [6, 120, 1] },
    { k: 'feePct', label: 'Fee as % of face', kind: 'pct', def: 8.15, min: 0, max: 99, slider: [0, 15, 0.05], modes: ['held', 'need'] },
    { k: 'aprMax', label: 'Highest fee-adjusted APR you accept', kind: 'pct', def: 14, min: 0, max: 100, modes: ['max'] },
  ],
  examples: [
    { id: 'OF-01', title: 'Original lecture loan', mode: 'held', v: { face: 10000, apr: 19.08, n: 60, feePct: 8.15 } },
    { id: 'OF-02', title: 'Three-year personal loan', mode: 'held', v: { face: 15000, apr: 12, n: 36, feePct: 4 } },
    { id: 'OF-03', title: 'Short business loan', mode: 'held', v: { face: 25000, apr: 10.5, n: 48, feePct: 3 } },
    { id: 'OF-04', title: 'Two-year consolidation loan', mode: 'held', v: { face: 8000, apr: 15, n: 24, feePct: 6 } },
    { id: 'OF-05', title: 'Required usable proceeds', mode: 'need', v: { cash: 12000, apr: 13.5, n: 48, feePct: 5 } },
    { id: 'OF-06', title: 'Net cash for repairs', mode: 'need', v: { cash: 20000, apr: 11, n: 60, feePct: 4.5 } },
    { id: 'OF-07', title: 'Fee added to the balance', mode: 'added', v: { cash: 18000, feeAdd: 900, apr: 9.5, n: 48 } },
    { id: 'OF-08', title: 'Financed processing charge', mode: 'added', v: { cash: 7000, feeAdd: 350, apr: 14, n: 36 } },
    { id: 'OF-10', title: 'Solve the largest acceptable fee', mode: 'max', v: { face: 16000, apr: 10, aprMax: 14, n: 48 } },
  ],
  calc(v, mode) {
    const r = pc(v.apr) / 12;
    if (mode === 'max') {
      const pay = -F.pmt(r, v.n, v.face, 0);
      const rMax = pc(v.aprMax) / 12;
      const minCash = pay * F.a(rMax, v.n);
      return { r, pay, rMax, minCash, maxFee: v.face - minCash, maxPct: (v.face - minCash) / v.face, face: v.face, cash: minCash, adj: pc(v.aprMax), fee: v.face - minCash };
    }
    let face, cash, fee;
    if (mode === 'held') { face = v.face; fee = face * pc(v.feePct); cash = face - fee; }
    else if (mode === 'need') { cash = v.cash; face = cash / (1 - pc(v.feePct)); fee = face - cash; }
    else { cash = v.cash; fee = v.feeAdd; face = cash + fee; }
    const pay = -F.pmt(r, v.n, face, 0);
    const ra = F.rate(v.n, -pay, cash, 0);
    return { r, face, cash, fee, pay, ra, adj: ra * 12, ear: Math.pow(1 + ra, 12) - 1, interest: pay * v.n - face, cost: pay * v.n - cash };
  },
  out(v, o, mode) {

    else if (mode === 'added') c.push(cell('Interest on the balance', o.interest), cell('Total financing cost', o.cost));

/* ================================================================ 12 Fees and NPV */
unit('NPV decisions');
function savingsSeries(S, r, n, fee) {
  const N = Number.isFinite(n) ? n : Math.min(1200, Math.max(240, Math.ceil(fee / Math.max(S, 1e-9)) * 3));
  const xs = [], disc = [], simple = [];
  for (let k = 0; k <= N; k++) { xs.push(k); disc.push(S * F.a(r, k)); simple.push(S * k); }
  return { xs, disc, simple };
}
topic({
  id: '12',
  name: 'Fees and NPV',
  idea: 'Paying a fee today to save money later is an investment. It’s worth it when the <b>PV of the savings beats the fee</b>: NPV = PV(savings) − fee.',
  modes: [{ k: 'pts', label: 'Mortgage points' }, { k: 'str', label: 'Fee vs savings stream' }],
  inputs: [
    { k: 'P', label: 'Loan amount (both options)', kind: 'money', def: 300000, min: 1, max: 1e10, modes: ['pts'] },
    { k: 'apr1', label: 'Option 1 rate, no fee', kind: 'pct', def: 7, min: 0, max: 100, slider: [2, 12, 0.05], modes: ['pts'] },
    { k: 'apr2', label: 'Option 2 rate, with fee', kind: 'pct', def: 6.75, min: 0, max: 100, slider: [2, 12, 0.05], modes: ['pts'] },
    { k: 'feePct', label: 'Fee as % of the loan', kind: 'pct', def: 2, min: 0, max: 100, slider: [0, 5, 0.05], modes: ['pts'] },
    { k: 'fee', label: 'Fee today', kind: 'money', def: 6000, min: 0, max: 1e10, modes: ['str'] },
    { k: 'S', label: 'Savings each period', kind: 'money', def: 50, min: 0, max: 1e9, slider: [0, 500, 1], modes: ['str'] },
    { k: 'n', label: 'Number of periods', kind: 'int', def: 360, min: 1, max: 1200, slider: [1, 480, 1] },
    { k: 'ever', label: 'Savings last', kind: 'sel', def: 0, options: [[0, 'That many periods'], [1, 'Forever']], modes: ['str'], opt: true },
    { k: 'd', label: 'Discount rate (APR)', kind: 'pct', def: 7, min: 0, max: 100, slider: [0, 15, 0.05] },
    { k: 'm', label: 'Periods per year', kind: 'sel', def: 12, options: [[1, '1 (annual)'], [12, '12 (monthly)']], modes: ['str'] },
  ],
  examples: [
    { id: 'NP-01', title: 'Original lecture mortgage', mode: 'pts', v: { P: 300000, apr1: 7, apr2: 6.75, feePct: 2, n: 360, d: 7 } },
    { id: 'NP-02', title: 'Larger rate reduction', mode: 'pts', v: { P: 450000, apr1: 7.25, apr2: 6.75, feePct: 1.5, n: 360, d: 7.25 } },
    { id: 'NP-03', title: 'Small savings, high fee', mode: 'pts', v: { P: 280000, apr1: 6.25, apr2: 6.1, feePct: 2.5, n: 360, d: 6.25 } },
    { id: 'NP-04', title: 'A short savings horizon', mode: 'str', v: { fee: 1200, S: 65, n: 24, ever: 0, d: 6, m: 12 }, derived: ['S'] },
    { id: 'NP-05', title: 'Maximum worthwhile fee', mode: 'str', v: { fee: 15000, S: 2800, n: 7, ever: 0, d: 8, m: 1 }, derived: ['S', 'm'] },
    { id: 'NP-06', title: 'Discounted break-even time', mode: 'str', v: { fee: 6000, S: 50, n: 360, ever: 0, d: 7, m: 12 } },
    { id: 'NP-07', title: 'Can break-even occur?', mode: 'str', v: { fee: 6000, S: 25, n: 360, ever: 1, d: 7, m: 12 }, derived: ['n'], opt: ['ever'] },
    { id: 'NP-08', title: 'IRR on the fee', mode: 'str', v: { fee: 6000, S: 50, n: 360, ever: 0, d: 7, m: 12 } },
  ],
  calc(v, mode) {
    const o = {};
    if (mode === 'pts') {
      o.r = pc(v.d) / 12; o.m = 12;
      o.pay1 = -F.pmt(pc(v.apr1) / 12, v.n, v.P, 0);
      o.pay2 = -F.pmt(pc(v.apr2) / 12, v.n, v.P, 0);
      o.S = o.pay1 - o.pay2;
      o.fee = v.P * pc(v.feePct);
      o.n = v.n;
    } else {
      o.m = v.m; o.r = pc(v.d) / v.m; o.S = v.S; o.fee = v.fee; o.n = v.ever ? Infinity : v.n;
    }
    need(o.S > 0, 'The fee option has to save money each period for this comparison.');
    o.pv = Number.isFinite(o.n) ? o.S * F.a(o.r, o.n) : o.S / o.r;
    o.npv = o.pv - o.fee;
    o.total = Number.isFinite(o.n) ? o.S * o.n : Infinity;
    o.simple = o.fee / o.S;
    const perp = o.S / o.r;
    o.canBE = perp > o.fee;
    o.be = o.canBE ? F.nper(o.r, o.S, -o.fee, 0) : NaN;
    o.beWhole = Number.isFinite(o.be) ? Math.ceil(o.be - 1e-9) : NaN;
    if (Number.isFinite(o.n)) { o.irr = F.rate(o.n, o.S, -o.fee, 0); o.irrA = o.irr * o.m; o.irrE = Math.pow(1 + o.irr, o.m) - 1; }
    else { o.irr = o.S / o.fee; o.irrA = o.irr * o.m; o.irrE = Math.pow(1 + o.irr, o.m) - 1; }
    o.series = savingsSeries(o.S, o.r, o.n, o.fee);
    return o;
  },
  out(v, o, mode) {
    const per = perName(o.m);
    const c = [];
    if (mode === 'pts') c.push(cell('Option 1 payment', o.pay1), cell('Option 2 payment', o.pay2), cell(`Savings per ${per}`, o.S), cell('Fee today', o.fee));
    c.push(cell(`Discount rate per ${per}`, o.r, 'pct4'), cell(`PV of the savings${Number.isFinite(o.n) ? '' : ' (forever)'}`, o.pv), cell('NPV of paying the fee', o.npv, 'moneyS'));
    c.push(verdict('Decision', o.npv > 0 ? 'good' : o.npv < 0 ? 'bad' : 'even', o.npv > 0 ? 'Pay the fee' : o.npv < 0 ? 'Don’t pay it' : 'Indifferent'));
    if (mode === 'str') {
      c.push(cell(`Simple payback (${per}s)`, o.simple, 'num2'), cell(`Discounted break-even (${per}s)`, o.be, Number.isFinite(o.be) ? 'num4' : 'text'));
      if (!Number.isFinite(o.be)) c[c.length - 1].text = 'Never';
      c.push(cell(`IRR per ${per}`, o.irr, 'pct4'), cell('IRR as an APR', o.irrA, 'pct4'));
    }
    return c;
  },
  charts: [{
    title: (v, o) => `Savings added up over time vs the ${M(o.fee, 0)} fee`,
    legend: [['s1', 'Savings in today’s dollars', 'line'], ['s2', 'Savings, not discounted', 'line']],
    draw(plot, fig, v, o) {
      const s = o.series;
      const top = Math.max(o.fee * 1.6, Math.min(Math.max(...s.disc) * 1.08, o.fee * 3));
      // the undiscounted line runs off the top of the chart: stop it at the edge instead of flattening it
      let over = false;
      const simple = s.simple.map((y) => { if (over) return NaN; if (y > top) { over = true; return top; } return y; });
      const pts = [];
      if (Number.isFinite(o.be) && o.be <= s.xs[s.xs.length - 1]) pts.push({ x: o.be, y: o.fee, cls: 's1', label: `Break-even ${fmt.num(o.be, 1)}`, anchor: o.be > s.xs.length * 0.6 ? 'end' : 'start', pos: 'below' });
      drawLine(plot, fig, {
        label: 'Cumulative savings compared with the fee', xs: s.xs, yDomain: [0, top],
        series: [{ name: 'Simple', ys: simple, cls: 's2', dash: true }, { name: 'Discounted', ys: s.disc, cls: 's1' }],
        hrefs: [{ y: o.fee, label: `Fee ${M(o.fee, 0)}`, at: 'left' }],
        points: pts,
        xFmt: (x) => String(Math.round(x)),
        tip: (i) => `<b>After ${s.xs[i]} ${perName(o.m)}s</b><br>Savings in today’s dollars <span class="num">${M(s.disc[i])}</span><br>Not discounted <span class="num">${M(s.simple[i])}</span>`,
      });
    },
  }],
  text(v, o, mode) {
    const per = perName(o.m);
    let t = mode === 'pts' ? `<p>The fee buys a lower rate: payments drop from ${M(o.pay1)} to ${M(o.pay2)}, saving <b>${M(o.S)} a month</b> for ${o.n} months. ` : `<p>The fee buys savings of ${M(o.S)} a ${per}${Number.isFinite(o.n) ? ` for ${o.n} ${per}s` : ' forever'}. `;
    t += `At ${PT(pc(v.d))}, those savings are worth <b>${M(o.pv)}</b> today, so paying the ${M(o.fee)} fee has an NPV of <b>${MS(o.npv)}</b>: ${o.npv > 0 ? 'pay it' : o.npv < 0 ? 'don’t pay it' : 'it doesn’t matter'}. The most you should ever pay is ${M(o.pv)}.</p>`;
    t += Number.isFinite(o.be) ? `<p class="aside">Ignoring interest, the fee is back after ${fmt.num(o.simple, 1)} ${per}s (dashed line). Counting the time value of money, it takes ${fmt.num(o.be, 2)} ${per}s (solid line crossing the fee).</p>`
      : `<p class="aside">Even savings that last forever are worth only ${M(o.S / o.r)} today, less than the fee, so there’s no discounted break-even at all, even though simple payback says ${fmt.num(o.simple, 1)} ${per}s.</p>`;
    return t;
  },
  excel(v, o, mode) {
    const dr = o.m === 1 ? xp(pc(v.d)) : `${xp(pc(v.d))}/12`;
    const rows = [];
    let S = fmt.raw(o.S);
    if (mode === 'pts') {
      const p1 = `PMT(${xp(pc(v.apr1))}/12, ${v.n}, -${v.P})`, p2 = `PMT(${xp(pc(v.apr2))}/12, ${v.n}, -${v.P})`;
      rows.push(['Monthly savings', `=${p1}-${p2}`, M(o.S)]);
      S = `(${p1}-${p2})`;
    }
    rows.push(['NPV', Number.isFinite(o.n) ? `=PV(${dr}, ${o.n}, -${S})-${fmt.raw(o.fee)}` : `=${S}/(${dr})-${fmt.raw(o.fee)}`, MS(o.npv)]);
    if (mode === 'str' && Number.isFinite(o.be)) rows.push(['Break-even periods', `=NPER(${dr}, ${S}, -${fmt.raw(o.fee)})`, fmt.num(o.be, 4)]);
    if (mode === 'str' && Number.isFinite(o.n)) rows.push(['IRR per period', `=RATE(${o.n}, ${S}, -${fmt.raw(o.fee)})`, fmt.pt(o.irr)]);
    return rows;
  },
  ti(v, o, mode) {
    const s = [];
    if (mode === 'pts') {
      s.push({ kind: 'tvm', title: '1. Payment at each rate', N: v.n, I: v.apr1, PV: v.P, PMT: 0, FV: 0, PY: 12, solve: 'PMT', expect: -o.pay1, note: `Then change I% to ${tn(v.apr2)} and solve again: ${TI.num(-o.pay2)}.` });
    }
    if (Number.isFinite(o.n)) s.push({ kind: 'tvm', title: `${mode === 'pts' ? '2' : '1'}. PV of the savings`, N: o.n, I: v.d, PV: 0, PMT: -o.S, FV: 0, PY: o.m, solve: 'PV', expect: o.pv, note: `NPV = PV − ${fmt.raw(o.fee)}.` });
    else s.push({ kind: 'home', title: '1. PV of savings forever', lines: [[`${tn(o.S)}/(${td(pc(v.d))}/${o.m})`, o.pv], [`Ans-${tn(o.fee)}`, o.npv]] });
    if (mode === 'str' && Number.isFinite(o.be)) s.push({ kind: 'tvm', title: 'Break-even periods', N: 0, I: v.d, PV: -o.fee, PMT: o.S, FV: 0, PY: o.m, solve: 'N', expect: o.be });
    if (mode === 'str' && Number.isFinite(o.n)) s.push({ kind: 'tvm', title: 'IRR as an APR', N: o.n, I: 0, PV: -o.fee, PMT: o.S, FV: 0, PY: o.m, solve: 'I%', expect: 100 * o.irrA });
    return s;
  },
  watch: [
    '<b>A lower payment doesn’t prove the fee pays off.</b> Compare the PV of the savings with the fee.',
    '<b>Discount at your opportunity cost</b>, the return you could earn elsewhere.',
    '<b>If you’ll sell or refinance early</b>, the savings stop then; use that shorter horizon.',
  ],
  more: [
    '<b>NP-09, uneven savings:</b> discount each year’s savings separately, or on the TI use npv(9,⁻12000,{2000,2500,3000,5500}) with the year-4 sale added to year 4.',
    '<b>NP-10, leaving the loan early:</b> add the PV of the lower payoff balance at the exit month to the PV of 60 months of savings, then subtract the fee.',

    'Undiscounted total savings': (o) => o.total, 'PV of savings': (o) => o.pv, 'NPV after fee': (o) => o.npv, 'Pay fee? 1=yes, 0=no': (o) => (o.npv > 0 ? 1 : 0),

    'Simple payback, months': (o) => o.simple, 'Discounted break-even, months': (o) => o.be, 'First whole break-even month': (o) => o.beWhole,
    'PV of full-term savings': (o) => o.pv, 'Full-term NPV': (o) => o.npv, 'PV of perpetual savings': (o) => o.pv, 'NPV even with infinite savings': (o) => o.npv,
