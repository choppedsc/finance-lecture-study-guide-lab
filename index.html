const BE_HTML = `<details class="intro be" open><summary>Picture breakeven inflation</summary><div class="intro-body">
<div id="beSetup" class="be-setup"></div>
<div class="be-control"><label for="beAct">Suppose inflation actually averages</label><input class="slide" type="range" id="beAct" min="0" max="10" step="0.1"><output id="beActOut" for="beAct"></output></div>
<figure class="chart" id="beFig"><figcaption><span class="fig-title" id="beTitle"></span><span class="legend">${legendHTML([['s1', 'Regular Treasury: fixed dollars', 'line'], ['s3', 'TIPS: grows with inflation', 'line']])}</span></figcaption><div class="plot" id="bePlot"></div><div class="tip" hidden></div></figure>
<p id="beOut" class="be-out" aria-live="polite"></p>
<p class="be-notes"><b>Where R − r comes from (your notes):</b> a regular Treasury yield R = real rate + expected inflation + term premium. A TIPS yield r = real rate + term premium, with no inflation part, because TIPS pay inflation separately. Subtract them and the real rate and the term premium cancel: <b>R − r = expected inflation</b>. That’s why the breakeven is the market’s inflation forecast.</p>
</div></details>`;

function drawBE(v, o, mode, st) {
  const fig = document.getElementById('beFig');
  if (!fig || !o || !Number.isFinite(o.be)) return;
  const N = v.N, R = o.spotN, r = o.r, be = o.be, A = 1000, exact = mode === 'exact';
  const tips = (pi) => A * Math.pow(exact ? (1 + r) * (1 + pi) : 1 + r + pi, N);
  const tsy = A * Math.pow(1 + R, N);
  const lo = Math.min(0, Math.floor((be - 0.02) * 100) / 100);
  const hi = Math.max(0.08, Math.ceil((be + 0.04) * 100) / 100);
  if (st.beAct == null || st.beAct < lo || st.beAct > hi) st.beAct = Math.round((be + 0.02) * 1000) / 1000;
  const act = st.beAct;
  const sl = document.getElementById('beAct');
  sl.min = +(lo * 100).toFixed(1);
  sl.max = +(hi * 100).toFixed(1);
  sl.value = +(act * 100).toFixed(1);
  sl.setAttribute('aria-valuetext', `${fmt.pct(act, 1)} a year`);
  document.getElementById('beActOut').textContent = `${fmt.pct(act, 1)} a year`;
  const yrs = `${N} year${N > 1 ? 's' : ''}`;
  document.getElementById('beSetup').innerHTML = `<p>You have <b>$1,000</b> to lend the U.S. government for <b>${yrs}</b>, and two bonds to pick from:</p>
<ul class="bul"><li><b>Regular Treasury:</b> pays a fixed <b>${fmt.pt(R)}</b> a year (this page’s ${N}-year yield). You know today exactly how many dollars you’ll get back: <b>${M(tsy)}</b>. If prices rise faster than expected, those dollars buy less, but the dollar amount never changes.</li>
<li><b>TIPS:</b> pays a <b>${PT(r)}</b> real return, and its principal is raised by whatever inflation actually happens. More inflation means more dollars.</li></ul>
<p><b>Breakeven inflation</b> is the inflation rate where both end with the same dollars: <b>${fmt.pt(be)}</b> a year here${exact ? ', from (1 + R) ÷ (1 + r) − 1' : ', from R − r'}. Think of it as an over/under line on inflation. If inflation comes in <b>over</b> the line, TIPS wins. If it comes in <b>under</b>, the regular Treasury wins. Investors set the yields so neither bond is an obvious bargain, so the line is also the market’s best guess of inflation.</p>`;
  document.getElementById('beTitle').textContent = `What $1,000 grows to in ${yrs}, by the inflation that actually happens`;
  const xs = Array.from({ length: 81 }, (_, i) => lo + ((hi - lo) * i) / 80);
  const tAct = tips(act), diff = tAct - tsy;
  const tie = Math.abs(act - be) < 0.0005;
  const above = tAct >= tsy;
  const anchor = act > (lo + hi) / 2 ? 'end' : 'start';
  const points = tie
    ? [{ x: act, y: tsy, cls: 'ink', label: `Both ${M(tsy)}`, anchor, pos: 'above' }]
    : [{ x: act, y: tsy, cls: 's1', label: `Treasury ${M(tsy)}`, anchor, pos: above ? 'below' : 'above' }, { x: act, y: tAct, cls: 's3', label: `TIPS ${M(tAct)}`, anchor, pos: above ? 'above' : 'below' }];
  drawLine(document.getElementById('bePlot'), fig, {
    label: 'Dollars from a regular Treasury and from TIPS at each inflation rate, crossing at the breakeven', xs,
    series: [{ ys: xs.map(() => tsy), cls: 's1' }, { ys: xs.map(tips), cls: 's3' }],
    bands: [{ x0: lo, x1: be, cls: 's1', alpha: 7, label: 'Treasury wins' }, { x0: be, x1: hi, cls: 's3', alpha: 7, label: 'TIPS wins' }],
    vrefs: [{ x: be, label: `Breakeven ${fmt.pct(be, 2)}`, row: 1, anchor: be > (lo + hi) / 2 ? 'end' : 'start' }],
    points, xFmt: fmt.axisPct, yFmt: fmt.axis, H: 250,
    tip: (i) => `<b>Inflation averages ${fmt.pct(xs[i], 2)}</b><br>Regular Treasury <span class="num">${M(tsy)}</span><br>TIPS <span class="num">${M(tips(xs[i]))}</span>`,
  });
  const realT = exact ? (1 + R) / (1 + act) - 1 : R - act;
  const out = document.getElementById('beOut');
  out.className = 'be-out ' + (tie ? 'tie' : above ? 'p' : 't');
  out.innerHTML = `If inflation averages <b>${fmt.pct(act, 1)}</b> a year, the regular Treasury pays exactly <b>${M(tsy)}</b>, same as always, and TIPS pays <b>${M(tAct)}</b>. `
    + (tie ? `That’s the breakeven, so it’s a tie: neither bond did better.`
      : above ? `Inflation came in <b>over</b> the ${fmt.pct(be, 2)} line, so <b>TIPS wins by ${M(diff)}</b>. Its payout grew with prices, while the Treasury’s fixed dollars buy less.`
        : `Inflation came in <b>under</b> the ${fmt.pct(be, 2)} line, so the <b>regular Treasury wins by ${M(-diff)}</b>. Its yield assumed more inflation than actually happened.`)
    + ` In buying power, TIPS always earns ${PT(r)} a year; at this inflation the Treasury earns ${fmt.pct(realT, 2)} a year.`;
}

TOPICS.forEach((t) => { if (INTROS[t.id]) t.intro = INTROS[t.id]; });
(() => {
  const ib = TOPICS.find((t) => t.id === 'IB');
  if (!ib) return;
  ib.introExtra = BE_HTML;
  ib.drawIntro = drawBE;
  ib.wireIntro = (main, st) => {
    const sl = main.querySelector('#beAct');
    if (sl) sl.addEventListener('input', () => { st.beAct = +sl.value / 100; drawBE(st.v, st.o, st.mode, st); });
  };
})();

boot();
})();
</script>
