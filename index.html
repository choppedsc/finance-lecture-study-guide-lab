    { k: 'rvB', label: 'B resale value', kind: 'money', def: 13000, min: 0, max: 1e10, modes: ['mach'] },
  ],
  examples: [
    { id: 'AC-01', title: 'Original car comparison', mode: 'cars', v: { pA: 24000, pB: 26500, mpgA: 35, mpgB: 48, miles: 10000, gas: 6, yrs: 6, d: 5, resA: 60, resB: 60 } },
    { id: 'AC-02', title: 'Commuter vehicle choice', mode: 'cars', v: { pA: 28000, pB: 33000, mpgA: 30, mpgB: 50, miles: 14000, gas: 4.5, yrs: 7, d: 6, resA: 45, resB: 50 } },
    { id: 'AC-03', title: 'Long-distance commuting', mode: 'cars', v: { pA: 31000, pB: 35000, mpgA: 28, mpgB: 44, miles: 22000, gas: 5.25, yrs: 5, d: 7, resA: 50, resB: 52 } },
    { id: 'AC-04', title: 'Light-use vehicle', mode: 'cars', v: { pA: 25000, pB: 30000, mpgA: 32, mpgB: 46, miles: 6500, gas: 4.75, yrs: 6, d: 5.5, resA: 50, resB: 55 } },
    { id: 'AC-05', title: 'Break-even gas price', mode: 'gas', v: { pA: 24000, pB: 27500, mpgA: 32, mpgB: 45, miles: 12000, yrs: 7, d: 6, res: 50 } },
    { id: 'AC-06', title: 'Hybrid fuel-price threshold', mode: 'gas', v: { pA: 29000, pB: 34500, mpgA: 29, mpgB: 48, miles: 16000, yrs: 6, d: 7, res: 45 } },
    { id: 'AC-07', title: 'Break-even annual mileage', mode: 'miles', v: { pA: 26000, pB: 30500, mpgA: 31, mpgB: 47, gas: 5, yrs: 6, d: 6, res: 50 } },
    { id: 'AC-08', title: 'Machine replacement choice', mode: 'mach', v: { pA: 55000, pB: 67000, opA: 12000, opB: 8800, rvA: 8000, rvB: 13000, yrs: 8, d: 9 } },
  ],
  calc(v, mode) {
    const d = pc(v.d), a = F.a(d, v.yrs), disc = Math.pow(1 + d, -v.yrs);
    const o = { d, a, disc };
    if (mode === 'gas' || mode === 'miles') {
      o.extra = v.pB - v.pA;
      o.pvExtraRes = o.extra * pc(v.res) * disc;
      o.net = o.extra - o.pvExtraRes;
      if (mode === 'gas') { o.gal = v.miles / v.mpgA - v.miles / v.mpgB; need(o.gal > 0, 'B has to use less fuel than A for a break-even to exist.'); o.be = o.net / (o.gal * a); }
      else { o.perMile = v.gas * (1 / v.mpgA - 1 / v.mpgB); need(o.perMile > 0, 'B has to use less fuel than A for a break-even to exist.'); o.be = o.net / (o.perMile * a); }
      return o;
    }
    if (mode === 'mach') { o.costA = v.opA; o.costB = v.opB; o.rvA = v.rvA; o.rvB = v.rvB; }
    else { o.costA = (v.miles / v.mpgA) * v.gas; o.costB = (v.miles / v.mpgB) * v.gas; o.rvA = v.pA * pc(v.resA); o.rvB = v.pB * pc(v.resB); }
    o.pvCA = o.costA * a; o.pvCB = o.costB * a;
    o.pvRA = o.rvA * disc; o.pvRB = o.rvB * disc;
    o.npcA = v.pA + o.pvCA - o.pvRA; o.npcB = v.pB + o.pvCB - o.pvRB;
    o.sav = o.npcA - o.npcB;
    return o;
  },
  out(v, o, mode) {
    if (mode === 'gas') return [cell('Extra price for B', o.extra), cell('PV of B’s extra resale', o.pvExtraRes), cell('Extra cost after resale', o.net), cell('Gallons saved per year', o.gal, 'num4'), cell('Annuity factor', o.a, 'num4'), cell('Break-even gas price', o.be, 'money4')];
    if (mode === 'miles') return [cell('Extra cost after resale', o.net), cell('Fuel saved per mile', o.perMile, 'money4'), cell('Annuity factor', o.a, 'num4'), cell('Break-even miles per year', o.be, 'num2')];
    const c = [];
    const kind = mode === 'mach' ? 'operating cost' : 'fuel';
    if (mode === 'cars') c.push(cell('A fuel per year', o.costA), cell('B fuel per year', o.costB));
    else c.push(cell('Annuity factor', o.a, 'num4'));
    c.push(cell(`PV of A ${kind}`, o.pvCA), cell(`PV of B ${kind}`, o.pvCB), cell('PV of A resale', o.pvRA), cell('PV of B resale', o.pvRB), cell('Net present cost A', o.npcA), cell('Net present cost B', o.npcB));
    c.push(verdict('Cheaper choice', 'good', o.sav > 0 ? 'B' : 'A', `saves ${M(Math.abs(o.sav))} in PV`));
    return c;
  },
  charts: [{
    title: (v, o, mode) => (mode === 'gas' ? 'Extra PV cost of B at each gas price' : mode === 'miles' ? 'Extra PV cost of B at each yearly mileage' : 'Net present cost of each choice'),
    legend: (v, o, mode) => (mode === 'cars' || mode === 'mach' ? [['b', 'Price'], ['s2', mode === 'mach' ? 'PV of operating costs' : 'PV of fuel'], ['a', 'PV of resale (money back)']] : null),
    draw(plot, fig, v, o, mode) {
      if (mode === 'gas' || mode === 'miles') {
        const hi = o.be * 2 || 1;
        const xs = Array.from({ length: 61 }, (_, i) => (hi * i) / 60);
        const ys = xs.map((x) => o.net - (mode === 'gas' ? o.gal * x : v.gas * (1 / v.mpgA - 1 / v.mpgB) * x) * o.a);
        drawLine(plot, fig, {
          label: 'Extra cost of B falls as fuel savings grow', xs, series: [{ name: 'Extra cost of B', ys, cls: 's1' }],
          hrefs: [{ y: 0, label: 'Break-even' }],
          points: [{ x: o.be, y: 0, cls: 's2', label: mode === 'gas' ? `${M(o.be)} a gallon` : `${fmt.num(o.be, 0)} miles`, anchor: 'start', pos: 'below' }],
          xFmt: mode === 'gas' ? (x) => '$' + x.toFixed(2) : (x) => fmt.num(x, 0),
          tip: (i) => `<b>${mode === 'gas' ? M(xs[i]) + ' a gallon' : fmt.num(xs[i], 0) + ' miles'}</b><br>Extra PV cost of B <span class="num">${MS(ys[i])}</span><br>${ys[i] > 0 ? 'A is cheaper' : 'B is cheaper'}`,
        });
        return;
      }
      const row = (name, p, c, r, npc) => ({ label: name, value: `net ${M(npc)}`, marker: { x: npc }, segs: [{ v: p, cls: 'b', tip: `Price <span class="num">${M(p)}</span>` }, { v: c, cls: 's2', tip: `PV of costs <span class="num">${M(c)}</span>` }, { v: -r, cls: 'a', hatch: true, tip: `PV of resale <span class="num">${M(r)}</span>` }] });
      drawHBars(plot, fig, { label: 'Net present cost of A and B', rows: [row('Choice A', v.pA, o.pvCA, o.pvRA, o.npcA), row('Choice B', v.pB, o.pvCB, o.pvRB, o.npcB)], fmt: fmt.axis });
    },
  }],
  text(v, o, mode) {
    if (mode === 'gas') return `<p>B costs ${M(o.extra)} more but resells for ${M(o.pvExtraRes)} more in PV, so it’s ${M(o.net)} more expensive up front, net. It saves ${fmt.num(o.gal, 2)} gallons a year. Those savings pay for B only if gas costs at least ${M(o.net)} ÷ (${fmt.num(o.gal, 2)} × ${fmt.num(o.a, 4)}) = <b>${M(o.be, 4)}</b> a gallon.</p>`;
    if (mode === 'miles') return `<p>B is ${M(o.net)} more expensive after counting its extra resale. Each mile in B saves ${M(o.perMile, 4)} of gas. B pays off only if you drive at least ${M(o.net)} ÷ (${M(o.perMile, 4)} × ${fmt.num(o.a, 4)}) = <b>${fmt.num(o.be, 0)} miles</b> a year.</p>`;
    const cheaper = o.sav > 0 ? 'B' : 'A';
    return `<p>A costs ${M(v.pA)} up front, plus ${M(o.pvCA)} of ${mode === 'mach' ? 'operating costs' : 'fuel'} in today’s dollars, minus ${M(o.pvRA)} of resale: <b>${M(o.npcA)}</b> net. B: ${M(v.pB)} + ${M(o.pvCB)} − ${M(o.pvRB)} = <b>${M(o.npcB)}</b>.</p><p><b>${cheaper}</b> is cheaper by ${M(Math.abs(o.sav))} in today’s dollars${(cheaper === 'B') === (v.pB > v.pA) ? ', even though it costs more to buy' : ''}.</p>`;
  },
  excel(v, o, mode) {
    const d = xp(pc(v.d));
    if (mode === 'gas') return [['Break-even gas price', `=(${v.pB}-${v.pA})*(1-${xp(pc(v.res))}/(1+${d})^${v.yrs})/((${v.miles}/${v.mpgA}-${v.miles}/${v.mpgB})*PV(${d}, ${v.yrs}, -1))`, M(o.be, 4)]];
    if (mode === 'miles') return [['Break-even miles', `=(${v.pB}-${v.pA})*(1-${xp(pc(v.res))}/(1+${d})^${v.yrs})/(${v.gas}*(1/${v.mpgA}-1/${v.mpgB})*PV(${d}, ${v.yrs}, -1))`, fmt.num(o.be, 2)]];
    return [['Net cost A', `=${v.pA}+PV(${d}, ${v.yrs}, -${fmt.raw(o.costA)})-${fmt.raw(o.rvA)}/(1+${d})^${v.yrs}`, M(o.npcA)], ['Net cost B', `=${v.pB}+PV(${d}, ${v.yrs}, -${fmt.raw(o.costB)})-${fmt.raw(o.rvB)}/(1+${d})^${v.yrs}`, M(o.npcB)]];
  },
  ti(v, o, mode) {
    const d = td(pc(v.d));
    const af = `(1-${td(1 + pc(v.d))}^(⁻${v.yrs}))/${d}`;
    if (mode === 'gas') return [{ kind: 'home', title: 'Break-even gas price', lines: [[af, o.a], [`(${tn(v.pB)}-${tn(v.pA)})*(1-${td(pc(v.res))}/${td(1 + pc(v.d))}^${v.yrs})/((${tn(v.miles)}/${tn(v.mpgA)}-${tn(v.miles)}/${tn(v.mpgB)})*Ans)`, o.be]] }];
    if (mode === 'miles') return [{ kind: 'home', title: 'Break-even miles', lines: [[af, o.a], [`(${tn(v.pB)}-${tn(v.pA)})*(1-${td(pc(v.res))}/${td(1 + pc(v.d))}^${v.yrs})/(${tn(v.gas)}*(1/${tn(v.mpgA)}-1/${tn(v.mpgB)})*Ans)`, o.be]] }];
    return [
      { kind: 'home', title: 'Net present cost A', lines: [[`${tn(v.pA)}+${tn(o.costA)}*${af}-${tn(o.rvA)}/${td(1 + pc(v.d))}^${v.yrs}`, o.npcA]] },
      { kind: 'home', title: 'Net present cost B', lines: [[`${tn(v.pB)}+${tn(o.costB)}*${af}-${tn(o.rvB)}/${td(1 + pc(v.d))}^${v.yrs}`, o.npcB]] },
    ];
  },
  watch: [
    '<b>Resale lowers the cost.</b> It’s money back at the end, so subtract its PV.',
    '<b>Fuel per year</b> = miles ÷ MPG × price per gallon.',
    '<b>Discount every future cost</b>, not just the fuel; the purchase price is already today.',
  ],
  more: [
    '<b>AC-09, highest operating cost for B:</b> set B’s net present cost equal to A’s and solve for B’s yearly cost: (NPC A − B price + PV of B resale) ÷ annuity factor.',
    '<b>AC-10, most an upgrade is worth:</b> PV of the yearly savings + PV of the extra resale. Compare it with the actual extra price.',
  ],
  verify: {
    'Annual fuel cost A': (o) => o.costA, 'Annual fuel cost B': (o) => o.costB, 'PV of A fuel costs': (o) => o.pvCA, 'PV of B fuel costs': (o) => o.pvCB,
    'PV of A resale receipt': (o) => o.pvRA, 'PV of B resale receipt': (o) => o.pvRB, 'Net present cost A': (o) => o.npcA, 'Net present cost B': (o) => o.npcB,
    'PV savings from choosing B': (o) => o.sav, 'Choose: 1=A, 2=B': (o) => (o.sav > 0 ? 2 : 1), 'Extra purchase price for B': (o) => o.extra,
    'PV of extra B resale': (o) => o.pvExtraRes, 'Extra cost after resale benefit': (o) => o.net, 'Annual gallons saved by B': (o) => o.gal,
    'Annuity PV factor': (o) => o.a, 'Break-even gas price': (o) => o.be, 'Net extra cost after resale': (o) => o.net, 'Fuel savings per mile': (o) => o.perMile,
    'Break-even annual mileage': (o) => o.be, 'Savings from choosing B': (o) => o.sav,
  },
});

/* ================================================================ 14 Rebates and financing */
topic({
  id: '14',
  name: 'Rebates and Financing',
  idea: 'A cash rebate cuts <b>what you borrow</b>; 0% financing cuts <b>the rate</b>. With the same term, compare the two monthly payments. Otherwise, compare PVs at one discount rate.',
  modes: [{ k: 'pay', label: 'Compare payments' }, { k: 'be', label: 'Break-even rate' }, { k: 'min', label: 'Smallest rebate that wins' }, { k: 'pv', label: 'Different terms or a fee' }],
  inputs: [
    { k: 'price', label: 'Price', kind: 'money', def: 40000, min: 1, max: 1e9, slider: [5000, 80000, 500] },
    { k: 'reb', label: 'Rebate', kind: 'money', def: 3000, min: 0, max: 1e9, slider: [0, 10000, 50], modes: ['pay', 'be', 'pv'] },
    { k: 'apr', label: 'Rate on the rebate loan (APR)', kind: 'pct', def: 4, min: 0, max: 100, slider: [0, 12, 0.05], modes: ['pay', 'min', 'pv'] },
    { k: 'n', label: 'Months (rebate loan)', kind: 'int', def: 60, min: 1, max: 600, slider: [12, 96, 1] },
    { k: 'n0', label: 'Months (0% loan)', kind: 'int', def: 48, min: 1, max: 600, modes: ['pv'] },
    { k: 'd', label: 'Discount rate (APR)', kind: 'pct', def: 6, min: 0, max: 100, modes: ['pv'] },
    { k: 'fee', label: 'Fee today with the rebate offer', kind: 'money', def: 0, min: 0, max: 1e9, modes: ['pv'], opt: true },
  ],
  examples: [
    { id: 'RF-01', title: 'Original financing offer', mode: 'pay', v: { price: 40000, reb: 3000, apr: 4, n: 60 } },
    { id: 'RF-02', title: 'Smaller loan rebate', mode: 'pay', v: { price: 32000, reb: 2500, apr: 3.9, n: 60 } },
    { id: 'RF-03', title: 'Large rebate offer', mode: 'pay', v: { price: 45000, reb: 5000, apr: 5.5, n: 72 } },
    { id: 'RF-04', title: 'Short-term purchase', mode: 'pay', v: { price: 28000, reb: 1800, apr: 4.2, n: 48 } },
    { id: 'RF-05', title: 'Break-even financing rate', mode: 'be', v: { price: 40000, reb: 3000, n: 60 } },
    { id: 'RF-06', title: 'Rebate borrowing-rate ceiling', mode: 'be', v: { price: 52000, reb: 4500, n: 72 } },
    { id: 'RF-07', title: 'Required minimum rebate', mode: 'min', v: { price: 36000, apr: 4.9, n: 60 } },
    { id: 'RF-08', title: 'Rebate needed on a longer loan', mode: 'min', v: { price: 48000, apr: 5.9, n: 72 } },
    { id: 'RF-09', title: 'Different loan terms', mode: 'pv', v: { price: 42000, reb: 3500, n0: 48, n: 60, apr: 4.8, d: 6, fee: 0 } },
    { id: 'RF-10', title: 'Rebate loan with a cash fee', mode: 'pv', v: { price: 38000, reb: 4000, fee: 600, apr: 4.2, d: 5, n: 60, n0: 60 } },
  ],
  calc(v, mode) {
    const o = {};
    if (mode === 'pv') {
      o.pay0 = v.price / v.n0; o.prin = v.price - v.reb; o.r = pc(v.apr) / 12; o.payR = -F.pmt(o.r, v.n, o.prin, 0);
      o.rd = pc(v.d) / 12; o.pv0 = o.pay0 * F.a(o.rd, v.n0); o.pvR = o.payR * F.a(o.rd, v.n) + v.fee; o.adv = o.pv0 - o.pvR;
      return o;
    }
    o.pay0 = v.price / v.n;
    if (mode === 'min') {
      o.r = pc(v.apr) / 12; o.loan = o.pay0 * F.a(o.r, v.n); o.minReb = v.price - o.loan;
      return o;
    }
    o.prin = v.price - v.reb;
    o.rBE = F.rate(v.n, -o.pay0, o.prin, 0); o.aprBE = o.rBE * 12; o.earBE = Math.pow(1 + o.rBE, 12) - 1;
    if (mode === 'pay') { o.r = pc(v.apr) / 12; o.payR = -F.pmt(o.r, v.n, o.prin, 0); o.diff = o.payR - o.pay0; }
    return o;
  },
  out(v, o, mode) {
    if (mode === 'pv') return [cell('0% payment', o.pay0), cell('Rebate-loan amount', o.prin), cell('Rebate-loan payment', o.payR), cell('Discount rate per month', o.rd, 'pct4'), cell('PV cost of 0% offer', o.pv0), cell('PV cost of rebate offer', o.pvR), verdict('Cheaper offer', 'good', o.adv > 0 ? 'Rebate' : '0% financing', `by ${M(Math.abs(o.adv))} in PV`)];
    if (mode === 'min') return [cell('0% payment', o.pay0, 'money', 'price ÷ months'), cell('Outside rate per month', o.r, 'pct4'), cell('Loan that payment repays', o.loan), cell('Smallest rebate that ties', o.minReb)];
    const c = [cell('0% payment', o.pay0, 'money', 'price ÷ months'), cell('Amount borrowed with rebate', o.prin)];
    if (mode === 'pay') c.push(cell('Rebate-loan payment', o.payR), cell('Rebate minus 0% payment', o.diff, 'moneyS'), verdict('Better offer', 'good', o.diff > 0 ? '0% financing' : 'Rebate'));
    c.push(cell('Break-even APR', o.aprBE, 'pct4', 'rebate wins below this'));
    if (mode === 'be') c.push(cell('Break-even rate per month', o.rBE, 'pct4'), cell('Break-even EAR', o.earBE, 'pct4'));
    return c;
  },
  charts: [{
    title: (v, o, mode) => (mode === 'pv' ? 'PV cost of each offer' : mode === 'min' ? 'Rebate-offer payment for each rebate size' : 'Rebate-loan payment at each interest rate'),
    legend: (v, o, mode) => (mode === 'pv' ? null : [['s1', mode === 'min' ? 'Payment with the rebate' : 'Payment with the rebate', 'line'], ['s2', '0% financing payment', 'line']]),
    draw(plot, fig, v, o, mode) {
      if (mode === 'pv') {
        drawHBars(plot, fig, { label: 'PV cost comparison', fmt: fmt.axis, rows: [{ label: '0% financing', value: M(o.pv0), segs: [{ v: o.pv0, cls: 's2' }] }, { label: v.fee ? 'Rebate offer (with fee)' : 'Rebate offer', value: M(o.pvR), segs: [{ v: o.pvR - v.fee, cls: 's1' }].concat(v.fee ? [{ v: v.fee, cls: 'b', tip: `Fee <span class="num">${M(v.fee)}</span>` }] : []) }] });
        return;
      }
      if (mode === 'min') {
        const hi = Math.max(o.minReb * 2, 1000);
        const xs = Array.from({ length: 61 }, (_, i) => (hi * i) / 60);
        const ys = xs.map((rb) => -F.pmt(o.r, v.n, v.price - rb, 0));
        drawLine(plot, fig, {
          label: 'Payment with rebate falls as the rebate grows', xs,
          series: [{ name: 'Rebate', ys, cls: 's1' }, { name: '0%', ys: xs.map(() => o.pay0), cls: 's2' }],
          points: [{ x: o.minReb, y: o.pay0, cls: 'ink', label: `${M(o.minReb, 0)} rebate ties`, anchor: 'start', pos: 'below' }],
          xFmt: fmt.axis, yFmt: (y) => '$' + Math.round(y),
          tip: (i) => `<b>${M(xs[i])} rebate</b><br>Rebate-loan payment <span class="num">${M(ys[i])}</span><br>0% payment <span class="num">${M(o.pay0)}</span>`,
        });
        return;
      }
      const top = Math.max(0.12, (o.aprBE || 0) * 1.6, mode === 'pay' ? pc(v.apr) * 1.3 : 0);
      const xs = Array.from({ length: 61 }, (_, i) => (top * i) / 60);
      const ys = xs.map((a) => -F.pmt(a / 12, v.n, o.prin, 0));
      const pts = [{ x: o.aprBE, y: o.pay0, cls: 'ink', label: `Break-even ${fmt.pct(o.aprBE, 2)}`, anchor: 'start', pos: 'below' }];
      if (mode === 'pay') pts.push({ x: pc(v.apr), y: o.payR, cls: 's1', label: `At ${PT(pc(v.apr))}: ${M(o.payR)}`, anchor: 'end', pos: 'above' });
      drawLine(plot, fig, {
        label: 'Rebate-loan payment rises with the rate', xs,
        series: [{ name: 'Rebate', ys, cls: 's1' }, { name: '0%', ys: xs.map(() => o.pay0), cls: 's2' }],
        points: pts, xFmt: fmt.axisPct, yFmt: (y) => '$' + Math.round(y),
        tip: (i) => `<b>Loan rate ${fmt.pct(xs[i], 2)}</b><br>Rebate-loan payment <span class="num">${M(ys[i])}</span><br>0% payment <span class="num">${M(o.pay0)}</span>`,
      });
    },
  }],
  text(v, o, mode) {
    if (mode === 'pv') return `<p>The terms differ (${v.n0} vs ${v.n} months)${v.fee ? ' and the rebate offer has a fee' : ''}, so payments can’t be compared directly. Discount both payment streams at ${PT(pc(v.d))}: 0% financing costs <b>${M(o.pv0)}</b> in today’s dollars and the rebate offer <b>${M(o.pvR)}</b>${v.fee ? ` including the ${M(v.fee)} fee` : ''}. Choose the <b>${o.adv > 0 ? 'rebate' : '0% financing'}</b>.</p>`;
    if (mode === 'min') return `<p>0% financing means ${M(o.pay0)} a month. At ${PT(pc(v.apr))}, that same payment repays a loan of ${M(o.loan)}. So the rebate must cut the price by at least ${M(v.price)} − ${M(o.loan)} = <b>${M(o.minReb)}</b> to match 0% financing.</p>`;
    let t = `<p>0% financing: ${M(v.price)} ÷ ${v.n} = <b>${M(o.pay0)}</b> a month. With the rebate you borrow only ${M(o.prin)}`;
    if (mode === 'pay') t += ` but pay ${PT(pc(v.apr))}: <b>${M(o.payR)}</b> a month, ${M(Math.abs(o.diff))} ${o.diff > 0 ? 'more' : 'less'}. Take the <b>${o.diff > 0 ? '0% financing' : 'rebate'}</b>.</p>`;
    else t += '.</p>';
    t += `<p class="aside">The rebate wins only if you can borrow below <b>${fmt.pct(o.aprBE, 2)}</b> APR, the rate at which ${M(o.prin)} costs exactly ${M(o.pay0)} a month.</p>`;
    return t;

/* ================================================================ 15 Property NPV */
function property(v) {
  const r = pc(v.r), g = pc(v.g), h = pc(v.h);
  const lastRent = v.R1 * Math.pow(1 + g, v.n - 1);
  const factor = F.growPV(1, r, g, v.n);
  const gross = v.price * Math.pow(1 + h, v.n);
  const net = gross * (1 - pc(v.s));
  const pvSale = net / Math.pow(1 + r, v.n);
  return { r, g, h, lastRent, factor, gross, net, pvSale };
}

  },

    const r = xp(o.r), g = xp(o.g), h = xp(o.h);

function bondPV(F0, C, r, n) { return C * F.a(r, n) + F0 * Math.pow(1 + r, -n); }
function priceClass(price, face) { const d = Math.round((price - face) * 100) / 100; return Math.abs(d) < 0.005 ? 0 : Math.sign(d); }
const CLASS_TXT = { 1: 'Premium', 0: 'Par', '-1': 'Discount' };
function clsCell(k) { return { label: 'Price vs face', raw: k, kind: 'text', text: CLASS_TXT[k], sub: k > 0 ? 'above face' : k < 0 ? 'below face' : 'equal to face' }; }
function needWhole(n) { need(Math.abs(n - Math.round(n)) < 1e-9 && n >= 1, 'Years × coupons per year must be a whole number of payments.'); return Math.round(n); }
function yieldCurve(F0, C, m, n, lo, hi) {
  const xs = Array.from({ length: 81 }, (_, i) => lo + ((hi - lo) * i) / 80);
  // xs are annual yields in percent (0 to hi)
  return { xs, ys: xs.map((y) => bondPV(F0, C, y / 100 / m, n)) };
}

    { id: 'BP-02', title: 'Class bond at 9%', v: { F: 1000, c: 5, y: 9, m: 1, T: 3 } },
    { id: 'BP-03', title: 'Class bond at 1%', v: { F: 1000, c: 5, y: 1, m: 1, T: 3 } },
    { id: 'BP-04', title: 'Semiannual at par', v: { F: 1000, c: 6, y: 6, m: 2, T: 5 } },
    { id: 'BP-05', title: 'Semiannual discount', v: { F: 1000, c: 4, y: 7, m: 2, T: 8 } },
    { id: 'BP-06', title: 'Semiannual premium', v: { F: 1000, c: 7, y: 4, m: 2, T: 6 } },
    { id: 'BP-07', title: 'Quarterly bond', v: { F: 2000, c: 5, y: 6, m: 4, T: 4 } },
    { id: 'BP-08', title: 'Zero required return', v: { F: 1000, c: 3.5, y: 0, m: 1, T: 2 } },
    { id: 'BP-09', title: 'Larger denomination', v: { F: 5000, c: 5.5, y: 6.5, m: 2, T: 5 } },
    { id: 'BP-10', title: 'Short annual note', v: { F: 500, c: 8, y: 10, m: 1, T: 1 } },
  ],
  calc(v) {
    const n = needWhole(v.T * v.m);
    const C = (v.F * pc(v.c)) / v.m, r = pc(v.y) / v.m;
    const pvC = C * F.a(r, n), pvF = v.F * Math.pow(1 + r, -n), price = pvC + pvF;
    return { n, C, r, pvC, pvF, price, last: C + v.F, diff: price - v.F, cls: priceClass(price, v.F) };
  },
  out(v, o) {
    return [cell('Coupon per period', o.C), cell('Yield per period', o.r, 'pct4'), cell('Number of coupons', o.n, 'int'), cell('PV of coupons', o.pvC), cell('PV of face value', o.pvF), cell('Price', o.price), cell('Last cash flow', o.last, 'money', 'coupon + face'), cell('Price − face', o.diff, 'moneyS'), clsCell(o.cls)];
  },
  charts: [{
    title: 'Price at every market yield',
    draw(plot, fig, v, o) {
      const hi = Math.max(12, v.c * 2, v.y + 4);
      const cv = yieldCurve(v.F, o.C, v.m, o.n, 0, hi);
      drawLine(plot, fig, {
        label: 'Bond price falls as the market yield rises', xs: cv.xs, series: [{ name: 'Price', ys: cv.ys, cls: 's1' }],
        hrefs: [{ y: v.F, label: `Face ${M(v.F, 0)}`, at: 'left' }], vrefs: [{ x: v.c, label: `Coupon rate ${PT(pc(v.c))}`, anchor: v.c > hi * 0.6 ? 'end' : 'start' }],
        points: [{ x: v.y, y: o.price, cls: 's2', label: M(o.price), ...(Math.abs(v.y - v.c) < hi * 0.12 || v.y > hi * 0.6 ? { anchor: 'end', pos: 'below' } : { anchor: 'start', pos: 'above' }) }],
        xFmt: (x) => `${+x.toFixed(1)}%`,
        tip: (i) => `<b>Yield ${fmt.num(cv.xs[i], 2)}%</b><br>Price <span class="num">${M(cv.ys[i])}</span><br>${cv.xs[i] < v.c - 1e-9 ? 'Premium' : cv.xs[i] > v.c + 1e-9 ? 'Discount' : 'Par'}`,
      });
    },
  }],
  text(v, o) {
    const rel = o.cls > 0 ? `The ${PT(pc(v.c))} coupon rate beats the ${PT(pc(v.y))} yield, so the bond sells above face, at a <b>premium</b>.` : o.cls < 0 ? `The ${PT(pc(v.c))} coupon rate is below the ${PT(pc(v.y))} yield, so the bond sells below face, at a <b>discount</b>.` : `The coupon rate equals the yield, so the bond sells at <b>par</b>.`;
    return `<p>The bond pays ${M(o.C)} every ${perName(v.m)} for ${o.n} periods, then ${M(v.F)} back. Discounted at ${PT(o.r)} per period: ${M(o.pvC)} for the coupons + ${M(o.pvF)} for the face = <b>${M(o.price)}</b>.</p><p>${rel} On the chart, the price crosses face exactly where the yield equals the coupon rate.</p>`;
  },
  excel(v, o) { return [['Price', `=PV(${exRate(v.y, v.m)}, ${o.n}, -${fmt.raw(o.C)}, -${v.F})`, M(o.price)]]; },
  ti(v, o) { return [{ kind: 'tvm', title: 'Price', N: o.n, I: v.y, PV: 0, PMT: o.C, FV: v.F, PY: v.m, solve: 'PV', expect: -o.price, note: 'PV is negative: it’s the price you pay.' }]; },
  watch: [
    '<b>Coupon per period</b> = face × coupon rate ÷ coupons per year.',
    '<b>Semiannual bonds:</b> yield ÷ 2 and years × 2. On the TI, P/Y = 2 handles both.',
    '<b>Coupon rate above the yield → premium; below → discount.</b>',
  ],
  more: [`For a full walkthrough of why the class bond sells at a premium or discount, open <a href="${BOND_PAGE}" target="_blank" rel="noopener">Bond Premiums and Discounts</a>.`],
  moreTitle: 'Go deeper',
  verify: {
    '1. Coupon per period': (o) => o.C, '2. Yield per coupon period': (o) => o.r, '3. Number of remaining coupons': (o) => o.n, '4. PV of coupons': (o) => o.pvC,
    '5. PV of face value': (o) => o.pvF, '6. Bond price': (o) => o.price, '7. Final coupon plus face value': (o) => o.last, '8. Price minus face value': (o) => o.diff,
    '9. Price class: 1 premium; 0 par; -1 discount': (o) => o.cls,
  },
});

topic({

  idea: 'The yield to maturity is the <b>one discount rate that makes the PV of the bond’s cash flows equal its price</b>. The coupon rate is just the coupon over face.',
  inputs: [
    { k: 'F', label: 'Face value', kind: 'money', def: 1000, min: 1, max: 1e10 },
    { k: 'C', label: 'Coupon per period', kind: 'money', def: 50, min: 0, max: 1e10 },

  ],
  calc(v) {

    return { n, r, ytm: r * v.m, eay: Math.pow(1 + r, v.m) - 1, annC: v.C * v.m, cRate: (v.C * v.m) / v.F, check: bondPV(v.F, v.C, r, n), cls: priceClass(v.P, v.F) };
  },
  out(v, o) {

  },
  charts: [{
    title: 'The YTM is where the price curve hits the market price',
    draw(plot, fig, v, o) {
      const hi = Math.max(12, o.ytm * 100 * 1.6 + 2, o.cRate * 200);
      const cv = yieldCurve(v.F, v.C, v.m, o.n, 0, hi);
      drawLine(plot, fig, {
        label: 'Price-yield curve with the market price', xs: cv.xs, series: [{ name: 'Price', ys: cv.ys, cls: 's1' }],
        // labels sit where the falling curve isn't: above-right of the point, or below-left near the right edge
        hrefs: [{ y: v.P, label: `Market price ${M(v.P)}`, at: o.ytm * 100 < hi * 0.45 ? 'right' : 'left' }],
        points: [{ x: o.ytm * 100, y: v.P, cls: 's2', label: `YTM ${fmt.pct(o.ytm, 2)}`, ...(o.ytm * 100 > hi * 0.7 ? { anchor: 'end', pos: 'below' } : { anchor: 'start', pos: 'above' }) }],
        xFmt: (x) => `${+x.toFixed(1)}%`,
        tip: (i) => `<b>Yield ${fmt.num(cv.xs[i], 2)}%</b><br>PV of the cash flows <span class="num">${M(cv.ys[i])}</span>`,
      });
    },
  }],
  text(v, o) {
    return `<p>Try rates until the PV of ${o.n} coupons of ${M(v.C)} plus ${M(v.F)} at the end equals the ${M(v.P)} price. That happens at <b>${fmt.pt(o.r)} per ${perName(v.m)}</b>, a YTM of <b>${fmt.pt(o.ytm)}</b>${v.m > 1 ? ` (nominal, × ${v.m}) or ${fmt.pt(o.eay)} effective` : ''}.</p><p class="aside">The coupon rate is ${fmt.pct(o.cRate, 2)} (coupons over face, not price). ${o.cls < 0 ? 'Buying below face adds a gain at maturity, so the YTM is above the coupon rate.' : o.cls > 0 ? 'Paying above face means a loss at maturity, so the YTM is below the coupon rate.' : 'At par, the YTM equals the coupon rate.'}</p>`;
  },
  excel(v, o) {
    const rows = [['YTM (nominal)', `=RATE(${o.n}, ${v.C}, -${v.P}, ${v.F})*${v.m}`, fmt.pt(o.ytm)]];
    if (v.m > 1) rows.push(['Effective annual yield', `=(1+RATE(${o.n}, ${v.C}, -${v.P}, ${v.F}))^${v.m}-1`, fmt.pt(o.eay)]);
    return rows;
  },
  ti(v, o) {
    const s = [{ kind: 'tvm', title: 'YTM', N: o.n, I: 0, PV: -v.P, PMT: v.C, FV: v.F, PY: v.m, solve: 'I%', expect: 100 * o.ytm, note: 'The price is negative because you pay it.' }];
    if (v.m > 1) s.push({ kind: 'home', title: 'Effective annual yield', lines: [[`►Eff(${t10(100 * o.ytm)},${v.m})`, 100 * (Math.pow(1 + v10(100 * o.ytm) / 100 / v.m, v.m) - 1)]] });
    return s;
  },
  watch: [
    '<b>The coupon rate uses face value,</b> never the price.',
    '<b>Excel’s RATE is per period;</b> multiply by coupons per year. The TI’s I% is already annual when P/Y = m.',
    '<b>Semiannual bonds:</b> the effective annual yield is (1 + r)<sup>2</sup> − 1, a bit above the quoted YTM.',
  ],
  verify: {
    '1. Annual coupon dollars': (o) => o.annC, '2. Annual coupon rate': (o) => o.cRate, '3. Remaining coupon count': (o) => o.n, '4. Yield per coupon period': (o) => o.r,
    '5. Nominal annual yield': (o) => o.ytm, '6. Effective annual yield': (o) => o.eay, '7. Price at solved yield': (o) => o.check, '8. Price class: 1 premium; 0 par; -1 discount': (o) => o.cls,
  },
});

  inputs: [

    { k: 'cL', label: 'Bond L coupon rate', kind: 'pct', def: 1, min: 0, max: 100, slider: [0, 12, 0.05] },
    { k: 'cH', label: 'Bond H coupon rate', kind: 'pct', def: 5, min: 0, max: 100, slider: [0, 12, 0.05] },
    { k: 'y', label: 'Market yield (both)', kind: 'pct', def: 1, min: 0, max: 100, slider: [0, 12, 0.05] },
    { k: 'm', label: 'Coupons per year', kind: 'sel', def: 1, options: FREQ },
    { k: 'T', label: 'Years to maturity', kind: 'num', def: 3, min: 0.25, max: 100 },
    { k: 'X', label: 'Extra price asked for H', kind: 'money', def: 110, min: 0, max: 1e10, slider: [0, 500, 1] },

  examples: [

    { id: 'CC-03', title: 'Five-year annual', v: { F: 1000, cL: 3, cH: 6, y: 5.5, m: 1, T: 5, X: 125 } },
    { id: 'CC-04', title: 'Semiannual bank bonds', v: { F: 1000, cL: 2, cH: 5, y: 6, m: 2, T: 7, X: 170 } },
    { id: 'CC-05', title: 'Premium income offer', v: { F: 2000, cL: 4, cH: 7, y: 4.5, m: 2, T: 6, X: 325 } },
    { id: 'CC-06', title: 'Quarterly coupons', v: { F: 1000, cL: 3, cH: 5, y: 6.5, m: 4, T: 4, X: 80 } },
    { id: 'CC-07', title: 'Longer stream', v: { F: 1000, cL: 1.5, cH: 4, y: 5.5, m: 2, T: 12, X: 220 } },
    { id: 'CC-08', title: 'Short one-year', v: { F: 500, cL: 4, cH: 8, y: 6, m: 1, T: 1, X: 20 } },

  calc(v) {

  text(v, o) {

  excel(v, o) { return [['PV of extra coupons', `=PV(${exRate(v.y, v.m)}, ${o.n}, -${fmt.raw(o.dC)})`, M(o.pvX)], ['Value of paying extra', `=PV(${exRate(v.y, v.m)}, ${o.n}, -${fmt.raw(o.dC)})-${v.X}`, MS(o.net)]]; },
  ti(v, o) { return [{ kind: 'tvm', title: 'PV of the extra coupons', N: o.n, I: v.y, PV: 0, PMT: o.dC, FV: 0, PY: v.m, solve: 'PV', expect: -o.pvX, note: 'FV = 0: both bonds repay the same face.' }]; },
  watch: [
    '<b>Compare the extra price with the PV</b> of the extra coupons, not their sum.',

    '9. Net value of paying extra': (o) => o.net, '10. Decision: 1 upgrade; 0 equal; -1 pass': (o) => o.dec,
  },
});

    { id: 'ZC-04', title: 'Quarterly quoted yield', v: { F: 2000, y: 8, m: 4, T: 3, D: 1560 } },
    { id: 'ZC-05', title: 'One-year zero', v: { F: 500, y: 4, m: 1, T: 1, D: 475 } },
    { id: 'ZC-06', title: 'Ten-year zero', v: { F: 1000, y: 5.5, m: 2, T: 10, D: 600 } },
    { id: 'ZC-07', title: 'Large face-value zero', v: { F: 10000, y: 6.5, m: 2, T: 6, D: 6700 } },
    { id: 'ZC-08', title: 'Low-yield zero', v: { F: 1000, y: 1, m: 1, T: 3, D: 975 } },
    { id: 'ZC-09', title: 'Zero-yield comparison', v: { F: 1000, y: 0, m: 1, T: 2, D: 990 } },
    { id: 'ZC-10', title: 'Long annual zero', v: { F: 5000, y: 7.5, m: 1, T: 15, D: 1650 } },
  ],
  calc(v) {
    const n = needWhole(v.T * v.m);
    const r = pc(v.y) / v.m, fair = v.F * Math.pow(1 + r, -n);
    const rd = Math.pow(v.F / v.D, 1 / n) - 1;
    const npv = fair - v.D;
    return { n, r, fair, disc: v.F - fair, rd, nom: rd * v.m, ear: Math.pow(1 + rd, v.m) - 1, npv, dec: Math.abs(npv) < 0.005 ? 0 : Math.sign(npv) };
  },
  out(v, o) {

  },
  charts: [{
    title: 'The zero’s value grows to face by maturity',
    legend: [['s1', 'Fair value at your required yield', 'line'], ['s2', 'Value at the dealer’s yield', 'line']],

      drawLine(plot, fig, {
        label: 'Zero-coupon value over time', xs, series: [{ name: 'Fair', ys: fairP, cls: 's1' }, { name: 'Dealer', ys: dealP, cls: 's2' }],
        hrefs: [{ y: v.F, label: `Face ${M(v.F, 0)}` }],
        points: [{ x: 0, y: o.fair, cls: 's1', label: `Fair ${M(o.fair)}`, anchor: 'start', pos: o.fair >= v.D ? 'above' : 'below' }, { x: 0, y: v.D, cls: 's2', label: `Dealer ${M(v.D)}`, anchor: 'start', pos: o.fair >= v.D ? 'below' : 'above' }],
        // room under the lowest start point for its label, and whole-year ticks when the zero runs 2+ years
        yDomain: (() => { const lo = Math.min(o.fair, v.D), span = Math.max(v.F - lo, 0.02 * v.F); return [lo - 0.14 * span, Math.max(v.F, o.fair, v.D) + 0.05 * span]; })(),
        xTicks: v.T >= 2 ? (() => { const st = Math.max(1, niceStep(v.T, Math.max(2, Math.floor((plot.clientWidth - 72) / 60)))); const t = []; for (let k = 0; k <= v.T + 1e-9; k += st) t.push(k); return t; })() : undefined,
        xFmt: (x) => `Yr ${+x.toFixed(1)}`,
        tip: (i) => `<b>Year ${fmt.num(xs[i], 2)}</b><br>Fair value <span class="num">${M(fairP[i])}</span><br>At the dealer’s yield <span class="num">${M(dealP[i])}</span>`,
      });
    },
  }],
  text(v, o) {
    return `<p>A zero pays only ${M(v.F)}, once, in ${fmt.num(v.T, 2)} years (${o.n} periods). At ${PT(pc(v.y))}, that’s worth ${M(v.F)} ÷ (1 + ${PT(o.r)})<sup>${o.n}</sup> = <b>${M(o.fair)}</b> today.</p><p>The dealer’s ${M(v.D)} price implies a yield of <b>${fmt.pt(o.nom)}</b> a year, ${o.nom > pc(v.y) ? 'more' : o.nom < pc(v.y) ? 'less' : 'exactly what'} than${o.nom === pc(v.y) ? '' : ' the'} ${PT(pc(v.y))} you need. Buying has an NPV of <b>${MS(o.npv)}</b>: ${o.dec > 0 ? 'buy' : o.dec < 0 ? 'pass' : 'fair'}.</p>`;
  },
  excel(v, o) { return [['Fair price', `=PV(${exRate(v.y, v.m)}, ${o.n}, 0, -${v.F})`, M(o.fair)], ['Dealer’s yield (annual)', `=((${v.F}/${v.D})^(1/${o.n})-1)*${v.m}`, fmt.pt(o.nom)]]; },
  ti(v, o) {
    return [
      { kind: 'tvm', title: 'Fair price', N: o.n, I: v.y, PV: 0, PMT: 0, FV: v.F, PY: v.m, solve: 'PV', expect: -o.fair },
      { kind: 'tvm', title: 'Dealer’s yield', N: o.n, I: 0, PV: -v.D, PMT: 0, FV: v.F, PY: v.m, solve: 'I%', expect: 100 * o.nom },
    ];
  },
  watch: [
    '<b>PMT = 0</b> for a zero; only FV matters.',
    '<b>Match the compounding:</b> a semiannual quote means n = years × 2 (P/Y = 2 on the TI).',
    '<b>Fair price uses your required yield;</b> the implied yield uses the dealer’s price.',
  ],
  verify: {
    '1. Total compounding periods': (o) => o.n, '2. Required periodic yield': (o) => o.r, '3. Fair zero-coupon price': (o) => o.fair, '4. Face value minus fair price': (o) => o.disc,
    '5. Dealer-implied periodic yield': (o) => o.rd, '6. Dealer-implied nominal annual yield': (o) => o.nom, '7. Dealer-implied EAR': (o) => o.ear, '8. NPV at dealer price': (o) => o.npv,
    '9. Decision: 1 buy; 0 equal; -1 pass': (o) => o.dec,
  },
});

/* ================================================================ 21 Yield sensitivity */
topic({
  id: '21',
  name: 'Yield Sensitivity',
  idea: 'When yields move, bond prices move the other way. For a zero, a quick estimate is <b>% change ≈ −n × Δr ÷ (1 + r)</b>; the exact answer comes from repricing.',
  inputs: [
    { k: 'F', label: 'Face value', kind: 'money', def: 1000, min: 1, max: 1e10 },
    { k: 'y0', label: 'Old yield (annual)', kind: 'pct', def: 5, min: 0, max: 100, slider: [0, 15, 0.05] },
    { k: 'y1', label: 'New yield (annual)', kind: 'pct', def: 5.25, min: 0, max: 100, slider: [0, 15, 0.05] },
    { k: 'm', label: 'Compounding periods per year', kind: 'sel', def: 1, options: FREQ },
    { k: 'T', label: 'Years to maturity', kind: 'num', def: 3, min: 0.25, max: 100, slider: [1, 30, 1] },
  ],
  examples: [
    { id: 'YS-01', title: 'Small yield increase', v: { F: 1000, y0: 5, y1: 5.25, m: 1, T: 3 } },
    { id: 'YS-02', title: 'Small yield decrease', v: { F: 1000, y0: 6, y1: 5.75, m: 1, T: 5 } },
    { id: 'YS-03', title: 'Long zero, same move', v: { F: 1000, y0: 5, y1: 5.25, m: 1, T: 15 } },
    { id: 'YS-04', title: 'Semiannual shock', v: { F: 1000, y0: 6, y1: 6.5, m: 2, T: 10 } },
    { id: 'YS-05', title: 'Quarterly decrease', v: { F: 2000, y0: 8, y1: 7.5, m: 4, T: 4 } },
    { id: 'YS-06', title: 'Large yield increase', v: { F: 1000, y0: 4, y1: 6, m: 1, T: 10 } },
    { id: 'YS-07', title: 'Large yield decrease', v: { F: 1000, y0: 8, y1: 6, m: 1, T: 10 } },
    { id: 'YS-08', title: 'Short maturity', v: { F: 5000, y0: 5, y1: 5.5, m: 2, T: 1 } },
    { id: 'YS-09', title: 'Twenty-year zero', v: { F: 1000, y0: 6.5, y1: 6.7, m: 2, T: 20 } },
    { id: 'YS-10', title: 'No yield change', v: { F: 1000, y0: 5, y1: 5, m: 1, T: 7 } },
  ],
  calc(v) {
    const n = needWhole(v.T * v.m);
    const r0 = pc(v.y0) / v.m, r1 = pc(v.y1) / v.m;
    const P0 = v.F * Math.pow(1 + r0, -n), P1 = v.F * Math.pow(1 + r1, -n);
    const approx = (-n * (r1 - r0)) / (1 + r0);
    return { n, r0, r1, P0, P1, dP: P1 - P0, pct: P1 / P0 - 1, approx, approxP: P0 * (1 + approx), el: -n };
  },
  out(v, o) {
    return [cell('Old yield per period', o.r0, 'pct4'), cell('New yield per period', o.r1, 'pct4'), cell('Periods to maturity', o.n, 'int'), cell('Old price', o.P0), cell('New price (exact)', o.P1), cell('Dollar change', o.dP, 'moneyS'), cell('Exact % change', o.pct, 'pctS4'), cell('Quick estimate', o.approx, 'pctS4', '−n × Δr ÷ (1 + r)'), cell('Price from the estimate', o.approxP), cell('Elasticity to (1 + r)', o.el, 'num2', '= −n for a zero')];
  },
  charts: [{
    title: 'Exact price curve vs the straight-line estimate',
    legend: [['s1', 'Exact price', 'line'], ['s2', 'Straight-line estimate', 'line']],
    draw(plot, fig, v, o) {
      const lo = Math.max(0, Math.min(v.y0, v.y1) - 2), hi = Math.max(v.y0, v.y1) + 2;
      const xs = Array.from({ length: 81 }, (_, i) => lo + ((hi - lo) * i) / 80);
      const ex = xs.map((y) => v.F * Math.pow(1 + y / 100 / v.m, -o.n));
      const tan = xs.map((y) => o.P0 * (1 - (o.n * (y / 100 / v.m - o.r0)) / (1 + o.r0)));
      const pts = [{ x: v.y0, y: o.P0, cls: 'ink', label: `Old ${M(o.P0)}`, anchor: 'start', pos: 'above' }];
      if (v.y1 !== v.y0) pts.push({ x: v.y1, y: o.P1, cls: 's1', label: `New ${M(o.P1)}`, anchor: v.y1 > v.y0 ? 'start' : 'end', pos: 'below' });
      drawLine(plot, fig, {
        label: 'Zero-coupon price against yield with tangent line', xs, series: [{ name: 'Exact', ys: ex, cls: 's1' }, { name: 'Estimate', ys: tan, cls: 's2', dash: true }],
        points: pts, xFmt: (x) => `${+x.toFixed(1)}%`,
        tip: (i) => `<b>Yield ${fmt.num(xs[i], 2)}%</b><br>Exact <span class="num">${M(ex[i])}</span><br>Estimate <span class="num">${M(tan[i])}</span>`,
      });
    },
  }],
  text(v, o) {
    if (v.y0 === v.y1) return `<p>With no yield change the price stays at ${M(o.P0)}. Move the new yield to see how far it swings: this ${o.n}-period zero moves about ${fmt.num(o.n / (1 + o.r0), 2)}% for each 1-point move in the periodic yield.</p>`;
    return `<p>Moving the yield from ${PT(pc(v.y0))} to ${PT(pc(v.y1))} changes the price from ${M(o.P0)} to <b>${M(o.P1)}</b>, a ${fmt.pctS(o.pct, 3)} change. The quick estimate is −${o.n} × ${fmt.pctS(o.r1 - o.r0, 3)} ÷ ${fmt.num(1 + o.r0, 4)} = <b>${fmt.pctS(o.approx, 3)}</b>.</p><p class="aside">The estimate is the straight line touching the curve at the old yield. Small moves stay close to the curve; big moves drift away because the curve bends (convexity). Longer zeros (bigger n) move more.</p>`;
  },
  excel(v, o) { return [['New price', `=${v.F}/(1+${exRate(v.y1, v.m)})^${o.n}`, M(o.P1)], ['Exact % change', `=(${v.F}/(1+${exRate(v.y1, v.m)})^${o.n})/(${v.F}/(1+${exRate(v.y0, v.m)})^${o.n})-1`, fmt.pctS(o.pct, 4)], ['Quick estimate', `=-${o.n}*(${exRate(v.y1, v.m)}-${exRate(v.y0, v.m)})/(1+${exRate(v.y0, v.m)})`, fmt.pctS(o.approx, 4)]]; },
  ti(v, o) {
    return [{ kind: 'home', title: 'Old price, new price, estimate', lines: [[`${tn(v.F)}/${td(1 + o.r0)}^${o.n}`, o.P0], [`${tn(v.F)}/${td(1 + o.r1)}^${o.n}`, o.P1], [`⁻${o.n}*(${td(o.r1)}-${td(o.r0)})/${td(1 + o.r0)}`, o.approx]] }];
  },
  watch: [
    '<b>Longer maturity, bigger swings.</b> A 15-year zero moves about five times as much as a 3-year zero for the same yield change.',
    '<b>The estimate uses the old yield and old price</b> and gets worse for big moves.',
    '<b>Use per-period yields</b> for semiannual or quarterly bonds.',
  ],
  verify: {
    '1. Old periodic yield': (o) => o.r0, '2. New periodic yield': (o) => o.r1, '3. Periods to maturity': (o) => o.n, '4. Old bond price': (o) => o.P0, '5. Exact new bond price': (o) => o.P1,
    '6. Dollar price change': (o) => o.dP, '7. Exact percentage price change': (o) => o.pct, '8. Approximate percentage change': (o) => o.approx, '9. Approximate new price': (o) => o.approxP,
    '10. Elasticity to gross yield (1+r)': (o) => o.el,
  },
});

/* ================================================================ 22 Risk premiums */
topic({
  id: '22',
  name: 'Risk Premiums',
  idea: 'Required yield = <b>risk-free rate + risk premium</b>. When the premium widens, the promised coupons don’t change, but they’re discounted harder, so the price falls.',
  inputs: [
    { k: 'F', label: 'Face value', kind: 'money', def: 1000, min: 1, max: 1e10 },
    { k: 'c', label: 'Coupon rate', kind: 'pct', def: 5, min: 0, max: 100 },
    { k: 'm', label: 'Coupons per year', kind: 'sel', def: 1, options: FREQ },
    { k: 'T', label: 'Years to maturity', kind: 'num', def: 3, min: 0.25, max: 100 },
    { k: 'rf', label: 'Risk-free rate', kind: 'pct', def: 3, min: 0, max: 100, slider: [0, 10, 0.05] },
    { k: 'p0', label: 'Old risk premium', kind: 'pct', def: 2, min: 0, max: 100, slider: [0, 8, 0.05] },
    { k: 'p1', label: 'New risk premium', kind: 'pct', def: 4, min: 0, max: 100, slider: [0, 8, 0.05] },
  ],
  examples: [
    { id: 'RP-01', title: 'Credit risk increases', v: { F: 1000, c: 5, m: 1, T: 3, rf: 3, p0: 2, p1: 4 } },
    { id: 'RP-02', title: 'Credit risk decreases', v: { F: 1000, c: 6, m: 2, T: 5, rf: 4, p0: 3.5, p1: 1.5 } },
    { id: 'RP-03', title: 'Treasury-like start', v: { F: 1000, c: 4, m: 1, T: 7, rf: 4, p0: 0, p1: 1 } },
    { id: 'RP-04', title: 'Riskier quarterly bond', v: { F: 2000, c: 7, m: 4, T: 4, rf: 4.5, p0: 2, p1: 3 } },
    { id: 'RP-05', title: 'Unchanged premium', v: { F: 1000, c: 5.5, m: 2, T: 6, rf: 3.5, p0: 2, p1: 2 } },
    { id: 'RP-06', title: 'Low coupon, higher risk', v: { F: 1000, c: 2, m: 2, T: 10, rf: 3, p0: 1.5, p1: 2.5 } },
    { id: 'RP-07', title: 'Large annual bond', v: { F: 5000, c: 8, m: 1, T: 8, rf: 5, p0: 4, p1: 2 } },
    { id: 'RP-08', title: 'Short maturity, wider spread', v: { F: 1000, c: 5, m: 2, T: 1, rf: 4, p0: 1, p1: 3 } },
    { id: 'RP-09', title: 'Zero coupon and premium', v: { F: 1000, c: 0, m: 1, T: 5, rf: 3, p0: 2, p1: 1 } },
    { id: 'RP-10', title: 'Small spread increase', v: { F: 10000, c: 6.5, m: 2, T: 12, rf: 4, p0: 2.5, p1: 2.75 } },
  ],
  calc(v) {
    const n = needWhole(v.T * v.m);
    const y0 = pc(v.rf + v.p0), y1 = pc(v.rf + v.p1), C = (v.F * pc(v.c)) / v.m;
    const P0 = bondPV(v.F, C, y0 / v.m, n), P1 = bondPV(v.F, C, y1 / v.m, n);
    return { n, y0, y1, C, P0, P1, dP: P1 - P0, pct: P1 / P0 - 1, bp: (v.p1 - v.p0) * 100 };
  },
  out(v, o) {
    return [cell('Old required yield', o.y0, 'pct4', 'risk-free + premium'), cell('New required yield', o.y1, 'pct4'), cell('Coupon per period', o.C), cell('Number of coupons', o.n, 'int'), cell('Old price', o.P0), cell('New price', o.P1), cell('Dollar change', o.dP, 'moneyS'), cell('% change', o.pct, 'pctS'), cell('Premium change', o.bp, 'num2', 'basis points')];
  },
  charts: [{
    title: 'Required yield = risk-free rate + risk premium',
    legend: [['b', 'Risk-free rate'], ['s2', 'Risk premium']],
    draw(plot, fig, v, o) {
      drawHBars(plot, fig, {
        label: 'Required yield before and after the premium change', fmt: fmt.axisPct,
        rows: [
          { label: `Before: price ${M(o.P0)}`, value: fmt.pct(o.y0, 2), segs: [{ v: pc(v.rf), cls: 'b' }, { v: pc(v.p0), cls: 's2' }] },
          { label: `After: price ${M(o.P1)}`, value: fmt.pct(o.y1, 2), segs: [{ v: pc(v.rf), cls: 'b' }, { v: pc(v.p1), cls: 's2' }] },
        ],
      });
    },
  }],
  text(v, o) {
    if (v.p0 === v.p1) return `<p>The premium doesn’t change, so the required yield stays ${fmt.pct(o.y0, 2)} and the price stays ${M(o.P0)}.</p>`;
    return `<p>The coupon stays ${M(o.C)}; only the discount rate changes. Investors now want ${PT(pc(v.rf))} + ${PT(pc(v.p1))} = <b>${fmt.pct(o.y1, 2)}</b> instead of ${fmt.pct(o.y0, 2)}, a ${fmt.num(o.bp, 0)} basis-point move. The price goes from ${M(o.P0)} to <b>${M(o.P1)}</b> (${fmt.pctS(o.pct, 2)}).</p><p class="aside">${v.p1 > v.p0 ? 'A wider spread signals more credit risk, so the same promised payments are worth less.' : 'A narrower spread signals less credit risk, so the same promised payments are worth more.'}</p>`;
  },
  excel(v, o) {
    const p = (y) => `PV(${v.m > 1 ? `(${xp(pc(v.rf))}+${xp(pc(y))})/${v.m}` : `${xp(pc(v.rf))}+${xp(pc(y))}`}, ${o.n}, -${fmt.raw(o.C)}, -${v.F})`;
    return [['Old price', '=' + p(v.p0), M(o.P0)], ['New price', '=' + p(v.p1), M(o.P1)]];
  },
  ti(v, o) {
    return [
      { kind: 'tvm', title: 'Old price', N: o.n, I: 100 * o.y0, PV: 0, PMT: o.C, FV: v.F, PY: v.m, solve: 'PV', expect: -o.P0 },
      { kind: 'tvm', title: 'New price', N: o.n, I: 100 * o.y1, PV: 0, PMT: o.C, FV: v.F, PY: v.m, solve: 'PV', expect: -o.P1, note: 'Only I% changes.' },
    ];
  },
  watch: [
    '<b>The coupon never changes</b>; only the discount rate does.',
    '<b>1 percentage point = 100 basis points.</b> 2.00 to 4.00 percent is +200 bp.',
    '<b>Wider premium → higher yield → lower price</b>, for the same promised cash flows.',
  ],
  verify: {
    '1. Old required annual yield': (o) => o.y0, '2. New required annual yield': (o) => o.y1, '3. Coupon per period': (o) => o.C, '4. Remaining coupon count': (o) => o.n,
    '5. Old fair price': (o) => o.P0, '6. New fair price': (o) => o.P1, '7. Dollar price change': (o) => o.dP, '8. Percentage price change': (o) => o.pct, '9. Risk-premium change (basis points)': (o) => o.bp,
  },
});

/* ================================================================ 23 Quotes and current yield */
topic({
  id: '23',
  name: 'Quotes and Current Yield',
  idea: 'A quote is the price as a <b>percent of face</b>. Current yield is <b>annual coupon ÷ price</b>. For a premium bond, coupon rate > current yield > YTM; for a discount bond the order flips.',
  modes: [{ k: 'price', label: 'Price from the YTM' }, { k: 'ytm', label: 'YTM from a quote' }, { k: 'cpn', label: 'Coupon from price and YTM' }],
  inputs: [
    { k: 'F', label: 'Face value', kind: 'money', def: 1000, min: 1, max: 1e10 },
    { k: 'c', label: 'Coupon rate', kind: 'pct', def: 6, min: 0, max: 100, slider: [0, 12, 0.05], modes: ['price', 'ytm'] },
    { k: 'y', label: 'Yield to maturity', kind: 'pct', def: 5, min: 0, max: 100, slider: [0, 12, 0.05], modes: ['price', 'cpn'] },
    { k: 'q', label: 'Quoted price (% of par)', kind: 'pct', def: 97, min: 0.01, max: 1000, modes: ['ytm'] },
    { k: 'P', label: 'Price in dollars', kind: 'money', def: 962, min: 0.01, max: 1e10, modes: ['cpn'] },
    { k: 'm', label: 'Coupons per year', kind: 'sel', def: 2, options: FREQ },
    { k: 'T', label: 'Years to maturity', kind: 'num', def: 8, min: 0.25, max: 100 },
    { k: 'since', label: 'Years since issue', kind: 'num', def: 0, min: 0, max: 100, modes: ['price'], opt: true },
  ],
  examples: [
    { id: 'BQ-01', title: 'Premium semiannual bond', mode: 'price', v: { F: 1000, c: 6, y: 5, m: 2, T: 8, since: 0 } },
    { id: 'BQ-02', title: 'Discount bond', mode: 'price', v: { F: 1000, c: 4.5, y: 6.2, m: 2, T: 12, since: 0 } },
    { id: 'BQ-03', title: 'Annual-pay euro bond', mode: 'price', v: { F: 1000, c: 3.6, y: 3.2, m: 1, T: 27, since: 0 } },
    { id: 'BQ-04', title: 'Yield from a yen price', mode: 'ytm', v: { F: 100000, c: 3.4, q: 96.318, m: 1, T: 16 }, derived: ['q'] },
    { id: 'BQ-05', title: 'Coupon from price and yield', mode: 'cpn', v: { F: 1000, P: 962, y: 5.1, m: 1, T: 8 } },
    { id: 'BQ-06', title: 'Bond issued one year ago', mode: 'price', v: { F: 1000, c: 5.4, y: 4.5, m: 2, T: 15, since: 1 } },
    { id: 'BQ-07', title: 'Yield from a % of par quote', mode: 'ytm', v: { F: 1000, c: 5.6, q: 97, m: 2, T: 23 } },
    { id: 'BQ-08', title: 'Coupon, half-year maturity', mode: 'cpn', v: { F: 1000, P: 987, y: 5.3, m: 2, T: 14.5 } },
  ],
  calc(v, mode) {
    const T = mode === 'price' ? v.T - v.since : v.T;
    need(T > 0, 'Years since issue must be less than the original maturity.');
    const n = needWhole(T * v.m);
    const o = { n, T };
    if (mode === 'price') { o.C = (v.F * pc(v.c)) / v.m; o.r = pc(v.y) / v.m; o.P = bondPV(v.F, o.C, o.r, n); o.ytm = pc(v.y); o.cRate = pc(v.c); }
    else if (mode === 'ytm') { o.C = (v.F * pc(v.c)) / v.m; o.P = pc(v.q) * v.F; o.r = F.rate(n, o.C, -o.P, v.F); o.ytm = o.r * v.m; o.cRate = pc(v.c); }
    else { o.r = pc(v.y) / v.m; o.P = v.P; o.pvF = v.F * Math.pow(1 + o.r, -n); o.C = (v.P - o.pvF) / F.a(o.r, n); o.cRate = (o.C * v.m) / v.F; o.ytm = pc(v.y); }
    o.quote = o.P / v.F; o.cy = (o.C * v.m) / o.P; o.eay = Math.pow(1 + o.r, v.m) - 1; o.cls = priceClass(o.P, v.F);
    return o;
  },
  out(v, o, mode) {
    const c = [];
    if (mode === 'price' && v.since) c.push(cell('Years remaining', o.T, 'num2'));
    if (mode === 'cpn') c.push(cell('Yield per period', o.r, 'pct4'), cell('Number of coupons', o.n, 'int'), cell('PV of face value', o.pvF), cell('Coupon per period', o.C), cell('Coupon rate', o.cRate, 'pct4'));
    else {
      c.push(cell('Coupon per period', o.C));
      if (mode === 'price') c.push(cell('Yield per period', o.r, 'pct4'), cell('Number of coupons', o.n, 'int'), cell('Price', o.P), cell('Quote (% of par)', o.quote, 'pct4'));
      else c.push(cell('Price in dollars', o.P), cell('Number of coupons', o.n, 'int'), cell('Yield per period', o.r, 'pct4'), cell('YTM (annual)', o.ytm, 'pct4'), cell('Effective annual yield', o.eay, 'pct4'));
    }
    c.push(cell('Current yield', o.cy, 'pct4', 'annual coupon ÷ price'), clsCell(o.cls));
    return c;
  },
  charts: [{
    title: 'Coupon rate, current yield and YTM side by side',
    draw(plot, fig, v, o) {
      drawHBars(plot, fig, {

unit('Rates over time');
const YR = ['', 'one', 'two', 'three'];
const YRc = (n) => (YR[n] ? YR[n][0].toUpperCase() + YR[n].slice(1) : String(n));
topic({
  id: '24',
  name: 'Term Structure',
  idea: 'Each maturity has its own <b>spot rate</b>. Under the expectations idea, investing for n years at one spot rate equals rolling one-year rates: (1 + s<sub>n</sub>)<sup>n</sup> = (1 + r<sub>1</sub>)(1 + r<sub>2</sub>)…',
  modes: [{ k: 'exp', label: 'Spot from expected rates' }, { k: 'fwd', label: 'Forward from spot rates' }, { k: 'zero', label: 'Spot from zero prices' }, { k: 'bond', label: 'Price a bond with spot rates' }],

    { k: 'P2', label: 'Two-year zero price', kind: 'money', def: 925, min: 0.01, max: 1e10, modes: ['zero'] },
    { k: 'c', label: 'Coupon rate (annual)', kind: 'pct', def: 5, min: 0, max: 100, modes: ['bond'] },
    { k: 's1', label: 'One-year spot rate', kind: 'pct', def: 2, min: -50, max: 100, slider: [0, 10, 0.05], modes: ['bond'] },
    { k: 's2', label: 'Two-year spot rate', kind: 'pct', def: 3, min: -50, max: 100, slider: [0, 10, 0.05], modes: ['bond'] },
    { k: 's3', label: 'Three-year spot rate', kind: 'pct', def: 4, min: -50, max: 100, slider: [0, 10, 0.05], modes: ['bond'] },
  ],
  examples: [
    { id: 'TS-01', title: 'Two-year spot', mode: 'exp', v: { F: 1000, N: 2, r1: 2, r2: 3, tpm: 0 } },
    { id: 'TS-02', title: 'Three-year spot', mode: 'exp', v: { F: 1000, N: 3, r1: 1, r2: 4, r3: 5, tpm: 0 } },
    { id: 'TS-03', title: 'Steeper expected path', mode: 'exp', v: { F: 1000, N: 2, r1: 3, r2: 6, tpm: 0 } },
    { id: 'TS-04', title: 'Forward rate for year 2', mode: 'fwd', v: { F: 1000, a: 1, sa: 3, b: 2, sb: 4.2 }, opt: ['a', 'b'] },
    { id: 'TS-05', title: 'Forward rate for year 3', mode: 'fwd', v: { F: 1000, a: 2, sa: 4.5, b: 3, sb: 5.1 }, opt: ['a', 'b'] },
    { id: 'TS-06', title: 'Spot plus a term premium', mode: 'exp', v: { F: 1000, N: 2, r1: 2, r2: 3.5, tpm: 1, tp: 0.4 }, opt: ['tpm'] },
    { id: 'TS-07', title: 'Implied term premium', mode: 'exp', v: { F: 1000, N: 3, r1: 3, r2: 4, r3: 5, tpm: 2, obs: 4.7 }, opt: ['tpm'] },
    { id: 'TS-08', title: 'Spot rates from zero prices', mode: 'zero', v: { F: 1000, P1: 970, P2: 925 } },
    { id: 'TS-09', title: 'Coupon bond with spot rates', mode: 'bond', v: { F: 1000, c: 5, s1: 2, s2: 3, s3: 4 } },
    { id: 'TS-10', title: 'Average forward, years 2–3', mode: 'fwd', v: { F: 1000, a: 1, sa: 2.5, b: 3, sb: 4.4 }, opt: ['a', 'b'] },
  ],
  calc(v, mode) {
    const o = { acc: {} };
    if (mode === 'exp') {
      const one = [pc(v.r1), pc(v.r2), pc(v.r3)].slice(0, v.N);
      let acc = 1;
      o.one = one; o.spots = [];
      one.forEach((r, i) => { acc *= 1 + r; o.acc[i + 1] = acc; o.spots.push(Math.pow(acc, 1 / (i + 1)) - 1); });
      o.spotExp = o.spots[v.N - 1];
      o.simple = one.reduce((s, r) => s + r, 0) / v.N;
      if (v.tpm === 1) { o.tp = pc(v.tp); o.spotObs = o.spotExp + o.tp; }
      else if (v.tpm === 2) { o.spotObs = pc(v.obs); o.tp = o.spotObs - o.spotExp; }
      else { o.tp = 0; o.spotObs = o.spotExp; }
      o.price = v.F / Math.pow(1 + o.spotObs, v.N);
      return o;
    }
    if (mode === 'fwd') {
      need(v.b > v.a, 'The longer maturity must be longer than the shorter one.');
      const Aa = Math.pow(1 + pc(v.sa), v.a), Ab = Math.pow(1 + pc(v.sb), v.b);
      o.acc[v.a] = Aa; o.acc[v.b] = Ab;
      o.fAcc = Ab / Aa; o.fwd = Math.pow(o.fAcc, 1 / (v.b - v.a)) - 1;
      o.price = v.F / Ab; o.price2 = v.F / (Aa * o.fAcc);
      return o;
    }
    if (mode === 'zero') {
      o.s1 = v.F / v.P1 - 1; o.s2 = Math.sqrt(v.F / v.P2) - 1; o.fwd = v.P1 / v.P2 - 1; o.df2 = v.P2 / v.F;
      return o;
    }
    const C = v.F * pc(v.c), s = [pc(v.s1), pc(v.s2), pc(v.s3)];
    o.C = C; o.pvs = s.map((r, i) => C / Math.pow(1 + r, i + 1));
    o.pvC = o.pvs.reduce((a, b) => a + b, 0); o.pvF = v.F / Math.pow(1 + s[2], 3); o.price = o.pvC + o.pvF;
    o.ytm = F.rate(3, C, -o.price, v.F); o.s = s;
    return o;
  },
  out(v, o, mode) {
    if (mode === 'exp') {
      const c = [cell(`${YR[v.N][0].toUpperCase() + YR[v.N].slice(1)}-year growth factor`, o.acc[v.N], 'num6', 'product of (1 + each rate)'), cell(`${YR[v.N][0].toUpperCase() + YR[v.N].slice(1)}-year spot rate`, o.spotExp, 'pct4', 'geometric average'), cell('Simple average (compare)', o.simple, 'pct4')];
      if (v.tpm) c.push(cell('Term premium', o.tp, 'pct4'), cell('Observed spot rate', o.spotObs, 'pct4'));
      c.push(cell(`Price of a ${YR[v.N]}-year zero`, o.price));
      return c;
    }
    if (mode === 'fwd') return [cell(`${YRc(v.a)}-year growth factor`, o.acc[v.a], 'num6'), cell(`${YRc(v.b)}-year growth factor`, o.acc[v.b], 'num6'), cell(v.b - v.a > 1 ? `Forward growth, years ${v.a + 1}–${v.b}` : 'Forward growth factor', o.fAcc, 'num6'), cell(v.b - v.a > 1 ? `Average forward rate, years ${v.a + 1}–${v.b}` : `Forward rate for year ${v.b}`, o.fwd, 'pct4'), cell(`Price of a ${YR[v.b]}-year zero`, o.price), cell('Same price via the forward', o.price2)];
    if (mode === 'zero') return [cell('One-year spot rate', o.s1, 'pct4'), cell('Two-year spot rate', o.s2, 'pct4'), cell('Forward rate for year 2', o.fwd, 'pct4', 'P1 ÷ P2 − 1'), cell('Two-year discount factor', o.df2, 'num6')];
    return [cell('Coupon each year', o.C), cell('PV of year-1 coupon', o.pvs[0]), cell('PV of year-2 coupon', o.pvs[1]), cell('PV of year-3 coupon', o.pvs[2]), cell('PV of all coupons', o.pvC), cell('PV of face value', o.pvF), cell('Price', o.price), cell('Yield to maturity', o.ytm, 'pct4', 'one blended rate')];
  },
  charts: [{
    title: (v, o, mode) => (mode === 'bond' ? 'Each cash flow uses its own spot rate' : 'One-year rates and spot rates by maturity'),
    legend: (v, o, mode) => (mode === 'bond' ? [['s1', 'Spot rate', 'line'], ['s2', 'Yield to maturity', 'line']] : [['s2', mode === 'exp' ? 'Expected one-year rate in that year' : 'One-year (forward) rate in that year', 'line'], ['s1', 'Spot rate to that maturity', 'line']]),

    else { o.i = pc(v.i); o.r = pc(v.rr); o.pi = (1 + o.i) / (1 + o.r) - 1; o.approx = o.i - o.r; o.err = o.approx - o.pi; }

  modes: [{ k: 'exact', label: 'Exact: (1 + r)(1 + π) − 1' }, { k: 'short', label: 'Shortcut: r + π' }],
  modeLabel: 'One-year yields',
  inputs: [

    { k: 'p3', label: 'Expected inflation, year 3', kind: 'pct', def: 2, min: -50, max: 200, slider: [-2, 12, 0.05], showIf: (v) => v.N === 3 },
    { k: 'N', label: 'Longest bond', kind: 'sel', def: 2, options: [[2, '2 years'], [3, '3 years']] },

  ],
  examples: [
    { id: 'Slide', title: 'A comprehensive example', mode: 'exact', v: { r: 3, p1: 3, p2: 6, N: 2, F: 1000, obs: 0 }, check: { 'R.0': 0.0609, 'R.1': 0.0918, spotN: 0.07623910912027343, 'path.0': 863.3411880690185 } },
    { id: 'Slide', title: 'Another example', mode: 'exact', v: { r: 2, p1: 3, p2: 2, p3: 2, N: 3, F: 1000, obs: 0 }, check: { 'R.0': 0.0506, 'R.1': 0.0404, 'R.2': 0.0404, 'zero1.0': 951.8370454978108, 'zero1.1': 961.1687812379854, 'path.0': 879.3503008057436, 'path.1': 923.8454260265142, 'path.2': 961.1687812379854, spotN: 0.043788949014202716 } },
    { id: 'Notes', title: 'Term premium at $808.76', mode: 'short', v: { r: 2, p1: 3, p2: 2, p3: 2, N: 3, F: 1000, obs: 808.76 }, check: { 'path.0': 880.5297266835728, obsSpot: 0.07331396192317507, tp: 0.029991255642435988 } },
    { id: 'Practice', title: 'Inflation rising', mode: 'exact', v: { r: 2, p1: 2, p2: 3, p3: 4, N: 3, F: 1000, obs: 0 }, check: { 'R.2': 0.060799999999999965, spotN: 0.050566989254047234, 'path.0': 862.4397180979408 } },
    { id: 'Practice', title: 'Inflation falling', mode: 'exact', v: { r: 1.5, p1: 6, p2: 4, p3: 2, N: 3, F: 1000, obs: 0 }, check: { 'R.0': 0.07589999999999986, spotN: 0.05546985575012964, 'path.0': 850.4768506333997 } },
  ],
  calc(v, mode) {
    const r = pc(v.r);
    const pis = [pc(v.p1), pc(v.p2), pc(v.p3)].slice(0, v.N);
    const ex = pis.map((p) => (1 + r) * (1 + p) - 1), sh = pis.map((p) => r + p);
    const R = mode === 'exact' ? ex : sh;
    need(R.every((x) => x > -1), 'Yields must stay above −100%.');
    const acc = [];
    let a = 1;
    R.forEach((x) => { a *= 1 + x; acc.push(a); });
    const spots = acc.map((A, i) => Math.pow(A, 1 / (i + 1)) - 1);
    const path = [];
    for (let t = 0; t <= v.N; t++) { let d = 1; for (let k = t; k < v.N; k++) d *= 1 + R[k]; path.push(v.F / d); }
    const spotN = spots[v.N - 1];
    const o = { r, pis, ex, sh, R, acc, spots, path, spotN, zero1: R.map((x) => v.F / (1 + x)), simple: R.reduce((s, x) => s + x, 0) / v.N };
    o.be = mode === 'exact' ? (1 + spotN) / (1 + r) - 1 : spotN - r;
    if (v.obs > 0) { o.obsSpot = Math.pow(v.F / v.obs, 1 / v.N) - 1; o.tp = o.obsSpot - spotN; o.gap = path[0] - v.obs; }

          yFmt: fmt.axisPct, xLabel: (d) => `Year ${d.x}`,
        });
      },
    },
    {
      title: (v) => `The ${v.N}-year zero’s price climbs to face`,
      legend: (v) => (v.obs > 0 ? [['s1', 'Expectations price', 'line'], ['s2', 'Market price today', 'line']] : null),
      draw(plot, fig, v, o) {
        const xs = o.path.map((_, t) => t);
        const pts = o.path.map((p, t) => ({ x: t, y: p, cls: 's1', label: M(p), anchor: t === 0 ? 'start' : t === v.N ? 'end' : 'middle', pos: 'above' }));
        if (v.obs > 0) pts.push({ x: 0, y: v.obs, cls: 's2', label: `Market ${M(v.obs)}`, anchor: 'start', pos: 'below' });
        drawLine(plot, fig, {

          xTicks: xs, xFmt: (t) => (t === 0 ? 'Start of yr 1' : t === v.N ? `End of yr ${v.N}` : `Start of yr ${t + 1}`),
          yDomain: [Math.min(...o.path, v.obs > 0 ? v.obs : Infinity) * 0.97, v.F * 1.03],
          tip: (t) => `<b>${t === v.N ? 'Maturity' : `Start of year ${t + 1}`}</b><br>Price <span class="num">${M(o.path[t])}</span>${t < v.N ? `<br>${v.N - t} year${v.N - t > 1 ? 's' : ''} left` : ''}`,
        });
      },

  text(v, o, mode) {

    const one = (i) => (ex ? `(1 + ${PT(o.r)})(1 + ${PT(o.pis[i])}) − 1` : `${PT(o.r)} + ${PT(o.pis[i])}`);
    const other = ex ? o.sh : o.ex;

unit('Stocks');
const SK = [1, 2, 3, 4, 5, 6];
const sumOf = (a) => a.reduce((s, x) => s + x, 0);
const MD = fmt.moneyD;
const SPLIT_LEGEND = [['s2', 'Dividend yield'], ['s3', 'Growth (capital-gains yield)']];

// waterfall: each part starts where the last one ended, then a total bar
function waterfall(plot, fig, { label, parts, total, money }) {
  const f = money ? M : fmt.pt;
  let acc = 0;
  const ends = [0];
  const rows = parts.map((p, i) => {
    const row = { label: (i ? '+ ' : '') + p.label, value: f(p.v), segs: i ? [{ v: acc, cls: 'none' }, { v: p.v, cls: p.cls }] : [{ v: p.v, cls: p.cls }] };
    acc += p.v;
    ends.push(acc);
    return row;
  });
  rows.push({ label: '= ' + total.label, value: f(total.v), segs: [{ v: total.v, cls: 'strong' }] });
  ends.push(total.v);
  const lo = Math.min(...ends), hi = Math.max(...ends);
  const pad = (hi - lo) * 0.04 || 0.01;
  drawHBars(plot, fig, { label, rows, fmt: money ? fmt.axis : fmt.axisPct, domain: [lo < 0 ? lo - pad : 0, hi > 0 ? hi + pad : 0] });
}
// r = dividend yield + g, with the piece you solved for marked
function splitChart(plot, fig, dy, g, r, found) {
  const tag = (k) => (found === k ? ' (found)' : '');
  waterfall(plot, fig, {
    label: 'Required return split into dividend yield and growth',
    parts: [{ label: 'Dividend yield D1 ÷ P0' + tag('dy'), v: dy, cls: 's2' }, { label: 'Growth g' + tag('g'), v: g, cls: 's3' }],
    total: { label: 'Required return r' + tag('r'), v: r },
  });
}
// cumulative PV of a growing dividend stream, levelling off at the price
function cumChart(plot, fig, D1, r, g, P0) {
  const K = Math.min(400, Math.max(30, Math.ceil(Math.log(0.01) / Math.log((1 + g) / (1 + r)))));
  const cum = [];
  let s = 0;
  for (let k = 1; k <= K; k++) { s += (D1 * Math.pow(1 + g, k - 1)) / Math.pow(1 + r, k); cum.push(s); }
  const xs = cum.map((_, i) => i + 1);
  const xTicks = niceScale(0, K, Math.max(3, Math.floor((plot.clientWidth - 72) / 55))).ticks.filter((t) => t >= 1 && t <= K);
  drawLine(plot, fig, {
    label: 'Value today of the first k dividends, approaching the stock price', xs, zero: true, xTicks,
    series: [{ ys: cum, cls: 's1' }],
    hrefs: [{ y: P0, label: `Every dividend forever: ${M(P0)}` }],
    xFmt: (x) => String(Math.round(x)),
    tip: (i) => `<b>First ${i + 1} dividend${i ? 's' : ''}</b><br>Worth <span class="num">${M(cum[i])}</span> today<br>${PCT(cum[i] / P0, 1)} of the price`,
  });
}
// P = D1 / (r - g) as r (or g) varies, with the solved points marked
function gordonCurve(plot, fig, { D1, vary, r, g, pts }) {
  const ok = pts.filter((p) => Number.isFinite(p.y) && p.y > 0 && Number.isFinite(p.x));
  if (!ok.length || !(D1 > 0)) { plot.replaceChildren(); return; }
  const px = ok.map((p) => p.x);
  const yMax = Math.max(...ok.map((p) => p.y)) * 1.6;
  let x0, x1;
  if (vary === 'r') { x0 = Math.max(g + D1 / yMax, Math.min(...px) - 0.03); x1 = Math.max(...px) + 0.03; }
  else { x0 = Math.min(...px) - 0.03; x1 = Math.min(r - D1 / yMax, Math.max(...px) + 0.03); }
  const xs = [], ys = [];
  for (let i = 0; i <= 80; i++) { const x = x0 + ((x1 - x0) * i) / 80; xs.push(x); ys.push(vary === 'r' ? D1 / (x - g) : D1 / (r - x)); }
  // labels go where the curve isn't: falling curve → left point below-left, right point above-right
  const up = vary === 'g';
  const sorted = [...ok].sort((a, b) => a.x - b.x);
  const points = sorted.map((p, i) => {
    const left = sorted.length > 1 && i === 0;
    const place2 = sorted.length === 1 ? { anchor: up ? 'end' : 'start', pos: 'above' } : up ? (left ? { anchor: 'end', pos: 'above' } : { anchor: 'start', pos: 'below' }) : (left ? { anchor: 'end', pos: 'below' } : { anchor: 'start', pos: 'above' });
    return { x: p.x, y: p.y, cls: p.cls || 'ink', label: p.label, ...place2 };
  });
  drawLine(plot, fig, {
    label: `Stock price as the ${vary === 'r' ? 'required return' : 'growth rate'} changes`, xs, series: [{ ys, cls: 's1' }], points,
    yDomain: [0, yMax], xFmt: fmt.axisPct, yFmt: fmt.axis,
    tip: (i) => `<b>${vary === 'r' ? 'Required return' : 'Growth'} ${fmt.pct(xs[i], 2)}</b><br>Price <span class="num">${M(ys[i])}</span>`,
  });
}
// dividend yield + growth for each case, side by side
function casesChart(plot, fig, cases) {
  const rows = cases.map((c) => ({ label: c.label, value: `${fmt.pct(c.dy, 2)} + ${fmt.pct(c.g, 2)} = ${fmt.pct(c.dy + c.g, 2)}`, segs: [{ v: c.dy, cls: 's2' }, { v: c.g, cls: 's3' }] }));
  const ends = cases.flatMap((c) => [0, c.dy, c.dy + c.g]);
  const lo = Math.min(...ends), hi = Math.max(...ends), pad = (hi - lo) * 0.04 || 0.01;
  drawHBars(plot, fig, { label: 'Dividend yield plus growth in each case', rows, fmt: fmt.axisPct, domain: [lo < 0 ? lo - pad : 0, hi + pad] });
}

/* two-case comparisons, shared by tabs 27 and 28 */
function cmpCalc(v) {
  need(v.D1 > 0, 'Enter a next dividend above zero.');
  const byG = v.chg === 1;
  const cs = byG ? [[pc(v.r), pc(v.g1)], [pc(v.r), pc(v.g2)]] : [[pc(v.r1), pc(v.g)], [pc(v.r2), pc(v.g)]];
  need(cs.every(([r, g]) => r > g), 'Each case needs r > g, or the price is infinite.');
  const [V1, V2] = cs.map(([r, g]) => v.D1 / (r - g));
  return { D1: v.D1, byG, cs, V1, V2, dV: V2 - V1, pV: V2 / V1 - 1, dy1: v.D1 / V1, dy2: v.D1 / V2 };
}
const cmpLab = (o, i) => (o.byG ? `g = ${PT(o.cs[i][1])}` : `r = ${PT(o.cs[i][0])}`);
function cmpCells(o) {

}
function cmpText(o) {

  const one = (r, g, V) => `${MD(o.D1)} ÷ (${PT(r)} − ${PT(g)}) = <b>${M(V)}</b>`;
  let t = `<p><b>Case 1:</b> ${one(r1, g1, o.V1)}. <b>Case 2:</b> ${one(r2, g2, o.V2)}.</p>`;
  const move = o.byG ? (o.dV >= 0 ? `Faster growth adds ${M(o.dV)} of value` : `Slower growth costs ${M(-o.dV)} of value`) : `The price ${o.dV < 0 ? 'falls' : 'rises'} ${M(Math.abs(o.dV))}`;
  t += `<p>${move}, or ${fmt.pctS(o.pV, 2)}. Only the spread r − g changed, from ${PT(r1 - g1)} to ${PT(r2 - g2)}, and the price moves in inverse proportion: ${PT(r1 - g1)} ÷ ${PT(r2 - g2)} − 1 = ${fmt.pctS(o.pV, 2)}.</p>`;
  if (o.byG) t += `<p class="aside">The required return is ${PT(r1)} in both cases. With ${g2 > g1 ? 'faster' : 'slower'} growth, ${g2 > g1 ? 'more' : 'less'} of that return comes from the price rising, so investors accept a ${g2 > g1 ? 'lower' : 'higher'} dividend yield: ${PT(o.dy1)} → ${PT(o.dy2)}.${g1 === 0 ? ' With zero growth, case 1 is a plain perpetuity, D1 ÷ r.' : ''}</p>`;

}
function cmpExcel(o) {

function cmpTI(o) {

}
function cmpCurve(plot, fig, o) {

}

topic({

  modes: [{ k: 'price', label: 'Price today' }, { k: 'ret', label: 'Return' }, { k: 'sale', label: 'Sale price' }, { k: 'div', label: 'Dividend' }, { k: 'multi', label: 'Price over several years' }, { k: 'ex', label: 'Ex-dividend drop' }],

  calc(v, mode) {

      const cum = v.Pex + v.Dx;

    { k: 'D1', label: 'Next dividend (D1)', kind: 'money', def: 2.4, min: 0, max: 1e6, slider: [0, 10, 0.01], modes: ['r', 'g', 'cmp', 'buy'], showIf: (v, mode) => mode !== 'r' || v.dt === 1 },

  ],
  calc(v, mode) {
    if (mode === 'cmp') return cmpCalc(v);
    const g = pc(v.g), r = pc(v.r);
    if (mode === 'r') {
      const D1 = v.dt === 0 ? v.D0 * (1 + g) : v.D1;

        if (mode === 'g') return gordonCurve(plot, fig, { D1: o.D1, vary: 'g', r: o.r, pts: [{ x: o.g, y: o.P0, label: `g = ${fmt.pct(o.g, 2)}: ${M(o.P0)}` }] });
        return gordonCurve(plot, fig, { D1: o.D1, vary: 'r', g: o.g, pts: [{ x: o.r, y: o.P0, label: `r = ${fmt.pct(o.r, 2)}: ${M(o.P0)}` }] });

  text(v, o, mode) {

      const s = v.dt === 0 ? 2 : 1;

      return t + `<p class="aside">Check: ${MD(o.D1)} ÷ (${PT(o.r)} − ${PT(o.g)}) = ${M(o.chk)}, the price. Next year’s price: ${M(o.P0)} × ${fmt.num(1 + o.g, 4)} = ${M(o.P1)}.</p>`;

    const verdictText = o.dec < 0 ? `That’s below your ${PT(o.r)}, so pass.` : o.dec > 0 ? `That beats your ${PT(o.r)}, so buy.` : `That equals your ${PT(o.r)}: the stock is fairly priced.`;

      lines.push([`Ans+${tdp(o.g)}`, o.r], [`${tn(v.P)}*${td(1 + o.g)}`, o.P1]);

  },
  watch: [

    '<b>Use D1 in every formula.</b> A dividend “just paid” is D0: multiply by (1 + g) first.',

/* ================================================================ 29 Two-Stage Dividends */
topic({
  id: '29',
  name: 'Two-Stage Dividends',
  idea: 'Fast growth can’t last forever. Value the fast-growth years one dividend at a time, then treat everything after year N as a constant-growth stock: <b>P<sub>N</sub> = D<sub>N+1</sub> ÷ (r − g<sub>2</sub>)</b>. Price today = PV of the early dividends + PV of P<sub>N</sub>.',
  modes: [{ k: 'grow', label: 'Growth rates' }, { k: 'list', label: 'Listed dividends' }],
  modeLabel: 'Dividends given as',
  inputs: [
    { k: 'D0', label: 'Dividend just paid (D0)', kind: 'money', def: 2, min: 0, max: 1e6, slider: [0, 10, 0.01], modes: ['grow'] },
    { k: 'g1', label: 'Fast growth rate, stage 1 (g1)', kind: 'pct', def: 20, min: -50, max: 500, slider: [0, 40, 0.5], modes: ['grow'] },
    { k: 'N', label: 'Years of fast growth (N)', kind: 'int', def: 5, min: 1, max: 30, slider: [1, 15, 1], modes: ['grow'] },
    { k: 'NL', label: 'Last listed year (N)', kind: 'sel', def: 5, options: SK.map((k) => [k, k === 1 ? '1 year' : `${k} years`]), modes: ['list'] },
    ...SK.map((k) => ({ k: 'd' + k, label: `Dividend, year ${k}`, kind: 'money', def: [2.4, 2.88, 3.456, 4.1472, 4.97664, 5.97][k - 1], min: 0, max: 1e6, modes: ['list'], showIf: (v) => v.NL >= k })),
    { k: 'g2', label: 'Stable growth after year N (g2)', kind: 'pct', def: 4, min: -50, max: 100, slider: [0, 8, 0.05] },
    { k: 'r', label: 'Required return (r)', kind: 'pct', def: 10, min: -50, max: 500, slider: [0, 20, 0.05] },
  ],
  examples: [
    { id: 'TD-01', title: 'Class two-stage stock', mode: 'grow', v: { D0: 2, g1: 20, N: 5, g2: 4, r: 10 } },
    { id: 'TD-02', title: 'Four years of high growth', mode: 'grow', v: { D0: 1.5, g1: 12, N: 4, g2: 4, r: 9 } },
    { id: 'TD-03', title: 'Three years of rapid growth', mode: 'grow', v: { D0: 3, g1: 15, N: 3, g2: 5, r: 11 } },
    { id: 'TD-04', title: 'Five years at 25% growth', mode: 'grow', v: { D0: 0.8, g1: 25, N: 5, g2: 6, r: 13 } },
    { id: 'TD-05', title: 'Six years of moderate growth', mode: 'grow', v: { D0: 2.2, g1: 8, N: 6, g2: 3, r: 9 } },
    { id: 'TD-06', title: 'Level dividends, then growth', mode: 'grow', v: { D0: 4, g1: 0, N: 3, g2: 2, r: 7 } },
    { id: 'TD-07', title: 'Four years at 30% growth', mode: 'grow', v: { D0: 1.2, g1: 30, N: 4, g2: 5, r: 12 } },
    { id: 'TD-08', title: 'Two-year transition', mode: 'grow', v: { D0: 2.5, g1: 18, N: 2, g2: 4, r: 10 } },
    { id: 'TD-09', title: 'Five-year transition value', mode: 'grow', v: { D0: 1.75, g1: 10, N: 5, g2: 3.5, r: 9.5 } },
    { id: 'TD-10', title: 'Explicit dividends', mode: 'list', v: { NL: 5, d1: 2.4, d2: 2.88, d3: 3.456, d4: 4.1472, d5: 4.97664, g2: 4, r: 10 } },
  ],
  calc(v, mode) {
    const r = pc(v.r), g2 = pc(v.g2);
    need(r > g2, 'Needs r > g2. After year N the stock is a constant-growth stock, which only has a value when r is above g2.');
    let N, ds, g1 = null;
    if (mode === 'list') { N = v.NL; ds = SK.slice(0, N).map((k) => v['d' + k]); }
    else {
      need(Number.isInteger(v.N) && v.N >= 1, 'Years of fast growth must be a whole number, at least 1.');
      N = v.N; g1 = pc(v.g1);
      ds = Array.from({ length: N }, (_, i) => v.D0 * Math.pow(1 + g1, i + 1));
    }
    const DN = ds[N - 1], DN1 = DN * (1 + g2), PN = DN1 / (r - g2);
    const pvD = ds.map((d, i) => d / Math.pow(1 + r, i + 1));
    const pvDiv = sumOf(pvD), pvTV = PN / Math.pow(1 + r, N), P0 = pvDiv + pvTV;
    need(P0 > 0, 'Enter dividends above zero.');
    return { r, g1, g2, N, ds, pvD, D1: ds[0], DN, DN1, PN, pvDiv, pvTV, P0, share: pvTV / P0 };
  },
  out(v, o, mode) {
    const N = o.N, c = [];
    if (mode === 'grow') c.push(cell('First dividend D1', o.D1, 'moneyD', 'D0 × (1 + g1)'), cell(`Last fast-growth dividend D${N}`, o.DN, 'moneyD', `D0 × (1 + g1)^${N}`));
    c.push(
      cell(`First stable dividend D${N + 1}`, o.DN1, 'moneyD', `D${N} × (1 + g2)`), cell(`Terminal price P${N}`, o.PN, 'money', `D${N + 1} ÷ (r − g2)`),
      cell(N === 1 ? 'PV of the year-1 dividend' : `PV of dividends, years 1–${N}`, o.pvDiv), cell('PV of the terminal price', o.pvTV, 'money', `P${N} ÷ (1 + r)^${N}`),
      cell('Price today', o.P0, 'money', `PV of dividends + PV of P${N}`), cell('Terminal value share', o.share, 'pct2', 'of the price today'),
    );
    return c;
  },
  charts: [
    {
      title: 'Dividends each year (light) and their value today (dark)',
      legend: [['s1', 'Fast-growth years'], ['s3', 'Stable-growth years']],
      draw(plot, fig, v, o) {

        }
        drawBars(plot, fig, { label: 'Dividends by year with their present values', data, xLabel: (d) => String(d.x), markers: [{ i: o.N - 0.5, label: `Growth slows after year ${o.N}` }] });
      },
    },

          parts: [{ label: o.N === 1 ? 'PV of the year-1 dividend' : `PV of dividends, years 1–${o.N}`, v: o.pvDiv, cls: 's1' }, { label: `PV of the terminal price P${o.N}`, v: o.pvTV, cls: 's3' }],
          total: { label: 'Price today', v: o.P0 },
        });

  ],
  text(v, o, mode) {
    const N = o.N, f = fmt.num(1 + o.r, 4);
    const rows = o.ds.map((d, i) => `<tr><td>${i + 1}</td><td>D${i + 1} ${MD(d)}</td><td>${fmt.num(Math.pow(1 + o.r, i + 1), 4)}</td><td>${M(o.pvD[i])}</td></tr>`).join('');
    const table = `<div class="table-wrap"><table class="yt fit"><thead><tr><th>Year t</th><th>Cash flow</th><th>Divide by (1 + r)<sup>t</sup></th><th>Worth today</th></tr></thead><tbody>${rows}<tr><td>${N}</td><td>P${N} ${M(o.PN)}</td><td>${fmt.num(Math.pow(1 + o.r, N), 4)}</td><td>${M(o.pvTV)}</td></tr><tr><td colspan="3">Price today</td><td>${M(o.P0)}</td></tr></tbody></table></div>`;
    let t = mode === 'grow'
      ? `<p><b>Step 1, the fast-growth dividends:</b> grow the ${MD(v.D0)} just paid by ${PT(o.g1)} a year: D1 = ${MD(v.D0)} × ${fmt.num(1 + o.g1, 4)} = ${MD(o.D1)}${N > 1 ? `, up to D${N} = ${MD(v.D0)} × ${fmt.num(1 + o.g1, 4)}<sup>${N}</sup> = ${MD(o.DN)}` : ''}. Discount each by its own year (table below): together they’re worth <b>${M(o.pvDiv)}</b> today.</p>`
      : `<p><b>Step 1, the listed dividends:</b> discount each by its own year (table below), or run one NPV over years 1–${N}: together <b>${M(o.pvDiv)}</b>.</p>`;
    t += `<p><b>Step 2, the terminal price:</b> from year ${N + 1} on, dividends grow ${PT(o.g2)} forever, so at year ${N} the stock is a constant-growth stock. D${N + 1} = ${MD(o.DN)} × ${fmt.num(1 + o.g2, 4)} = ${MD(o.DN1)}, and P${N} = ${MD(o.DN1)} ÷ (${PT(o.r)} − ${PT(o.g2)}) = <b>${M(o.PN)}</b>. That price sits at year ${N}, so discount it ${N} year${N > 1 ? 's' : ''}: ${M(o.PN)} ÷ ${f}<sup>${N}</sup> = <b>${M(o.pvTV)}</b>.</p>`;
    t += `<p><b>Step 3, add them:</b> ${M(o.pvDiv)} + ${M(o.pvTV)} = <b>${M(o.P0)}</b>. The terminal price is ${PCT(o.share, 1)} of the value, which is why the long-run growth rate matters so much.</p>`;
    t += table;
    if (o.g1 != null && o.g1 >= o.r) t += `<p class="aside">The fast growth rate (${PT(o.g1)}) is ${o.g1 > o.r ? 'above' : 'equal to'} r. That’s fine for a few years; only the forever part, g2, has to stay below r.</p>`;

  },
  excel(v, o, mode) {
    const N = o.N, rows = [];
    const raw = (x) => fmt.raw(x, 6);
    if (mode === 'grow') {
      rows.push(['D1', `=${v.D0}*(1+${xp(o.g1)})`, MD(o.D1)]);
      if (N > 1) rows.push([`D${N}`, `=${v.D0}*(1+${xp(o.g1)})^${N}`, MD(o.DN)]);
      rows.push([`Terminal price P${N}`, `=${v.D0}*(1+${xp(o.g1)})^${N}*(1+${xp(o.g2)})/(${xp(o.r)}-${xp(o.g2)})`, M(o.PN)]);
    } else rows.push([`Terminal price P${N}`, `=${raw(o.DN)}*(1+${xp(o.g2)})/(${xp(o.r)}-${xp(o.g2)})`, M(o.PN)]);

    list[N - 1] = `${list[N - 1]}+${raw(o.PN)}`;
    rows.push(['Price today', `=NPV(${xp(o.r)}, ${list.join(', ')})`, M(o.P0)]);
    return rows;
  },
  ti(v, o, mode) {
    const N = o.N;
    const typed = o.ds.map((d) => fmt.raw(d, 6));
    const pn = fmt.raw(o.PN, 6);
    const pvTyped = (list) => sumOf(list.map((s, i) => +s / Math.pow(1 + o.r, i + 1)));
    const lst = typed.slice(0, -1).concat(`${typed[N - 1]}+${pn}`);
    const s = [];
    if (mode === 'grow') {
      const lines = [[`${tn(v.D0)}*${td(1 + o.g1)}`, o.D1]];
      if (N > 1) lines.push([`${tn(v.D0)}*${td(1 + o.g1)}^${N}`, o.DN]);
      lines.push([`Ans*${td(1 + o.g2)}`, o.DN1], [`Ans/(${td(o.r)}-${tdp(o.g2)})`, o.PN]);
      s.push({ kind: 'home', title: `D1, D${N}, D${N + 1} and the terminal price`, lines });

    if (mode === 'list') npvLines.push([`npv(${tn(v.r)},0,{${typed.join(',')}})`, pvTyped(typed)]);
    npvLines.push([`npv(${tn(v.r)},0,{${lst.join(',')}})`, pvTyped(typed) + +pn / Math.pow(1 + o.r, N)]);
