<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Finance Lecture 3 Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@600;700&family=Red+Hat+Mono:wght@400;500;600;700&family=Red+Hat+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: a topic rail on the left (a select on phones) and one topic at a time on the right.
   Every topic follows the same order: givens, answers, chart, what's happening, solve it, watch out.
   Color: series slots 1-3 (blue, orange, aqua) for identity, slate for structure, green/red only for decisions.
   Blue "given" and yellow "answer" cells mirror the workbook. Type: Red Hat Display / Text / Mono. */
:root {
  --bg: #f2f4f6;
  --surface: #fcfcfd;
  --surface-2: #eceff3;
  --ink: #121a22;
  --ink-2: #47525e;
  --muted: #66707b;
  --grid: #e2e6ea;
  --axis: #aab3bd;
  --border: rgba(18, 26, 34, 0.12);
  --accent: #1766b0;
  --given-bg: #e9f0fb;
  --given-edge: #9dbfe6;
  --given-ink: #1766b0;
  --answer-bg: #fff3cb;
  --answer-edge: #e6cf85;
  --answer-ink: #3b2e00;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --part-a: #a3afbb;
  --part-b: #536170;
  --strong-part: #1d2731;
  --good: #0ca30c;
  --bad: #d03b3b;
  --key-bg: #2c333b;
  --key-edge: #0f1419;
  --key-ink: #f4f6f8;
  --tip-bg: #121a22;
  --tip-ink: #f4f6f8;
  --lcd-bg: #f6f8f2;
  --lcd-ink: #14181c;
  --lcd-bezel: #2c333b;
  --lcd-hi: #ffeda8;
  --nav-active: #e3ebf7;
  --shadow: 0 1px 2px rgba(18, 26, 34, 0.06), 0 8px 20px rgba(18, 26, 34, 0.08);
  --s1-tint: color-mix(in srgb, var(--s1) 32%, var(--surface));
  --s2-tint: color-mix(in srgb, var(--s2) 32%, var(--surface));
  --s3-tint: color-mix(in srgb, var(--s3) 32%, var(--surface));
  --font-display: "Red Hat Display", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Red Hat Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Red Hat Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1216;
    --surface: #161b21;
    --surface-2: #1e252c;
    --ink: #edf1f5;
    --ink-2: #b3bdc7;
    --muted: #8e98a3;
    --grid: #252c34;
    --axis: #4a535e;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #6ea9ea;
    --given-bg: #13233a;
    --given-edge: #2f5482;
    --given-ink: #93c3f5;
    --answer-bg: #33290c;
    --answer-edge: #5e4d19;
    --answer-ink: #fbe6a2;
    --s1: #3987e5;
    --s2: #d95926;
    --s3: #199e70;
    --part-a: #52606d;
    --part-b: #9fadbb;
    --strong-part: #e6ecf2;
    --good: #0ca30c;
    --bad: #d03b3b;
    --key-bg: #3a434d;
    --key-edge: #07090b;
    --key-ink: #f4f6f8;
    --tip-bg: #edf1f5;
    --tip-ink: #121a22;
    --lcd-bg: #dfe4d9;
    --lcd-ink: #14181c;
    --lcd-bezel: #3a434d;
    --lcd-hi: #f7e08a;
    --nav-active: #1c2a3c;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 8px 24px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1216;
  --surface: #161b21;
  --surface-2: #1e252c;
  --ink: #edf1f5;
  --ink-2: #b3bdc7;
  --muted: #8e98a3;
  --grid: #252c34;
  --axis: #4a535e;
  --border: rgba(255, 255, 255, 0.10);
  --accent: #6ea9ea;
  --given-bg: #13233a;
  --given-edge: #2f5482;
  --given-ink: #93c3f5;
  --answer-bg: #33290c;
  --answer-edge: #5e4d19;
  --answer-ink: #fbe6a2;
  --s1: #3987e5;
  --s2: #d95926;
  --s3: #199e70;
  --part-a: #52606d;
  --part-b: #9fadbb;
  --strong-part: #e6ecf2;
  --good: #0ca30c;
  --bad: #d03b3b;
  --key-bg: #3a434d;
  --key-edge: #07090b;
  --key-ink: #f4f6f8;
  --tip-bg: #edf1f5;
  --tip-ink: #121a22;
  --lcd-bg: #dfe4d9;
  --lcd-ink: #14181c;
  --lcd-bezel: #3a434d;
  --lcd-hi: #f7e08a;
  --nav-active: #1c2a3c;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.5), 0 8px 24px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.55 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.012em; color: var(--ink); }
p { margin: 0; }
b, strong { font-weight: 600; }
a { color: var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.app {
  max-width: 78rem;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 16.5rem minmax(0, 1fr);
  gap: 0 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.side {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  align-self: start;
  max-height: 100vh;
  max-height: 100dvh;
  overflow-y: auto;
  padding-block: 24px 32px;
  scrollbar-width: thin;
}
.brand { display: grid; gap: 2px; margin-bottom: 18px; }
.brand-name { font: 700 1.15rem/1.2 var(--font-display); }
.brand-sub { font-size: 0.8125rem; color: var(--muted); }
.nav-unit { margin-top: 14px; }
.nav-unit-title { font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 0 8px 4px; }
.nav-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.nav-list a {
  display: grid;
  grid-template-columns: 1.75rem minmax(0, 1fr);
  gap: 6px;
  align-items: baseline;
  padding: 5px 8px;
  border-radius: 6px;
  color: var(--ink-2);
  text-decoration: none;
  font-size: 0.875rem;
  line-height: 1.3;
}
.nav-list a:hover { background: var(--surface-2); color: var(--ink); }
.nav-list a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.nav-list a[aria-current="page"] { background: var(--nav-active); color: var(--ink); font-weight: 600; }
.nav-num { font: 500 0.75rem/1.3 var(--font-mono); color: var(--muted); }
.nav-list a[aria-current="page"] .nav-num { color: var(--given-ink); }
.main { min-width: 0; padding-block: 24px 64px; }
.topbar { display: none; }

/* ---------- topic ---------- */
.topic { display: grid; gap: 18px; min-width: 0; }
.t-head { display: grid; gap: 6px; }
.eyebrow { font-size: 0.8125rem; color: var(--muted); }
.eyebrow b { color: var(--given-ink); font-family: var(--font-mono); font-weight: 600; }
.topic h1 { font-size: clamp(1.75rem, 1.3rem + 1.8vw, 2.4rem); line-height: 1.1; font-weight: 700; }
.idea { color: var(--ink-2); max-width: 66ch; font-size: 1.0625rem; }
.idea b { color: var(--ink); }
.panel { display: grid; gap: 12px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; min-width: 0; }
.panel-title { font: 600 0.8125rem/1.3 var(--font-body); color: var(--ink-2); letter-spacing: 0.02em; }
.row-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.ex-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.lbl { font-size: 0.8125rem; color: var(--ink-2); margin-right: 2px; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 32px;
  padding: 5px 10px;
  font: 600 0.8125rem/1.2 var(--font-body);
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  text-align: left;
}
.btn:hover { background: var(--surface-2); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn[aria-pressed="true"] { background: var(--surface-2); border-color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--ink-2); }
.chip .cid { font-family: var(--font-mono); font-weight: 600; color: var(--given-ink); }
.chip .ctitle { font-weight: 500; color: var(--ink-2); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.seg button { flex: 1 1 auto; border: 0; border-radius: 0; min-height: 32px; padding: 5px 12px; font: 600 0.8125rem/1.2 var(--font-body); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* givens */
.givens { display: grid; grid-template-columns: repeat(auto-fill, minmax(12.5rem, 1fr)); gap: 10px 12px; }
.field { display: grid; gap: 4px; align-content: start; min-width: 0; }
.field > label { font-size: 0.8125rem; font-weight: 500; color: var(--ink-2); line-height: 1.3; }
.given {
  display: flex;
  align-items: center;
  min-width: 0;
  padding: 0 9px;
  background: var(--given-bg);
  border: 1px solid var(--given-edge);
  border-radius: 4px;
}
.given:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.given .pre, .given .suf { font: 600 0.9375rem/1 var(--font-mono); color: var(--given-ink); flex: none; }
.given input, .given select {
  width: 100%;
  min-width: 0;
  padding: 8px 4px;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--given-ink);
  font: 600 0.9375rem/1.2 var(--font-mono);
  font-variant-numeric: tabular-nums;
}
.given select { padding-right: 0; cursor: pointer; font-family: var(--font-body); }
.given select option { color: var(--ink); background: var(--surface); }
.field.bad .given { border-color: var(--bad); }
.slide { width: 100%; margin: 2px 0 0; accent-color: var(--given-ink); height: 20px; cursor: pointer; }
.msg { font-size: 0.875rem; color: var(--ink); padding: 8px 12px; border-radius: 6px; background: color-mix(in srgb, var(--bad) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--bad) 45%, transparent); }

/* plain-words explainer */
.intro { min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
.intro > summary { display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; list-style: none; font: 700 1rem/1.3 var(--font-display); color: var(--ink); border-radius: 10px; }
.intro > summary::-webkit-details-marker { display: none; }
.intro > summary::before { content: ""; flex: none; width: 7px; height: 7px; margin: 0 2px; border-right: 2px solid var(--ink-2); border-bottom: 2px solid var(--ink-2); transform: rotate(-45deg); transition: transform 0.15s; }
.intro[open] > summary::before { transform: translateY(-2px) rotate(45deg); }
.intro > summary:hover { background: var(--surface-2); }
.intro > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.intro-body { display: grid; gap: 14px; padding: 2px 16px 16px; min-width: 0; }
.intro .story { max-width: 70ch; font-size: 1rem; line-height: 1.6; color: var(--ink); }
.intro-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); gap: 14px 28px; }
.intro h3 { margin: 0 0 6px; font: 600 0.75rem/1.3 var(--font-body); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.terms { margin: 0; display: grid; gap: 7px; }
.terms > div { line-height: 1.45; }
.terms dt { display: inline; font-weight: 600; color: var(--ink); }
.terms dd { display: inline; margin: 0; color: var(--ink-2); }
.steps { margin: 0; padding-left: 1.35em; display: grid; gap: 7px; color: var(--ink-2); line-height: 1.45; }
.steps li::marker { color: var(--ink); font-weight: 700; }
.be-setup { display: grid; gap: 8px; max-width: 70ch; }
.be-setup .bul li { max-width: none; }
.be-control { display: grid; grid-template-columns: auto minmax(8rem, 20rem) auto; align-items: center; justify-self: start; max-width: 100%; gap: 6px 12px; padding: 10px 14px; border-radius: 8px; background: var(--surface-2); }
.be-control label { font-weight: 600; font-size: 0.9375rem; color: var(--ink); }
.be-control output { font: 700 1rem/1.2 var(--font-mono); color: var(--given-ink); white-space: nowrap; }
.be-out { max-width: 70ch; padding: 10px 14px; border-radius: 0 8px 8px 0; border-left: 3px solid var(--part-b); background: var(--surface-2); color: var(--ink); }
.be-out.p { border-left-color: var(--s3); background: color-mix(in srgb, var(--s3) 9%, var(--surface)); }
.be-out.t { border-left-color: var(--s1); background: color-mix(in srgb, var(--s1) 9%, var(--surface)); }
.be-notes { max-width: 70ch; font-size: 0.9375rem; color: var(--ink-2); }
.be-notes b { color: var(--ink); }
@media (max-width: 600px) {
  .be-control { grid-template-columns: minmax(0, 1fr) auto; justify-self: stretch; }
  .be-control label { grid-column: 1 / -1; }
}

/* answers */
.cells { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 8px; }
.cell {
  display: grid;
  gap: 1px;
  align-content: start;
  min-width: 0;
  padding: 8px 10px 9px;
  border: 1px solid var(--answer-edge);
  border-radius: 4px;
  background: var(--answer-bg);
  color: var(--answer-ink);
}
.cell .k { font-size: 0.75rem; font-weight: 500; line-height: 1.3; }
.cell .v { font: 600 1.075rem/1.3 var(--font-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.cell .sub { font-size: 0.75rem; opacity: 0.85; line-height: 1.3; }
.verdict { display: inline-flex; align-items: center; gap: 6px; font: 600 0.9375rem/1.3 var(--font-body); }
.verdict svg { width: 15px; height: 15px; flex: none; }
.verdict.good svg { fill: var(--good); }
.verdict.bad svg { fill: var(--bad); }
.verdict.even svg { fill: var(--muted); }

/* explanation */
.explain { max-width: 70ch; display: grid; gap: 8px; }
.explain p { color: var(--ink); }
.explain .aside { color: var(--ink-2); font-size: 0.9375rem; }
.math { font-family: var(--font-mono); font-size: 0.9em; white-space: nowrap; }

/* charts */
figure { margin: 0; }
.chart { position: relative; display: grid; align-content: start; gap: 8px; min-width: 0; padding: 12px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
.chart figcaption { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
.fig-title { font-size: 0.875rem; font-weight: 600; color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8125rem; color: var(--ink-2); }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; flex: none; }
.sw.line { height: 3px; border-radius: 2px; width: 16px; }
.sw.dash { height: 0; border-top: 2px dashed var(--ink-2); border-radius: 0; width: 16px; background: none !important; }
.plot { position: relative; min-width: 0; min-height: 60px; }
.plot svg { display: block; overflow: visible; }
.plot text { font-family: var(--font-body); font-size: 12px; fill: var(--ink-2); font-variant-numeric: tabular-nums; }
.plot text.ink { fill: var(--ink); }
.plot text.strong { fill: var(--ink); font-weight: 600; }
.plot .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
.plot .gridline { stroke: var(--grid); stroke-width: 1; }
.plot .axis { stroke: var(--axis); stroke-width: 1; }
.plot .ref { stroke: var(--ink-2); stroke-width: 1.25; stroke-dasharray: 3 3; fill: none; }
.plot .cross { stroke: var(--ink-2); stroke-width: 1; }
.plot .hit { fill: transparent; }
.plot .label-bg { fill: var(--surface); }
.f-s1 { fill: var(--s1); } .f-s2 { fill: var(--s2); } .f-s3 { fill: var(--s3); }
.f-s1t { fill: var(--s1-tint); } .f-s2t { fill: var(--s2-tint); } .f-s3t { fill: var(--s3-tint); }
.f-a { fill: var(--part-a); } .f-b { fill: var(--part-b); } .f-strong { fill: var(--strong-part); }
.f-good { fill: var(--good); } .f-bad { fill: var(--bad); }
.f-none { fill: transparent; } .f-s2b { fill: var(--s2); }
.l-s1 { stroke: var(--s1); fill: none; } .l-s2 { stroke: var(--s2); fill: none; } .l-s3 { stroke: var(--s3); fill: none; }
.l-b { stroke: var(--part-b); fill: none; } .l-ink { stroke: var(--ink-2); fill: none; }
.a-s1 { fill: color-mix(in srgb, var(--s1) 14%, transparent); stroke: none; }
.d-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
.d-s2 { fill: var(--s2); stroke: var(--surface); stroke-width: 2; }
.d-s3 { fill: var(--s3); stroke: var(--surface); stroke-width: 2; }
.d-ink { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
.bg-s1 { background: var(--s1); } .bg-s2 { background: var(--s2); } .bg-s3 { background: var(--s3); }
.bg-s1t { background: var(--s1-tint); } .bg-s2t { background: var(--s2-tint); }
.bg-a { background: var(--part-a); } .bg-b { background: var(--part-b); } .bg-strong { background: var(--strong-part); }
.tip {
  position: absolute;
  z-index: 4;
  max-width: 280px;
  padding: 8px 10px;
  border-radius: 6px;
  background: var(--tip-bg);
  color: var(--tip-ink);
  font-size: 0.8125rem;
  line-height: 1.45;
  box-shadow: var(--shadow);
  pointer-events: none;
}
.tip .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.charts-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

/* solve it */
.solve { display: grid; gap: 14px; padding: 14px 16px; border-radius: 10px; background: var(--surface-2); min-width: 0; }
.solve h2, .watch h2, .more h2 { font-size: 1.05rem; font-weight: 700; }
.xl { display: grid; gap: 6px; }
.xl-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 0.875rem; }
.xl-row .what { color: var(--ink-2); font-size: 0.8125rem; min-width: 0; }
code { font-family: var(--font-mono); font-size: 0.85rem; padding: 2px 7px; border-radius: 4px; background: var(--surface); border: 1px solid var(--border); overflow-wrap: anywhere; color: var(--ink); }
.arrow { color: var(--muted); }
.gives { font-family: var(--font-mono); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.tool { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.ti-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 27rem), 1fr)); gap: 16px 20px; align-items: start; }
.ti-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: start; min-width: 0; }
.ti-text { display: grid; gap: 4px; align-content: start; min-width: 0; }
.ti-title { font-size: 0.8125rem; font-weight: 600; color: var(--ink); }
.ti-how { font-size: 0.8125rem; color: var(--ink-2); line-height: 1.9; }
.key {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 1.9em;
  padding: 1px 6px;
  margin: 0 1px;

    const t = mk(g, 'text', { y: 12 + (j % 2) * 0, class: 'strong halo' }, mm.label);
    place(t, x, W, mm.anchor || 'middle');
  });
  const hit = mk(g, 'rect', { x: m.l, y: 0, width: iw, height: H, class: 'hit' });
  hit.style.touchAction = 'pan-y';
  const show = (e) => {
    const rr = g.getBoundingClientRect();
    const i = Math.max(0, Math.min(n - 1, Math.floor((e.clientX - rr.left - m.l) / band)));
    hl.setAttribute('x', m.l + i * band);
    hl.setAttribute('visibility', 'visible');
    if (data[i].tip) tipShow(fig, data[i].tip, e.clientX, rr.top + m.t + 10);
  };
  hit.addEventListener('pointermove', show);
  hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointerleave', () => { hl.setAttribute('visibility', 'hidden'); tipHide(fig); });
}

/* ================================================================ chart: lines */
function drawLine(plot, fig, sp) {
  const W = plot.clientWidth;
  if (!W) return;
  const H = sp.H || 230;
  const m = { l: sp.ml || 58, r: sp.mr || 14, t: sp.mt || 14, b: 26 };
  const xs = sp.xs;
  const allY = [];
  sp.series.forEach((s) => s.ys.forEach((y) => Number.isFinite(y) && allY.push(y)));
  (sp.hrefs || []).forEach((h) => allY.push(h.y));
  (sp.points || []).forEach((p) => allY.push(p.y));
  let lo = sp.yDomain ? sp.yDomain[0] : Math.min(...allY);
  let hi = sp.yDomain ? sp.yDomain[1] : Math.max(...allY);
  if (sp.zero) lo = Math.min(0, lo);
  const sc = sp.yDomain ? { lo, hi, ticks: niceScale(lo, hi, 4).ticks.filter((t) => t >= lo - 1e-9 && t <= hi + 1e-9) } : niceScale(lo, hi, 4);
  const x0 = sp.xDomain ? sp.xDomain[0] : Math.min(...xs), x1 = sp.xDomain ? sp.xDomain[1] : Math.max(...xs);
  const g = newSvg(plot, W, H, sp.label);
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const X = (x) => m.l + ((x - x0) / (x1 - x0 || 1)) * iw;
  const Y = (y) => m.t + ((sc.hi - y) / (sc.hi - sc.lo || 1)) * ih;
  const yF = sp.yFmt || fmt.axis;
  (sp.bands || []).forEach((b) => {
    const r = mk(g, 'rect', { x: X(b.x0), y: m.t, width: Math.max(0, X(b.x1) - X(b.x0)), height: ih });
    r.style.fill = `color-mix(in srgb, var(--${b.cls || 'ink'}) ${b.alpha || 7}%, transparent)`;
    if (b.label) { const t = mk(g, 'text', { y: m.t + 13, class: 'ink' }, b.label); place(t, (X(b.x0) + X(b.x1)) / 2, W, 'middle'); }
  });
  sc.ticks.forEach((t) => {
    mk(g, 'line', { x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), class: 'gridline' });
    mk(g, 'text', { x: m.l - 8, y: Y(t) + 4, 'text-anchor': 'end' }, yF(t));
  });
  const xt = sp.xTicks || niceScale(x0, x1, Math.max(2, Math.floor(iw / 70))).ticks.filter((t) => t >= x0 - 1e-9 && t <= x1 + 1e-9);
  const xF = sp.xFmt || ((x) => String(x));
  let lastR = -Infinity;
  xt.forEach((t) => {
    const tx = mk(g, 'text', { y: H - 6 }, xF(t));
    const [a, b] = place(tx, X(t), W, 'middle');
    if (a < lastR + 6) tx.remove(); else lastR = b;
  });
  mk(g, 'line', { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, class: 'axis' });
  (sp.hrefs || []).forEach((h) => {
    mk(g, 'line', { x1: m.l, x2: W - m.r, y1: Y(h.y), y2: Y(h.y), class: 'ref' });
    if (h.label) { const t = mk(g, 'text', { y: Y(h.y) - 5, class: 'ink halo' }, h.label); place(t, h.at === 'left' ? m.l + 4 : W - m.r, W, h.at === 'left' ? 'start' : 'end'); }
  });
  (sp.vrefs || []).forEach((v) => {
    mk(g, 'line', { x1: X(v.x), x2: X(v.x), y1: m.t, y2: H - m.b, class: 'ref' });
    if (v.label) { const t = mk(g, 'text', { y: m.t + 12 + (v.row || 0) * 15, class: 'ink halo' }, v.label); place(t, X(v.x) + (v.anchor === 'end' ? -5 : 5), W, v.anchor || 'start'); }
  });
  sp.series.forEach((s) => {
    let d = '';
    let pen = false;
    s.ys.forEach((y, i) => {
      if (!Number.isFinite(y)) { pen = false; return; }
      const px = X(xs[i]).toFixed(1), py = Y(Math.max(sc.lo, Math.min(sc.hi, y))).toFixed(1);
      if (s.step && pen) d += `H${px}V${py}`;
      else d += (pen ? 'L' : 'M') + px + ',' + py;
      pen = true;
    });
    if (s.area) {
      const firstI = s.ys.findIndex(Number.isFinite);
      const lastI = s.ys.length - 1 - [...s.ys].reverse().findIndex(Number.isFinite);
      mk(g, 'path', { d: d + `L${X(xs[lastI]).toFixed(1)},${Y(Math.max(sc.lo, 0))}L${X(xs[firstI]).toFixed(1)},${Y(Math.max(sc.lo, 0))}Z`, class: 'a-' + s.cls });
    }
    const p = mk(g, 'path', { d, class: 'l-' + s.cls, 'stroke-width': s.w || 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' });
    if (s.dash) p.setAttribute('stroke-dasharray', '5 4');
    if (s.dots) s.ys.forEach((y, i) => Number.isFinite(y) && mk(g, 'circle', { cx: X(xs[i]), cy: Y(y), r: 4, class: 'd-' + s.cls }));
  });
  (sp.points || []).forEach((pt) => {
    mk(g, 'circle', { cx: X(pt.x), cy: Y(pt.y), r: pt.r || 5, class: 'd-' + (pt.cls || 'ink') });
    if (pt.label) {
      const dy = pt.pos === 'below' ? 18 : pt.pos === 'mid' ? 4 : -10;
      const t = mk(g, 'text', { y: Y(pt.y) + dy, class: 'strong halo' }, pt.label);
      const anchor = pt.anchor || 'middle';
      place(t, X(pt.x) + (anchor === 'start' ? 9 : anchor === 'end' ? -9 : 0), W, anchor);
    }
  });
  if (sp.tip) {
    const cross = mk(g, 'line', { x1: 0, x2: 0, y1: m.t, y2: H - m.b, class: 'cross', visibility: 'hidden' });
    const hit = mk(g, 'rect', { x: m.l - 10, y: 0, width: iw + 20, height: H, class: 'hit' });
    hit.style.touchAction = 'pan-y';
    const show = (e) => {
      const rr = g.getBoundingClientRect();
      const px = e.clientX - rr.left;
      let best = 0, bd = Infinity;
      xs.forEach((x, i) => { const dd = Math.abs(X(x) - px); if (dd < bd) { bd = dd; best = i; } });
      cross.setAttribute('x1', X(xs[best]));
      cross.setAttribute('x2', X(xs[best]));
      cross.setAttribute('visibility', 'visible');
      const html = sp.tip(best);
      if (html) tipShow(fig, html, rr.left + X(xs[best]), e.clientY);
    };
    hit.addEventListener('pointermove', show);
    hit.addEventListener('pointerdown', show);
    hit.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); tipHide(fig); });
  }
}

/* ================================================================ chart: horizontal bars */
function drawHBars(plot, fig, sp) {
  const W = plot.clientWidth;
  if (!W) return;
  const rows = sp.rows;
  const rowH = sp.rowH || 46;
  const top = sp.refs && sp.refs.some((r) => r.label) ? 20 : 4;
  const H = top + rows.length * rowH + (sp.axis === false ? 4 : 22);
  const pad = 4;
  let lo = 0, hi = 0;
  rows.forEach((r) => { let p = 0; r.segs.forEach((s) => { p += s.v; lo = Math.min(lo, p, s.v); hi = Math.max(hi, p, s.v); }); if (r.marker) hi = Math.max(hi, r.marker.x); });
  (sp.refs || []).forEach((r) => { hi = Math.max(hi, r.x); lo = Math.min(lo, r.x); });
  if (sp.domain) { lo = sp.domain[0]; hi = sp.domain[1]; } else { hi *= 1.04; }
  const g = newSvg(plot, W, H, sp.label);
  const X = (v) => pad + ((v - lo) / (hi - lo || 1)) * (W - 2 * pad);
  if (sp.axis !== false) {
    const sc = niceScale(lo, hi, Math.max(2, Math.floor(W / 110)));
    sc.ticks.filter((t) => t >= lo - 1e-9 && t <= hi + 1e-9).forEach((t) => {
      mk(g, 'line', { x1: X(t), x2: X(t), y1: top, y2: H - 20, class: t === 0 ? 'axis' : 'gridline' });
      const tx = mk(g, 'text', { y: H - 5 }, (sp.fmt || fmt.axis)(t));
      place(tx, X(t), W, 'middle');
    });
  }
  const labels = [];
  rows.forEach((r, i) => {
    const y = top + i * rowH;
    let p = 0;
    r.segs.forEach((s, j) => {
      const a = p, b = p + s.v;
      const isLast = j === r.segs.length - 1;
      const x0 = X(a) + (j > 0 ? 1 : 0), x1 = X(b) - (isLast ? 0 : 1);
      let path;
      if (Math.abs(x1 - x0) >= 0.5) path = mk(g, 'path', { d: isLast ? hbar(x0, x1, y + 22, 14, 3) : `M${x0},${y + 22}H${x1}V${y + 36}H${x0}Z`, class: 'f-' + s.cls });
      if (path && s.hatch) path.style.fill = `color-mix(in srgb, var(--${s.cls === 'a' ? 'part-a' : s.cls}) 35%, transparent)`;
      if (path && s.tip) path.setAttribute('data-tip', s.tip);
      p = b;
    });
    if (r.marker) {
      mk(g, 'line', { x1: X(r.marker.x), x2: X(r.marker.x), y1: y + 18, y2: y + 40, class: 'cross', 'stroke-width': 2 });
    }
    const t = mk(g, 'text', { x: 0, y: y + 13, class: 'ink' }, r.label);
    if (r.value) mk(t, 'tspan', { dx: 8, class: 'strong' }, r.value);
    labels.push(t);
    const hit = mk(g, 'rect', { x: 0, y: y + 14, width: W, height: 30, class: 'hit' });
    // every row gets a tooltip: its own, else its label and value plus any segment tips
    hit.setAttribute('data-tip', r.tip || [`<b>${esc(r.label)}</b>${r.value ? ` <span class="num">${esc(r.value)}</span>` : ''}`, ...r.segs.filter((s) => s.tip).map((s) => s.tip)].join('<br>'));
  });
  (sp.refs || []).forEach((rf) => {
    mk(g, 'line', { x1: X(rf.x), x2: X(rf.x), y1: top - 4, y2: H - 20, class: 'ref' });
    if (rf.label) place(mk(g, 'text', { y: 12, class: 'ink halo' }, rf.label), X(rf.x), W, 'middle');
  });
  labels.forEach((t) => labelBg(g, t));
}

/* ================================================================ calculator rendering */
const KEYS = (s) => s.split(' ').map((k) => `<span class="key">${esc(k)}</span>`).join(' ');
function tvmLCD(s, solved) {
  const order = [['N', 'N'], ['I%', 'I'], ['PV', 'PV'], ['PMT', 'PMT'], ['FV', 'FV'], ['P/Y', 'PY'], ['C/Y', 'CY']];
  const vals = { ...s, CY: s.CY ?? s.PY };
  return order.map(([lab, key]) => {
    const on = lab === s.solve;
    const v = on ? TI.num(solved) : TI.num(vals[key]);
    return `<div class="r${on ? ' solved' : ''}"><span class="mk">${on ? '▪' : ''}</span>${lab}=${v}</div>`;
  }).join('') + `<div class="r"><span class="mk"></span>PMT:${s.bgn ? 'END <span class="sel">BEGIN</span>' : '<span class="sel">END</span> BEGIN'}</div>`;
}
function homeTips(expr) {
  const t = [];
  if (expr.includes('^')) t.push(`After an exponent, press ${KEYS('►')} to come back down.`);
  if (expr.includes('\u207B')) t.push(`Type ⁻ with ${KEYS('(−)')}.`);
  if (expr.includes('Ans')) t.push(`Ans is ${KEYS('2nd')} ${KEYS('(−)')}.`);
  if (expr.includes('e^(')) t.push(`e^( is ${KEYS('2nd')} ${KEYS('ln')}.`);
  if (expr.includes('√(')) t.push(`√( is ${KEYS('2nd')} ${KEYS('x²')}.`);
  if (expr.includes('{')) t.push(`Braces are ${KEYS('2nd')} ${KEYS('(')} and ${KEYS('2nd')} ${KEYS(')')}.`);
  if (expr.includes('\u25BAEff(')) t.push(`►Eff( is ${KEYS('apps')} ${KEYS('1')} then C.`);
  if (expr.includes('\u25BANom(')) t.push(`►Nom( is ${KEYS('apps')} ${KEYS('1')} then B.`);
  if (expr.includes('npv(')) t.push(`npv( is ${KEYS('apps')} ${KEYS('1')} ${KEYS('7')}.`);
  if (expr.includes('irr(')) t.push(`irr( is ${KEYS('apps')} ${KEYS('1')} ${KEYS('8')}.`);
  if (/(^|[^a-z])ln\(/.test(expr)) t.push(`ln( is the ${KEYS('ln')} key.`);
  return t;
}
function tiCard(scr) {
  if (scr.kind === 'tvm') {
    const solved = TI.solve(scr);
    const how = `${KEYS('apps 1 1')}, enter the values${scr.bgn ? ', highlight BEGIN and press ' + KEYS('enter') : ''}, put the cursor on ${scr.solve}, press ${KEYS('alpha enter')}.`;
    return `<div class="ti-card"><div class="ti-text"><div class="ti-title">${esc(scr.title || 'TVM Solver')}</div><div class="ti-how">${how}${scr.note ? ' ' + scr.note : ''}</div></div><div class="lcd" role="img" aria-label="TVM Solver screen">${tvmLCD(scr, solved)}</div></div>`;
  }
  const exprs = scr.lines.map((l) => l[0]).join(' ');
  const tips = homeTips(exprs);
  const how = `On the home screen, type each line and press ${KEYS('enter')}.${tips.length ? ' ' + tips.join(' ') : ''}${scr.note ? ' ' + scr.note : ''}`;
  const body = scr.lines.map(([e, v], i) => `<div class="he">${esc(e)}</div><div class="hr${i === scr.lines.length - 1 ? ' hl' : ''}">${TI.num(v)}</div>`).join('');
  return `<div class="ti-card"><div class="ti-text"><div class="ti-title">${esc(scr.title || 'Home screen')}</div><div class="ti-how">${how}</div></div><div class="lcd" role="img" aria-label="Home screen">${body}</div></div>`;
}

/* ================================================================ topics + rendering */
const TOPICS = [];
const UNITS = [];
function unit(name) { UNITS.push(name); }
function topic(def) { def.unit = UNITS[UNITS.length - 1]; TOPICS.push(def); }

const state = {};
let current = null;
const $ = (s, r = document) => r.querySelector(s);

function defaults(def) {
  const v = {};
  (def.inputs || []).forEach((i) => { v[i.k] = i.def; });
  const ex = def.examples && def.examples[0];
  if (ex) Object.assign(v, ex.v);
  return { v, mode: ex && ex.mode ? ex.mode : def.modes ? def.modes[0].k : null };
}
function inputVisible(inp, mode) { return !inp.modes || inp.modes.includes(mode); }
function fieldHTML(def, inp) {
  const id = `in-${def.id}-${inp.k}`;
  let control;
  if (inp.kind === 'sel') {
    control = `<div class="given"><select id="${id}" data-k="${inp.k}">${inp.options.map(([val, lab]) => `<option value="${val}">${esc(lab)}</option>`).join('')}</select></div>`;
  } else {
    const pre = inp.kind === 'money' ? '<span class="pre">$</span>' : '';
    const suf = inp.kind === 'pct' ? '<span class="suf">%</span>' : inp.unit ? `<span class="suf">${esc(inp.unit)}</span>` : '';
    control = `<div class="given">${pre}<input id="${id}" data-k="${inp.k}" type="number" inputmode="decimal" step="any"${inp.min != null ? ` min="${inp.min}"` : ''}${inp.max != null ? ` max="${inp.max}"` : ''}>${suf}</div>`;
  }
  const slider = inp.slider ? `<input class="slide" type="range" aria-label="${esc(inp.label)} slider" data-s="${inp.k}" min="${inp.slider[0]}" max="${inp.slider[1]}" step="${inp.slider[2]}">` : '';
  return `<div class="field" data-f="${inp.k}"><label for="${id}">${esc(inp.label)}</label>${control}${slider}</div>`;
}
function exampleMatches(ex, st) {
  if (ex.mode && ex.mode !== st.mode) return false;
  return Object.keys(ex.v).every((k) => Math.abs((st.v[k] ?? NaN) - ex.v[k]) < 1e-9);
}

function renderTopic(def) {

  }

  const det = main.querySelector('details[data-intro]');

  if (def.page) { if (def.after) def.after(main); return; }
  // wire inputs
  def.inputs.forEach((inp) => {
    const el = $(`#in-${def.id}-${inp.k}`);
    const sl = main.querySelector(`[data-s="${inp.k}"]`);
    el.addEventListener('input', () => {
      const val = parseFloat(el.value);
      const ok = Number.isFinite(val) && (inp.min == null || val >= inp.min) && (inp.max == null || val <= inp.max);

      if (ok) { st.v[inp.k] = val; if (sl) sl.value = val; }
      st.invalid = !ok ? inp.label : null;
      update();
    });
    if (sl) sl.addEventListener('input', () => { st.v[inp.k] = parseFloat(sl.value); el.value = sl.value; el.closest('.field').classList.remove('bad'); st.invalid = null; update(); });
  });
  main.querySelectorAll('[data-ex]').forEach((b) => b.addEventListener('click', () => {
    const ex = def.examples[+b.dataset.ex];
    Object.assign(st.v, ex.v);

    st.invalid = null;
    syncInputs(def, st);
    update();
  }));
  main.querySelectorAll('[data-mode]').forEach((b) => b.addEventListener('click', () => { st.mode = b.dataset.mode; syncInputs(def, st); update(); }));
  (def.charts || []).forEach((c, j) => wireTips($('#fig' + j)));
  if (def.wireIntro) def.wireIntro(main, st);

}
function syncInputs(def, st) {
  def.inputs.forEach((inp) => {
    const el = $(`#in-${def.id}-${inp.k}`);
    if (!el) return;
    el.value = st.v[inp.k];
    el.closest('.field').classList.remove('bad');
    el.closest('.field').hidden = !inputVisible(inp, st.mode) || (inp.showIf && !inp.showIf(st.v, st.mode));
    const sl = document.querySelector(`[data-s="${inp.k}"]`);
    if (sl) sl.value = st.v[inp.k];
  });
  document.querySelectorAll('[data-mode]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === st.mode)));
}
function update() {
  const def = current;
  const st = state[def.id];
  document.querySelectorAll('[data-ex]').forEach((b) => b.setAttribute('aria-pressed', String(exampleMatches(def.examples[+b.dataset.ex], st))));
  def.inputs.forEach((inp) => { if (inp.showIf) { const f = document.querySelector(`[data-f="${inp.k}"]`); if (f) f.hidden = !inputVisible(inp, st.mode) || !inp.showIf(st.v, st.mode); } });
  const msg = $('#msg');
  let o;
  try {
    if (st.invalid) throw new Error(`Enter a valid number for “${st.invalid}”.`);
    o = def.calc(st.v, st.mode);
  } catch (e) {
    msg.hidden = false;
    msg.textContent = e.message;
    return;
  }
  msg.hidden = true;
  st.o = o;
  const v = st.v, mode = st.mode;
  const cl = def.out(v, o, mode);
  const n = cl.length;
  $('#cells').style.setProperty('--cols', n <= 5 ? n : n === 6 || n === 9 ? 3 : 4);
  $('#cells').innerHTML = cl.map((c) => `<div class="cell"${c.raw != null && Number.isFinite(c.raw) ? ` data-raw="${c.raw}"` : ''}><span class="k">${esc(c.label)}</span><span class="v">${showVal(c)}</span>${c.sub ? `<span class="sub">${esc(c.sub)}</span>` : ''}</div>`).join('');
  $('#explain').innerHTML = def.text(v, o, mode);
  $('#xl').innerHTML = def.excel(v, o, mode).map(([what, f, res]) => `<div class="xl-row">${what ? `<span class="what">${esc(what)}</span>` : ''}<code>${esc(f)}</code><span class="arrow">→</span><span class="gives">${esc(res)}</span></div>`).join('');
  $('#ti').innerHTML = def.ti(v, o, mode).map(tiCard).join('');
  drawCharts();
}
function drawCharts() {
  const def = current;
  if (!def || def.page) return;
  const st = state[def.id];
  if (!st.o) return;
  (def.charts || []).forEach((c, j) => {
    const fig = $('#fig' + j);
    if (!fig) return;
    $('#figt' + j).textContent = typeof c.title === 'function' ? c.title(st.v, st.o, st.mode) : c.title;
    const lg = typeof c.legend === 'function' ? c.legend(st.v, st.o, st.mode) : c.legend;
    $('#figl' + j).innerHTML = lg ? legendHTML(lg) : '';
    c.draw($('#plot' + j), fig, st.v, st.o, st.mode);
  });
  if (def.drawIntro) def.drawIntro(st.v, st.o, st.mode, st);
}

function route() {
  const m = /^#t([0-9A-Z]{2})$/.exec(location.hash);
  let id = m ? m[1] : null;
  if (!id || !TOPICS.some((t) => t.id === id)) {
    try { id = localStorage.getItem('lab-topic'); } catch (e) { id = null; }
    if (!id || !TOPICS.some((t) => t.id === id)) id = '01';
  }
  try { localStorage.setItem('lab-topic', id); } catch (e) { /* storage unavailable */ }
  const def = TOPICS.find((t) => t.id === id);
  if (def !== current) {
    renderTopic(def);
    if (m) window.scrollTo({ top: 0 });
  }
}
function boot() {
  renderNav();
  $('#prevBtn').addEventListener('click', () => { const i = TOPICS.indexOf(current); if (i > 0) location.hash = '#t' + TOPICS[i - 1].id; });
  $('#nextBtn').addEventListener('click', () => { const i = TOPICS.indexOf(current); if (i < TOPICS.length - 1) location.hash = '#t' + TOPICS[i + 1].id; });
  window.addEventListener('hashchange', route);
  route();
  let raf = 0, lastW = 0;
  const ro = new ResizeObserver(() => {
    const w = $('#main').clientWidth;
    if (w === lastW) return;
    lastW = w;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(drawCharts);
  });
  ro.observe($('#main'));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawCharts);
  window.__lab = { TOPICS, F, TI, state, fmt };
}

unit('Annuities and loans');
topic({
  id: '01',
  name: 'Annuity PV',
  idea: 'A stream of equal payments is worth less than its total, because <b>money later is worth less than money now</b>. Discount each payment back to today and add them up.',
  inputs: [
    { k: 'C', label: 'Payment each period', kind: 'money', def: 1200, min: 0, max: 1e9, slider: [0, 30000, 50] },
    { k: 'apr', label: 'Annual discount rate (APR)', kind: 'pct', def: 6, min: 0, max: 100, slider: [0, 20, 0.05] },
    { k: 'm', label: 'Payments per year', kind: 'sel', def: 1, options: FREQ },
    { k: 'n', label: 'Number of payments', kind: 'int', def: 5, min: 1, max: 1200, slider: [1, 120, 1] },
    { k: 'due', label: 'First payment', kind: 'sel', def: 0, options: [[0, 'One period from now'], [1, 'Today (annuity due)']] },
    { k: 'L', label: 'Lump sum offered today', kind: 'money', def: 5000, min: 0, max: 1e10 },
  ],
  examples: [
    { id: 'PV-01', title: 'Research stipend', v: { C: 1200, apr: 6, m: 1, n: 5, due: 0, L: 5000 } },
    { id: 'PV-02', title: 'Quarterly royalties', v: { C: 1800, apr: 7.2, m: 4, n: 20, due: 0, L: 29000 } },
    { id: 'PV-03', title: 'Monthly scholarship', v: { C: 450, apr: 4.8, m: 12, n: 36, due: 0, L: 15000 } },
    { id: 'PV-04', title: 'Advance rental receipts', v: { C: 900, apr: 6, m: 12, n: 24, due: 1, L: 20000 } },
    { id: 'PV-05', title: 'Annual settlement', v: { C: 24000, apr: 7, m: 1, n: 15, due: 0, L: 210000 } },
    { id: 'PV-06', title: 'Equipment lease', v: { C: 1500, apr: 8, m: 4, n: 16, due: 1, L: 20500 } },
    { id: 'PV-07', title: 'Book royalties', v: { C: 20000, apr: 6.5, m: 1, n: 20, due: 0, L: 250000 } },
    { id: 'PV-08', title: 'Consulting retainer', v: { C: 650, apr: 9, m: 12, n: 48, due: 0, L: 27000 } },
    { id: 'PV-09', title: 'Community grant', v: { C: 8000, apr: 4, m: 2, n: 12, due: 0, L: 80000 } },
    { id: 'PV-10', title: 'Sports sponsorship', v: { C: 3500, apr: 7.5, m: 4, n: 28, due: 0, L: 76000 } },
  ],
  calc(v) {
    const r = pc(v.apr) / v.m;
    const pv = v.C * F.a(r, v.n) * (1 + r * v.due);
    const t0 = v.due ? 0 : 1;
    const flows = Array.from({ length: v.n }, (_, i) => { const t = t0 + i; return { t, v: v.C, pv: v.C / Math.pow(1 + r, t) }; });
    return { r, pv, adv: pv - v.L, flows };
  },
  out(v, o) {
    const choice = o.adv > 0 ? ['good', 'Take the payments'] : o.adv < 0 ? ['good', 'Take the lump sum'] : ['even', 'Either one'];
    return [
      cell('Rate per period', o.r, 'pct4', `${PT(pc(v.apr))} ÷ ${v.m}`),
      cell('PV of the payments', o.pv, 'money', `${v.n} payments of ${M(v.C)}`),
      cell('PV minus lump sum', o.adv, 'moneyS'),
      verdict('Better choice', choice[0], choice[1]),
    ];
  },
  charts: [{
    title: 'Each payment and what it’s worth today',
    legend: FLOW_LEGEND,
    draw(plot, fig, v, o) {
      drawBars(plot, fig, {
        label: `Bars for ${v.n} payments of ${M(v.C)} with their present values`,
        data: o.flows.map((f) => ({ x: f.t, v: f.v, pv: f.pv, tip: `<b>Payment at period ${f.t}</b><br>Amount <span class="num">${M(f.v)}</span><br>Worth today <span class="num">${M(f.pv)}</span>` })),
        xLabel: (d) => String(d.x),
      });
    },
  }],
  text(v, o) {
    const f1 = o.flows[0], fn = o.flows[o.flows.length - 1];
    let t = `<p>At ${PT(o.r)} per ${perName(v.m)}, the first payment is worth ${M(f1.pv)} today and the last only ${M(fn.pv)}. Added up, the ${v.n} payments are worth <b>${M(o.pv)}</b> today, less than their ${M(v.C * v.n)} total.</p>`;
    if (v.L > 0) t += `<p>That’s ${M(Math.abs(o.adv))} ${o.adv >= 0 ? 'more' : 'less'} than the ${M(v.L)} lump sum, so <b>${o.adv >= 0 ? 'take the payments' : 'take the lump sum'}</b>. Both are compared today.</p>`;
    if (v.due) t += `<p class="aside">The first payment is today, so every payment arrives one period sooner than an ordinary annuity. That multiplies the value by (1 + r) = ${fmt.num(1 + o.r, 6)}.</p>`;
    return t;
  },
  excel(v, o) {
    const f = `=PV(${exRate(v.apr, v.m)}, ${v.n}, -${v.C}, 0, ${v.due})`;
    return [['PV of the payments', f, M(o.pv)], ['Minus the lump sum', `${f}-${v.L}`, MS(o.adv)]];
  },
  ti(v, o) {
    return [{ kind: 'tvm', title: 'PV of the payments', N: v.n, I: v.apr, PV: 0, PMT: -v.C, FV: 0, PY: v.m, CY: v.m, bgn: !!v.due, solve: 'PV', expect: o.pv, note: 'PMT is negative so PV comes out positive, like Excel’s −C.' }];
  },
  watch: [
    '<b>Match the period.</b> 7.2% a year paid quarterly is 1.8% per quarter, and n counts quarters. On the TI, P/Y = 4 does the dividing.',
    '<b>First payment today</b> is an annuity due: BEGIN on the TI, type 1 in Excel.',
    '<b>Compare at the same date.</b> The lump sum is today, so compare it with the PV, never with the total of the payments.',
  ],
  verify: {
    'Rate per payment period': (o) => o.r,
    'PV of the payment stream': (o) => o.pv,
    'PV advantage over lump sum': (o) => o.adv,
    'Choose: 1=stream, 2=lump sum': (o) => (o.adv > 0 ? 1 : 2),
  },
});

    { id: 'DA-07', title: 'Value after one year', v: { C: 700, apr: 6, m: 12, n: 36, first: 19, val: 12, X: 0 } },
    { id: 'DA-08', title: 'Value at contract signing', v: { C: 6000, apr: 5, m: 2, n: 16, first: 7, val: 2, X: 0 } },
    { id: 'DA-09', title: 'Scholarship at graduation', v: { C: 1500, apr: 7.2, m: 12, n: 24, first: 37, val: 24, X: 5000 } },
    { id: 'DA-10', title: 'Deferred program grant', v: { C: 22000, apr: 6.5, m: 1, n: 8, first: 6, val: 2, X: 15000 } },
  ],
  calc(v) {
    need(v.val <= v.first - 1, 'The valuation date has to come before the first payment.');
    const r = pc(v.apr) / v.m;
    const ad = v.first - 1, k = ad - v.val;
    const VA = v.C * F.a(r, v.n) + v.X * Math.pow(1 + r, -v.n);
    const VV = VA / Math.pow(1 + r, k);
    const flows = [];
    for (let t = v.val; t <= v.first + v.n - 1; t++) {
      const cf = t >= v.first ? v.C + (t === v.first + v.n - 1 ? v.X : 0) : 0;
      flows.push({ t, v: cf, pv: cf / Math.pow(1 + r, t - v.val) });
    }
    return { r, ad, k, VA, VV, lost: VA - VV, flows };
  },
  out(v, o) {
    return [
      cell('Rate per period', o.r, 'pct4'),
      cell('Annuity value lands at period', o.ad, 'int', `one before period ${v.first}`),
      cell('Periods to discount back', o.k, 'int'),
      cell(`Value at period ${o.ad}`, o.VA, 'money'),
      cell(`Value at period ${v.val}${v.val === 0 ? ' (today)' : ''}`, o.VV, 'money'),
      cell('Value lost from waiting', o.lost, 'money'),
    ];

  charts: [{
    title: 'Payments start later, so their value today is lower',
    legend: FLOW_LEGEND,
    draw(plot, fig, v, o) {
      const idx = (t) => t - v.val;
      drawBars(plot, fig, {
        label: 'Deferred payment timeline',
        data: o.flows.map((f) => ({ x: f.t, v: f.v, pv: f.pv, tip: f.v ? `<b>Period ${f.t}</b><br>Payment <span class="num">${M(f.v)}</span><br>Worth at period ${v.val}: <span class="num">${M(f.pv)}</span>` : `<b>Period ${f.t}</b><br>No payment yet` })),
        markers: o.ad === v.val ? [{ i: 0, label: `Value lands here (${o.ad})`, anchor: 'start' }] : [{ i: idx(v.val), label: v.val === 0 ? 'Today' : `Period ${v.val}`, anchor: 'start' }, { i: idx(o.ad), label: `Annuity value (${o.ad})`, anchor: 'middle' }],
        xLabel: (d) => String(d.x),
      });
    },
  }],
  text(v, o) {
    return `<p>The annuity formula always lands one period before the first payment. The first payment is at period ${v.first}, so ${M(v.C)} × a(${PT(o.r)}, ${v.n})${v.X ? ` plus the PV of the ${M(v.X)} extra` : ''} = <b>${M(o.VA)}</b> sits at period ${o.ad}.</p><p>Discount that one amount ${o.k} period${o.k === 1 ? '' : 's'} back to period ${v.val}: ${M(o.VA)} ÷ (1 + ${PT(o.r)})<sup>${o.k}</sup> = <b>${M(o.VV)}</b>. Starting later costs ${M(o.lost)} of value.</p>`;
  },
  excel(v, o) {
    const f = `PV(${exRate(v.apr, v.m)}, ${v.n}, -${v.C}, ${ng(v.X)})`;
    return [[`Value at period ${o.ad}`, '=' + f, M(o.VA)], [`Value at period ${v.val}`, `=${f}/(1+${exRate(v.apr, v.m)})^${o.k}`, M(o.VV)]];

  ti(v, o) {
    return [

      { kind: 'tvm', title: `2. Move it back ${o.k} periods`, N: o.k, I: v.apr, PV: 0, PMT: 0, FV: -o.VA, PY: v.m, CY: v.m, solve: 'PV', expect: o.VV, note: 'FV is step 1’s answer, entered negative.' },
    ];
  },
  watch: [
    '<b>Off by one.</b> First payment at month 24 means the annuity value sits at month 23, so you discount 23 months, not 24.',
    '<b>A final extra amount</b> goes in FV on the same screen as the payments.',
    '<b>If the question values it at another date</b> (graduation, one year from now), discount only to that date.',
  ],

    'Annuity valuation period': (o) => o.ad,
    'Periods to discount back': (o) => o.k,
    'Value at the annuity date': (o) => o.VA,
    'Value at requested date': (o) => o.VV,
    'Value lost from waiting': (o) => o.lost,
  },
});

/* ================================================================ 03 Loan payments and rates */
function amortize(P, r, pay, n, B = 0, finalPay = null) {
  const rows = [];
  let bal = P;
  for (let j = 1; j <= n; j++) {
    const int = bal * r;
    let pmt = pay + (j === n ? B : 0);
    if (finalPay != null && j === n) pmt = finalPay;
    const prin = pmt - int;
    bal = bal + int - pmt;
    rows.push({ x: j, int, prin, bal: Math.abs(bal) < 1e-6 ? 0 : bal });
  }
  return rows;
}

    { k: 'down', label: 'Down payment today', kind: 'money', def: 0, min: 0, max: 1e10, modes: ['amt'] },
  ],
  examples: [
    { id: 'LP-01', title: 'Car loan', mode: 'pmt', v: { P: 10000, apr: 12, m: 12, n: 48, B: 0 } },

    { id: 'LP-04', title: 'Used vehicle', mode: 'pmt', v: { P: 18500, apr: 0, m: 12, n: 50, B: 0 } },
    { id: 'LP-05', title: 'Affordable car', mode: 'amt', v: { PMT: 550, apr: 6.6, m: 12, n: 60, down: 4500 } },
    { id: 'LP-06', title: 'Equipment budget', mode: 'amt', v: { PMT: 900, apr: 8.4, m: 12, n: 48, down: 3000 } },
    { id: 'LP-07', title: 'Implied car-loan rate', mode: 'rate', v: { P: 10000, PMT: 1000, n: 12, m: 12 } },

  ],
  calc(v, mode) {
    const o = { mode };
    if (mode === 'pmt') {
      o.r = pc(v.apr) / v.m;
      o.pay = -F.pmt(o.r, v.n, v.P, -v.B);
      o.total = o.pay * v.n + v.B;
      o.interest = o.total - v.P;
      o.rows = amortize(v.P, o.r, o.pay, v.n, v.B);
    } else if (mode === 'amt') {
      o.r = pc(v.apr) / v.m;
      o.loan = v.PMT * F.a(o.r, v.n);
      o.price = o.loan + v.down;
      o.rows = amortize(o.loan, o.r, v.PMT, v.n);
    } else if (mode === 'rate') {
      need(v.PMT * v.n > v.P, 'Total payments must be more than the amount borrowed for a positive rate.');
      o.r = F.rate(v.n, -v.PMT, v.P, 0);
      o.apr = o.r * v.m;
      o.ear = Math.pow(1 + o.r, v.m) - 1;
      o.interest = v.PMT * v.n - v.P;
      o.rows = amortize(v.P, o.r, v.PMT, v.n);
    } else {
      o.r = pc(v.apr) / v.m;
      need(v.PMT > v.P * o.r, `The payment has to be more than one period’s interest (${M(v.P * o.r)}), or the balance never shrinks.`);
      o.nx = F.nper(o.r, -v.PMT, v.P, 0);
      o.N = Math.ceil(o.nx - 1e-9);
      o.bN1 = v.P * Math.pow(1 + o.r, o.N - 1) - v.PMT * F.s(o.r, o.N - 1);
      o.fin = o.bN1 * (1 + o.r);
      o.rows = amortize(v.P, o.r, v.PMT, o.N, 0, o.fin);
    }
    return o;
  },
  out(v, o, mode) {
    const rate = cell('Rate per month', o.r, 'pct4');
    if (mode === 'pmt') return [rate, cell('Monthly payment', o.pay), cell('Total paid', o.total), cell('Total interest', o.interest)];

    draw(plot, fig, v, o) {
      drawBars(plot, fig, {

        data: o.rows.map((r) => ({ x: r.x, prin: r.prin, int: r.int, tip: `<b>Payment ${r.x}</b><br>Interest <span class="num">${M(r.int)}</span><br>Principal <span class="num">${M(r.prin)}</span><br>Balance after <span class="num">${M(r.bal)}</span>` })),
        xLabel: (d) => String(d.x),
      });
    },
  }],
  text(v, o, mode) {
    const r0 = o.rows[0], rl = o.rows[o.rows.length - 1];
    if (mode === 'pmt') {
      let t = `<p>Each ${M(o.pay)} payment first covers interest, ${PT(o.r)} of what you still owe, and the rest pays down the loan. The first payment is ${M(r0.int)} interest and ${M(r0.prin)} principal; by the last, interest is only ${M(rl.int)}.</p><p>Over ${v.n} payments you pay <b>${M(o.total)}</b>, so the loan costs <b>${M(o.interest)}</b> in interest.</p>`;
      if (v.B > 0) t += `<p class="aside">The ${M(v.B)} balloon is paid with the last payment. Because part of the loan waits until the end, the regular payments are smaller.</p>`;
      return t;
    }
    if (mode === 'amt') return `<p>A loan is the PV of its payments. ${v.n} payments of ${M(v.PMT)} at ${PT(o.r)} a month are worth <b>${M(o.loan)}</b> today, the most a lender will advance. With ${M(v.down)} down, the highest price you can pay is <b>${M(o.price)}</b>.</p>`;
    if (mode === 'rate') return `<p>Borrowing ${M(v.P)} and repaying ${v.n} × ${M(v.PMT)} = ${M(v.PMT * v.n)} means a rate of <b>${PT(o.r)} a month</b>. That’s an APR of ${PCT(o.apr, 2)} (× 12) or an EAR of ${PCT(o.ear, 2)} once monthly compounding counts.</p><p class="aside">${M(o.interest)} of interest looks like ${PCT(o.interest / v.P, 1)} of the loan, but you pay the loan down as you go, so the rate is much higher than that ratio suggests.</p>`;
    return `<p>At ${M(v.PMT)} a month, the balance needs <b>${fmt.num(o.nx, 4)} payments</b>, so it takes ${o.N} months. After ${o.N - 1} full payments you owe ${M(o.bN1)}. That grows one month of interest into a final payment of <b>${M(o.fin)}</b>.</p>`;
  },

    if (mode === 'amt') return [['Largest loan', `=PV(${rt}, ${v.n}, -${v.PMT})`, M(o.loan)], ['Highest price', `=PV(${rt}, ${v.n}, -${v.PMT})+${v.down}`, M(o.price)]];
    if (mode === 'rate') return [['APR', `=RATE(${v.n}, -${v.PMT}, ${v.P})*${v.m}`, PCT(o.apr, 4)], ['EAR', `=(1+RATE(${v.n}, -${v.PMT}, ${v.P}))^${v.m}-1`, PCT(o.ear, 4)]];

        tip: (i) => `<b>After payment ${i}</b><br>Balance <span class="num">${M(o.path[i])}</span>${o.path2 && Number.isFinite(o.path2[i]) ? `<br>With the extra payment <span class="num">${M(o.path2[i])}</span>` : ''}`,
